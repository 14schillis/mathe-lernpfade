<script>
const g=id=>document.getElementById(id),EZ='cubic-bezier(.45,0,.2,1)';
/* Mini-Formelsatz: ^ _ Exponent/Index, {a|b} Bruch, #n{..} Farbe n, [..] Markierung, * = Malpunkt, §( §) = Mengenklammern, log aufrecht */
function M(s){let o='',i=0,st=[];
const arg=()=>{if(s[i]=='{'){let d=0,j=i;for(;j<s.length;j++){if(s[j]=='{')d++;else if(s[j]=='}'){d--;if(!d)break}}const t=s.slice(i+1,j);i=j+1;return t}return s[i++]};
const E=h=>{o+=h;BIG=false};
while(i<s.length){const c=s[i];
if(c=='^'||c=='_'){i++;const t=arg(),f=t.includes('|')?' f':'',hs=BIG&&c=='^'?' hs':'',tg=c=='^'?'sup':'sub';o+=`<${tg} class="${(f+hs).trim()}">${M(t)}</${tg}>`;BIG=false}
else if(c=='{'){const t=arg();let d=0,k=-1;for(let j=0;j<t.length;j++){if(t[j]=='{')d++;else if(t[j]=='}')d--;else if(t[j]=='|'&&!d){k=j;break}}
E(k<0?M(t):`<span class="fr"><span>${M(t.slice(0,k))}</span><span>${M(t.slice(k+1))}</span></span>`)}
else if(c=='√'){i++;const t=arg();o+=`<span class="sq"><span class="ov">${M(t)}</span></span>`;BIG=false}
else if(c=='#'){const n=s[i+1];i+=2;const t=arg();o+=`<span class="c${n}">${M(t)}</span>`}
else if(c=='['){const j=s.indexOf(']',i);E('<span class="h">'+M(s.slice(i+1,j))+'</span>');i=j+1}
else if(c=='§'){E(s[i+1]=='('?'{':'}');i+=2}
else if(c=='('){const big=s[i+1]=='{'||(s[i+1]=='#'&&s[i+3]=='{'&&s[i+4]=='{');st.push(big);E(big?'<span class="bp">(</span>':'(');i++}
else if(c==')'){const big=st.pop();E(big?'<span class="bp">)</span>':')');if(big)BIG=true;i++}
else if(s.startsWith('log',i)){E('log');i+=3}
else if(s.startsWith('ln',i)){E('ln');i+=2}
else if(/[a-z]/i.test(c)){E('<i>'+c+'</i>');i++}
else if(c=='*'){E('·');i++}else if(c=='-'){E('−');i++}else{E(c);i++}}return o}
let BIG=false;
const T=s=>s.replace(/\$([^$]+)\$/g,(_,x)=>{BIG=false;return '<m>'+M(x)+'</m>'});
/* Token-Zeilen: "schluessel.cN<quellen:inhalt", cN = Farbe, "*" = Malpunkt */
const PT=(s,r,t,w,x)=>`<div class="${w||'row'} rv" data-s="${s}"${x?` data-x="${x}"`:''} data-r="${r}"><div class="eq tks"></div>${t?`<span class="tag">${t}</span>`:''}</div>`;
const RES=(s,m,sub,x)=>`<div class="res rv" data-s="${s}"${x?` data-x="${x}"`:''}><div class="eq">$${m}$</div>${sub?`<div class="rs">${sub}</div>`:''}</div>`;
const FMA='<br><span class="fm">✓ Form $a^x=b$</span>',FMG='<br><span class="fm">✓ Gleiche Basis</span>';
const TASK=(bd,t,e,q,k,ml,rows,res,al,arows,ares)=>{const n=rows.length,A=n+1,one=k<1,w=one?' t1':'';
const fx=tg=>!tg?tg:one?tg.replace(/<br>(<span class="fm")/g,' $1').replace(/<br>/g,' &nbsp;·&nbsp; '):tg;
const blk=(Rw,off,x,first)=>Rw.map(([r,tg],i)=>i==0?PT(off,r,fx(tg||first),'row a0'+w,x):PT(off+i,r,fx(tg),'row'+w,x)).join('');
return {t:'Aufgabe 5 '+bd+')',bd,e,q,k,alt:A,b:[...ml,'Alternative: Gleiche Basis herstellen',...al],
h:`<div class="stack">${blk(rows,0,A,'Ausgangsaufgabe')}${RES(n,res[0],res[1],A)}${blk(arows,A,0,'Alternative: gleiche Basis')}${RES(A+arows.length,ares[0],ares[1])}</div>`}};
const WK=(s,n,ttl,law,ex,use)=>`<div class="card tool fd" data-s="${s}" style="cursor:default"><span class="lb">Werkzeug ${n} · ${ttl}</span><div class="eq">${law}</div><div class="ex">$${ex}$</div><div class="vl">${use}</div></div>`;
const RC=(l,m,v)=>`<div class="card rc" style="cursor:default"><span class="lb">${l})</span><div class="eq">$${m}$</div><div class="vl">${v}</div></div>`;

const S=[
{t:'Die Strategie für alle Aufgaben',e:'$a^x=b$',q:'Eine verlässliche Strategie für jede Exponentialgleichung.',b:['Auf aˣ = b bringen','Logarithmus','Taschenrechner','Alternative'],
h:`<div class="stack"><div class="row ziel"><div class="eq">$#3{a}^{x}=#4{b}$</div><span class="ar">⇒</span><div class="eq">$x=log_{#3{a}}(#4{b})$</div><span class="tag">Basis <b class="c3">a</b> · Zahl <b class="c4">b</b></span></div>
<div class="two">${WK(1,1,'Auf a^x = b bringen','$#3{a}^{x}=#4{b}$','2*3^x=√{12} ⇒ 3^x={√{12}|2}','Potenz mit $x$ allein auf eine Seite')}${WK(2,2,'Logarithmus','$a^x=b ⇒ x=log_a(b)$','3^x=2 ⇒ x=log_3(2)','Ist der Exponent ein Term, wird er zum „x“')}${WK(3,3,'Taschenrechner','$log_a(b)$ eingeben','log_5(3125)=5','Ohne Basis-Taste: $log_a(b)={ln(b)|ln(a)}$')}${WK(4,4,'Alternative: gleiche Basis','$a^u=a^v ⇒ u=v$','7^{2t−1}=7^3 ⇒ 2t−1=3','Bei jeder Aufgabe hinter dem Button „Alternative“')}</div></div>`},

TASK('a','5^x=3125','$5^x=3125$','Steht die Gleichung schon in der Form $a^x=b$?',1,
['Logarithmus','Taschenrechner','Lösungsmenge'],
[['A:#3{5}^{#1{x}} = N.c4:3125','Ausgangsaufgabe<br>schon in der Form $a^x=b$'],
 ['X.c1<A:x = lg:log sb.c3<A:_{5} p1:( n.c4<N:3125 p2:)','Definition des Logarithmus<br>$a^x=b ⇒ x=log_a(b)$'],
 ['X.c1:x = V<lg,sb,p1,n,p2:5','Taschenrechner:<br>$log_5(3125)$ eingeben']],
['L=§(5§)','Probe: $5^5=3125$ ✓'],
['3125 zerlegen','Als Potenz schreiben','Exponentenvergleich','Ergebnis vergleichen'],
[['A:#3{5}^{#1{x}} = N:3125'],
 ['A:#3{5}^{#1{x}} = N1<N:5*5*5*5*5','$3125=5*5*5*5*5$<br>(immer wieder durch 5 teilen)'],
 ['A:#3{5}^{#1{x}} = N2<N1:#3{5}^{#4{5}}','Fünf Faktoren: $5*5*5*5*5=5^5$'],
 ['X.c1<A:x = Y.c4<N2:5','Exponentenvergleich<br>$a^u=a^v ⇒ u=v$'+FMG]],
