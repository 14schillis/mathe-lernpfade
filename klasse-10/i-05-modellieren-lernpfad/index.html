<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>1.5 Modellieren mit Funktionen</title>
<style>
:root{
  --bg:#f5f6f8; --card:#fff; --ink:#1b2430; --soft:#4a5566; --line:#dde2e9;
  --accent:#1f4e79; --accent-soft:#eaf1f8; --note:#eef4fa;
  --lin:#2466a8; --lin-bg:#e6effa;
  --exp:#b0601c; --exp-bg:#fbeee1;
  --pt:#2d3a48;
  --mfont:ui-serif,"New York","Cambria Math",Cambria,"STIX Two Math","Times New Roman",Georgia,serif;
  --serif:ui-serif,"New York","Iowan Old Style",Georgia,serif;
  --sans:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",system-ui,"Helvetica Neue",Arial,sans-serif;
  --shadow:0 1px 0 rgba(27,36,48,.04),0 14px 28px -22px rgba(27,36,48,.45);
  --kh:0px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
html{overflow-x:clip}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);
  font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
[hidden]{display:none!important}

header{background:var(--card);border-bottom:1px solid var(--line)}
.head{max-width:1200px;margin:0 auto;padding:8px 16px 10px;display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px}
.ttl{flex:1 1 100%;min-width:0}
.kap{font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:600}
h1{margin:0;font:700 clamp(1.1rem,2.4vw,1.35rem)/1.25 var(--serif);color:var(--accent);letter-spacing:-.005em}
.act{display:flex;align-items:center;gap:10px;margin-left:auto}
.tmode{display:inline-block;margin-left:8px;text-transform:none;letter-spacing:0;vertical-align:1px;font-size:.72rem;font-weight:700;color:#7a3907;background:#fbeadb;border:1px solid #e3c19c;border-radius:20px;padding:2px 11px;white-space:nowrap}
@media (min-width:1000px){.ttl{flex:1 1 0}.act{margin-left:0}}
nav.parts{display:flex;align-items:center;gap:12px;flex:0 0 auto}
nav.parts button{position:relative;width:44px;height:44px;padding:0;border:1.5px solid var(--line);background:#fff;border-radius:50%;
  font:700 .92rem var(--sans);color:var(--soft);cursor:pointer}
nav.parts button+button::before{content:"";position:absolute;right:100%;top:50%;width:12px;border-top:2px solid var(--line)}
nav.parts button.done{border-color:#9fd0ac;background:#e4f3e7;color:#2b7a3d}
nav.parts button.done+button::before{border-top-color:#9fd0ac}
nav.parts button[aria-current="step"]{background:var(--accent);border-color:var(--accent);color:#fff}
nav.parts button:disabled{opacity:.4;cursor:default}
nav.parts button:focus-visible{outline:3px solid #7ba9d0;outline-offset:2px}
@media (max-width:520px){nav.parts{display:grid;grid-template-columns:repeat(8,minmax(0,1fr));gap:4px;flex:1 1 100%}
  nav.parts button{width:auto;min-width:0;border-radius:12px}nav.parts button+button::before{display:none}}

main{max-width:1200px;margin:0 auto;padding:12px 16px calc(30px + var(--kh))}
html{scroll-padding-bottom:calc(var(--kh) + 12px)}
.phead{display:flex;flex-wrap:wrap;align-items:baseline;gap:2px 10px;margin:0 0 10px}
.phead .pn{white-space:nowrap}
.phead .pn{font-size:.78rem;letter-spacing:.08em;text-transform:uppercase;color:var(--soft);font-weight:650}
h2{margin:0;font:700 1.35rem/1.3 var(--serif);color:var(--accent)}
h3{margin:.2em 0 .3em;font-size:1.02rem;color:var(--accent)}
p{margin:.45em 0}
.small{font-size:.88rem;color:var(--soft)}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
@media (min-width:900px){
  .stage{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}
  .stage .viz{position:sticky;top:10px}
}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 20px;box-shadow:var(--shadow)}
.side>.card+.card,.side>*+*{margin-top:10px}
.viz .card{padding:10px 12px}
.fade{animation:fade .3s ease-out}
@keyframes fade{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.fade{animation:none}}

/* Mathe */
.m{font-family:var(--mfont);white-space:nowrap}
.m i,.mi{font-style:italic}
.m sup,.eq sup{font-size:.66em;vertical-align:.72em;line-height:0}
.m sub,.eq sub{font-size:.66em;line-height:0}
.eq{font-family:var(--mfont);font-size:clamp(1.15rem,2.6vw,1.4rem);text-align:center;margin:.35em 0;line-height:1.6}
.eq.big{font-size:clamp(1.25rem,3vw,1.6rem)}
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .12em;line-height:1.2}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding:0 .2em .05em}
.fr>span:last-child{padding:.05em .2em 0}
.rt{display:inline-flex;vertical-align:middle;position:relative;padding-left:1.12em;margin:0 .12em}
.rt .ri{position:absolute;left:.05em;bottom:54%;font-size:.6em;line-height:1}
.rt .rsv{position:absolute;left:.42em;top:0;width:.7em;height:100%;overflow:visible}
.rt .rr{border-top:1.4px solid currentColor;padding:.12em .12em 0 .08em;display:inline-flex;align-items:center}
.pw{display:inline-flex;align-items:center;vertical-align:middle}
.pw .pa{font-size:2.1em;line-height:1;font-weight:300}
.pw .px{font-size:.72em;align-self:flex-start;margin-left:.05em}
.lin{color:var(--lin)} .exp{color:var(--exp)}
.v{font-weight:700;padding:0 .12em;border-radius:4px}
.v.lin{background:var(--lin-bg)} .v.exp{background:var(--exp-bg)}
.term{font-family:var(--mfont);font-size:clamp(1.25rem,3vw,1.55rem);text-align:center;padding:6px 8px;border-radius:9px;background:#f7f9fb;border:1px solid var(--line);margin:.4em 0}

/* Tabellen */
table.dt{border-collapse:collapse;width:100%;font-size:.95rem}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 6px;text-align:center}
table.dt th{background:#f1f4f7;font-weight:600;color:var(--soft);font-size:.86rem}
table.dt td.num{font-variant-numeric:tabular-nums}
table.dt.h th:first-child{text-align:left;white-space:nowrap}
.only-wide{display:none}
@media (min-width:900px){.only-wide{display:block}.only-narrow{display:none}}

/* Fingerabdruck */
.seg{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.seg button{flex:1 1 160px;min-height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);font-weight:600;cursor:pointer}
.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.seg button:focus-visible{outline:3px solid #7ba9d0;outline-offset:2px}
.fp{display:grid;grid-template-columns:minmax(52px,.7fr) minmax(34px,.45fr) minmax(70px,1fr) minmax(120px,1.8fr);font-variant-numeric:tabular-nums}
.fp>div{display:contents}
.fp .hd>span{font-size:.8rem;color:var(--soft);font-weight:600;padding:4px 6px;border-bottom:1px solid var(--line);align-self:end}
.fp .vr>span{padding:5px 6px;border-bottom:1px solid #eef1f4;display:flex;align-items:center;min-height:34px}
.fp .vr>span.val{font-weight:650;justify-content:flex-end;padding-right:14px}
.fp .br>span{min-height:0;height:0;position:relative}
.fp .br .dv{position:absolute;left:4px;right:4px;top:-14px;height:28px;display:flex;align-items:center;gap:8px;z-index:1}
.fp .br .dv b{white-space:nowrap;min-width:3.6em;font-size:.95rem;text-align:right;padding:1px 6px;border-radius:6px;background:#fff;border:1px solid var(--line)}
.fp .br .dv i{display:block;height:9px;border-radius:5px;background:#9db4c9}
.fp .br .dv.q i{background:#c9a887}
.fp .br .arr{position:absolute;right:2px;top:-14px;height:28px;display:flex;align-items:center;color:#9aa4b1;font-size:.9rem}
.fpsum{margin-top:10px;font-size:.93rem;color:var(--soft);min-height:1.5em}

/* Diagramm */
.chart{width:100%;position:relative;touch-action:manipulation}
.chart svg{display:block;width:100%;height:auto;overflow:visible;-webkit-user-select:none;user-select:none}
.chart .hit{cursor:pointer}
.legend{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 16px;font-size:.85rem;color:var(--soft);margin-top:4px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend svg{width:26px;height:10px;display:inline-block}
.draw{stroke-dasharray:1;stroke-dashoffset:1;animation:draw 1.1s ease-out forwards}
@keyframes draw{to{stroke-dashoffset:0}}
@media (prefers-reduced-motion:reduce){.draw{animation:none;stroke-dashoffset:0}}

/* Bedienelemente */
button{font-family:inherit;font-size:1rem;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
.btn{border:1.5px solid var(--accent);background:var(--accent);color:#fff;border-radius:12px;padding:10px 18px;min-height:48px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.btn.ghost{background:#fff;color:var(--accent)}
.btn.quiet{background:#fff;color:var(--soft);border-color:#c3ccd7;font-weight:500}
.btn:disabled{opacity:.45;cursor:default}
.btn:focus-visible{outline:3px solid #7ba9d0;outline-offset:2px}
@media (hover:hover){.btn:hover:not(:disabled){filter:brightness(1.08)} .btn.ghost:hover:not(:disabled),.btn.quiet:hover:not(:disabled){background:var(--accent-soft);filter:none}}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:12px;align-items:center}
.tabs{display:flex;gap:8px;margin-bottom:10px}
.tabs button{flex:1 1 0;min-height:48px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-weight:600;cursor:pointer;color:var(--soft);padding:6px 8px;line-height:1.25}
.tabs button[aria-selected="true"].tl{border-color:var(--lin);background:var(--lin-bg);color:var(--lin)}
.tabs button[aria-selected="true"].te{border-color:var(--exp);background:var(--exp-bg);color:var(--exp)}
.tabs button .ok{color:#2b7a3d;margin-left:4px}
.tabs button:focus-visible{outline:3px solid #7ba9d0;outline-offset:2px}
.sl{display:flex;align-items:center;gap:8px;margin:.5em 0}
.sl .stp{flex:0 0 auto;width:46px;height:46px;border:1.5px solid var(--line);border-radius:12px;background:#fff;font-size:1.35rem;color:var(--accent);cursor:pointer;line-height:1}
.sl .stp:focus-visible{outline:3px solid #7ba9d0;outline-offset:2px}
input[type=range]{flex:1 1 auto;min-width:0;height:46px;margin:0;background:transparent;-webkit-appearance:none;appearance:none;touch-action:pan-y}
input[type=range]::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:#d3dae3}
input[type=range]::-moz-range-track{height:6px;border-radius:3px;background:#d3dae3}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:28px;height:28px;border-radius:50%;background:var(--thumb,var(--accent));border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35);margin-top:-11px}
input[type=range]::-moz-range-thumb{width:24px;height:24px;border-radius:50%;background:var(--thumb,var(--accent));border:3px solid #fff;box-shadow:0 1px 4px rgba(0,0,0,.35)}
input[type=range]:focus-visible{outline:3px solid #7ba9d0;outline-offset:2px}
.saved{display:inline-block;padding:3px 10px;border-radius:14px;background:#e4f3e7;color:#2b7a3d;font-size:.9rem;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:44px;min-width:54px;padding:4px 8px;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;color:var(--ink);font-variant-numeric:tabular-nums}
.chip.seen{border-color:#b9c7d6}
.chip[aria-pressed="true"]{border-color:#c98a1c;background:#fdf3df;font-weight:650}
.chip:focus-visible{outline:3px solid #7ba9d0;outline-offset:2px}
.inrow{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:6px}
.inrow input{width:7.5em;min-height:46px;font:inherit;font-family:var(--mfont);font-size:1.2rem;padding:4px 10px;border:1.5px solid #b8c3d0;border-radius:12px;text-align:center}
.inrow input:focus{outline:3px solid #7ba9d0;outline-offset:1px}
.inrow label{font-family:var(--mfont);font-size:1.2rem}

/* Multiple Choice */
.mc .q{font-weight:650;margin:.2em 0}
.mc .sub{font-size:.9rem;color:var(--soft);margin:.1em 0}
.opts{display:flex;flex-direction:column;gap:7px;margin-top:8px}
.opt{display:flex;align-items:center;gap:11px;width:100%;min-height:48px;padding:7px 13px;text-align:left;border:1.5px solid var(--line);border-radius:12px;background:#fff;cursor:pointer;font-size:.98rem;line-height:1.35;color:var(--ink)}
.opt .bx{flex:0 0 auto;width:20px;height:20px;border:2px solid #9fb0c2;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;font-size:.8rem;color:#fff}
.opt.chosen{border-color:var(--accent);background:var(--accent-soft)}
.opt.chosen .bx{background:var(--accent);border-color:var(--accent)}
.opt.chosen .bx::after{content:"✓"}
.opt .mm{font-family:var(--mfont);font-size:1.12rem}
@media (hover:hover){.opt:hover:not(:disabled){border-color:#9fb8cd;background:#fbfcfe}.opt.chosen:hover:not(:disabled){background:var(--accent-soft)}}
.opt:focus-visible{outline:3px solid #7ba9d0;outline-offset:2px}
.opt.ok{border-color:#2b8a3e;background:#eaf6ee;color:var(--ink)}
.opt.ok .bx{background:#2b8a3e;border-color:#2b8a3e}
.opt.no{border-color:#dcb4b4;background:#fbf3f3;color:#7a5a5a}
.opt.faded{opacity:.55}
.opt:disabled{cursor:default}
.fb{margin-top:10px;padding:9px 13px;border-radius:12px;font-size:.96rem}
.fb.ok{background:#eaf6ee;border-left:4px solid #2b8a3e}
.fb.hint{background:#fdf6e7;border-left:4px solid #d6a23a}
.fb.neutral{background:#f1f4f7;border-left:4px solid #8c96a4}
.fb p{margin:.25em 0}
.note{background:var(--note);border:1px solid #c9dcec;border-left:5px solid var(--accent);border-radius:12px;padding:10px 14px}
.merk{border:2px solid var(--accent);border-radius:14px;padding:12px 16px;background:#fff}
.merk .ttl{font-size:.76rem;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);font-weight:700;margin-bottom:2px}
.merk p{margin:.2em 0;font-weight:600}
.step{border-top:1px dashed var(--line);padding-top:10px;margin-top:10px}
.stepline{font-family:var(--mfont);font-size:clamp(1.1rem,2.6vw,1.3rem);text-align:center;margin:.35em 0;line-height:1.6}
.why{font-size:.86rem;color:var(--soft);text-align:center;margin:-.1em 0 .3em}
.info{display:grid;grid-template-columns:auto auto 1fr;gap:4px 12px;align-items:baseline;font-variant-numeric:tabular-nums}
.info .ih{grid-column:1/-1;font-weight:700;color:var(--accent)}
.info .lab{font-size:.9rem;color:var(--soft)}
.info .dev{font-size:.9rem;text-align:right}
.info .rl{font-weight:650}
.madt{width:100%;border-collapse:collapse;font-size:.93rem;font-variant-numeric:tabular-nums}
.madt th,.madt td{padding:6px 6px;border-bottom:1px solid var(--line);text-align:right}
.madt th:first-child,.madt td:first-child{text-align:left}
.madt th{font-size:.82rem;color:var(--soft);font-weight:600}
.madt tr.best td{font-weight:700}
details.more{margin-top:8px;border:1px dashed #b9c4d0;border-radius:9px;padding:0 12px}
details.more summary{cursor:pointer;min-height:44px;display:flex;align-items:center;color:var(--soft);font-size:.92rem}
details.more p{font-size:.92rem;margin:.3em 0 .6em}
.prog{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;align-items:baseline;font-variant-numeric:tabular-nums}
.prog .big{font-weight:700}

/* Zahlenfeld (nur Touch, Abschnitt 4) */
.kpad{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--accent);padding:10px 12px calc(10px + env(safe-area-inset-bottom));
  display:flex;flex-wrap:wrap;gap:6px;justify-content:center;border-radius:16px 16px 0 0;box-shadow:0 -10px 28px -14px rgba(20,40,70,.55)}
.kpad .key{flex:1 1 44px;max-width:72px;min-width:44px;height:50px;border:0;border-radius:11px;background:#f4f7fa;color:var(--ink);font:600 1.3rem var(--mfont);cursor:pointer;-webkit-user-select:none;user-select:none}
.kpad .key:active{background:#c9dbf0}
.kpad .key.fn{background:#2f6a9f;color:#fff}
.kpad .key.go{flex:2 1 110px;max-width:170px;background:#8fc2ee;color:#0b2540;font:700 1rem var(--sans)}

/* Kartenreihenfolge (Drag & Drop) */
.sort{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;position:relative}
.dcard{position:relative;z-index:1;display:flex;align-items:center;gap:10px;background:#fff;border:1.5px solid #cfd7e1;border-radius:10px;
  padding:8px 12px;min-height:58px;cursor:grab;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
  box-shadow:0 1px 2px rgba(20,40,70,.06);-webkit-tap-highlight-color:transparent}
.dcard .no{flex:0 0 auto;width:28px;height:28px;border-radius:50%;background:#eef1f5;color:var(--soft);font-weight:700;font-size:.88rem;display:flex;align-items:center;justify-content:center}
.dcard .tx{flex:1 1 auto;line-height:1.3}
.dcard .grip{flex:0 0 auto;width:12px;height:18px;fill:#a3afbd}
.dcard.moved{border-color:#9fb8cd;background:#f7fafd}
.dcard:focus-visible{outline:3px solid #7ba9d0;outline-offset:2px}
.sort.dragging .dcard{transition:transform .18s ease}
.sort.dragging .dcard.drag{transition:box-shadow .15s ease;z-index:5;cursor:grabbing;border-color:var(--accent);background:#fff;box-shadow:0 12px 26px rgba(20,40,70,.22)}
.dcard.settle{transition:transform .16s ease!important;z-index:5}
.sort .ph{position:absolute;left:0;right:0;z-index:0;border:2px dashed #6f9cc4;border-radius:10px;background:#eaf2fa;pointer-events:none;transition:top .18s ease}
.kbhint{font-size:.78rem;color:#8a94a2;margin:.6em 0 0}
@media (hover:none){.kbhint{display:none}}
@media (prefers-reduced-motion:reduce){.sort.dragging .dcard,.dcard.settle,.sort .ph{transition:none!important}}
.sort.solved li{border-color:#9ccaa8;background:#f3faf5}
.cyc svg{display:block;width:100%;height:auto}
.cyc .nd{opacity:1}
.cyc.anim .nd{opacity:0;animation:fade .35s ease-out forwards}
@media (prefers-reduced-motion:reduce){.cyc.anim .nd{opacity:1;animation:none}}
.sum{margin:.3em 0;padding-left:1.4em}
/* Zwei Wege zur Modellfunktion */
.ways .wgrid{display:grid;grid-template-columns:minmax(0,1fr);gap:12px}
@media (min-width:900px){.ways .wgrid{grid-template-columns:repeat(2,minmax(0,1fr))}}
.way{border:1px solid var(--line);border-radius:12px;padding:10px 12px;background:#fbfcfd}
.way .wh{font-weight:700;color:var(--accent);margin-bottom:6px}
.wbody{display:grid;grid-template-columns:minmax(0,1fr);gap:8px 14px}
@media (min-width:600px){.wbody{grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);align-items:start}}
.wsvg{display:block;width:100%;height:auto;background:#fff;border:1px solid #e3e7ec;border-radius:8px}
.cap{margin:.35em 0 0;font-size:.88rem;line-height:1.35;min-height:1.35em}
.cap.c1{font-weight:650;color:var(--accent)}
.cap.c2{color:var(--soft)}
.wsteps{margin:0;padding-left:1.3em;font-size:.88rem;line-height:1.4}
.wsteps li{margin:.15em 0}
.btn.sm{min-height:44px;padding:6px 12px;font-size:.88rem;margin-top:8px}
.wnote{margin-top:12px}
.wnote p{margin:.25em 0}
.wnote ul{margin:.2em 0;padding-left:1.2em}
.sum li{margin:.3em 0}
</style>
</head>
<body>
<header>
  <div class="head">
    <div class="ttl">
      <div class="kap">Mathematik 10 · 1.5 <span class="tmode" id="tmode" hidden>Lehrermodus</span></div>
      <h1>Modellieren mit Funktionen</h1>
    </div>
    <nav class="parts" id="nav" aria-label="Abschnitte"></nav>
    <div class="act"><button class="btn quiet" id="restart">Neu starten</button></div>
  </div>
</header>
<main id="app"></main>
<div class="kpad" id="kpad" role="group" aria-label="Zahlen eingeben" hidden></div>
<script>
(function(){
"use strict";

/* ================= Daten & Modelle ================= */
var T=[0,2,4,6,8,10,12,14];
var Y=[1100,1382,1772,2242,2660,3030,3492,3969];
var Y0=2005, N=T.length;
var LIN="#2466a8", EXP="#b0601c", PT="#2d3a48", AMB="#c98a1c";

/* Zwei-Punkte-Modelle aus erstem und letztem Messwert */
var M2=(Y[N-1]-Y[0])/(T[N-1]-T[0]);
var A2=Math.pow(Y[N-1]/Y[0],1/(T[N-1]-T[0]));
function g2(t){return Y[0]+M2*t;}
function f2(t){return Y[0]*Math.pow(A2,t);}

/* Ausgleichsrechnung (kleinste Quadrate) */
function linReg(xs,ys){
  var n=xs.length,mx=0,my=0,i,sxy=0,sxx=0;
  for(i=0;i<n;i++){mx+=xs[i];my+=ys[i];}
  mx/=n;my/=n;
  for(i=0;i<n;i++){sxy+=(xs[i]-mx)*(ys[i]-my);sxx+=(xs[i]-mx)*(xs[i]-mx);}
  var k=sxy/sxx;return {k:k,d:my-k*mx};
}
var LR=linReg(T,Y);
var ER=linReg(T,Y.map(function(v){return Math.log(v);}));
var MC=LR.k, TC=LR.d, BC=Math.exp(ER.d), AC=Math.exp(ER.k);
function gC(t){return MC*t+TC;}
function fC(t){return BC*Math.pow(AC,t);}
function gS(t){return Y[0]+S.p3.sm*t;}          /* eigenes lineares Modell */
function fS(t){return Y[0]*Math.pow(S.p3.sa,t);} /* eigenes exponentielles Modell */
function mad(F){var s=0;for(var i=0;i<N;i++)s+=Math.abs(F(T[i])-Y[i]);return s/N;}

var DIFF=[],FAC=[];
for(var i0=1;i0<N;i0++){DIFF.push(Y[i0]-Y[i0-1]);FAC.push(Y[i0]/Y[i0-1]);}

  var neg=v<0&&Number(s)!==0;

}

/* Rückmeldetexte werden nicht gespeichert, sondern aus dem Stand rekonstruiert */
function rebuildMcFb(id,s){
  var d=Q[id];s.fb="";s.fbc="";
  if(d.type==="single"){
    if(s.solved){s.fb=d.ok;s.fbc="ok";}
    else if(s.dis.length){s.fb=d.opts[s.dis[s.dis.length-1]].hint;s.fbc="hint";}
  }else if(d.type==="open"){
    if(s.solved){s.fb=d.fb;s.fbc="neutral";}
  }else{
    if(s.solved){s.fb=d.ok;s.fbc="ok";}
    else if(s.bad.length){
      var missing=0,h="";
      d.opts.forEach(function(o,i){if(o.ok&&s.sel.indexOf(i)<0)missing++;});
      s.bad.forEach(function(i){h+="<p>"+d.opts[i].hint+"</p>";});
      if(missing)h+="<p>"+(s.bad.length?"Außerdem fehlen":"Es fehlen")+" noch zutreffende Aussagen.</p>";
      s.fb=h;s.fbc="hint";
    }
  }
}
/* prüft einen gespeicherten Stand vollständig; bei jeder Abweichung null */
function sanitizeState(o){
  var i,k,qk=Object.keys(Q);
  if(!isObj(o)||!isInt(o.part,0,7)||!isInt(o.max,0,7)||o.part>o.max)return null;
  if(!isObj(o.ord)||!isObj(o.mc))return null;
  var ord={};
  for(i=0;i<qk.length;i++){k=qk[i];if(!isPerm(o.ord[k],Q[k].opts.length))return null;ord[k]=o.ord[k].slice();}
  var mc={},mk=Object.keys(o.mc);
  for(i=0;i<mk.length;i++){
    k=mk[i];if(!Q[k])return null;
    var m=o.mc[k],d=Q[k],n=d.opts.length;
    if(!isObj(m)||!isBool(m.solved)||!isIdxList(m.dis,n)||!isIdxList(m.bad,n))return null;
    var c={sel:null,dis:m.dis.slice(),bad:m.bad.slice(),solved:m.solved,fb:"",fbc:""};
    if(d.type==="multi"){
      if(!isIdxList(m.sel,n))return null;
      c.sel=m.sel.slice();
      if(c.bad.some(function(x){return c.sel.indexOf(x)<0||!!d.opts[x].ok;}))return null;
      if(c.solved&&!d.opts.every(function(op,j){return !!op.ok===(c.sel.indexOf(j)>=0);}))return null;
    }else{
      if(!(m.sel===null||isInt(m.sel,0,n-1)))return null;
      c.sel=m.sel;
      if(c.dis.length||c.bad.length){if(d.type!=="single"||c.bad.length)return null;}
      if(d.type==="single"){
        if(c.solved?(c.sel===null||!d.opts[c.sel].ok):c.sel!==null)return null;
        if(c.dis.some(function(x){return !!d.opts[x].ok;}))return null;
      }else if(c.solved!==(c.sel!==null))return null;
    }
    rebuildMcFb(k,c);mc[k]=c;
  }
  var p2=o.p2,p3=o.p3,p4=o.p4,p5=o.p5,p6=o.p6,p7=o.p7,p8=o.p8;
  if(!isObj(p2)||!(p2.mode===null||p2.mode==="d"||p2.mode==="f")||!isBool(p2.seenD)||!isBool(p2.seenF))return null;
  if(!isObj(p3)||!(p3.tab==="lin"||p3.tab==="exp")||!isNum(p3.m,100,300)||!isNum(p3.a,1,1.2)||!(p3.sm===null||isNum(p3.sm,100,300))||!(p3.sa===null||isNum(p3.sa,1,1.2)))return null;
  if(!isObj(p4)||!isNumStr(p4.lIn)||!isNumStr(p4.eIn)||!isInt(p4.lTry,0,99)||!isInt(p4.eTry,0,99)||!isBool(p4.lOk)||!isBool(p4.lShow)||!isBool(p4.eSub)||!isBool(p4.eOk)||!isBool(p4.eShow))return null;
  if(!isObj(p5)||!(p5.sel===null||T.indexOf(p5.sel)>=0)||!isObj(p5.vis))return null;
  var vis={},vk=Object.keys(p5.vis);
  for(i=0;i<vk.length;i++){if(T.indexOf(+vk[i])<0||p5.vis[vk[i]]!==true)return null;vis[vk[i]]=true;}
  if(!isObj(p6)||!isBool(p6.shown))return null;
  if(!isObj(p7)||YEARS.indexOf(p7.year)<0||!isObj(p7.seen))return null;
  var seen={},sk=Object.keys(p7.seen);
  for(i=0;i<sk.length;i++){if(YEARS.indexOf(+sk[i])<0||p7.seen[sk[i]]!==true)return null;seen[sk[i]]=true;}
  if(!seen[p7.year])return null;
  if(!isObj(p8)||!isPerm(p8.order,CARDS.length)||!isBool(p8.solved)||!isBool(p8.finished)||!isInt(p8.moved,-1,CARDS.length-1))return null;
  if(p8.solved&&!p8.order.every(function(v,j){return v===j;}))return null;
  var f=fresh();
  f.part=o.part;f.max=o.max;f.ord=ord;f.mc=mc;
  f.p2={mode:p2.mode,seenD:p2.seenD,seenF:p2.seenF};
  f.p3={tab:p3.tab,m:p3.m,a:p3.a,sm:p3.sm,sa:p3.sa};
  f.p4={lIn:p4.lIn,lTry:p4.lTry,lOk:p4.lOk,lShow:p4.lShow,eSub:p4.eSub,eIn:p4.eIn,eTry:p4.eTry,eOk:p4.eOk,eShow:p4.eShow,
    lFb:(!p4.lOk&&!p4.lShow&&p4.lTry>0)?FBL[p4.lTry===1?0:1]:"",eFb:(!p4.eOk&&!p4.eShow&&p4.eTry>0)?FBE[p4.eTry===1?0:1]:""};

function mcHTML(id){
  var d=Q[id],s=st(id),h='<div class="mc" data-mc="'+id+'" data-step="'+id+'"><p class="q">'+d.q+'</p>'+(d.sub?'<p class="sub">'+d.sub+'</p>':'')+'<div class="opts">';
  S.ord[id].forEach(function(i){
    var o=d.opts[i],cls="opt",dis=false;
    if(d.type==="single"&&s.solved&&s.sel!==i)return;
    if(d.type==="single"){
      if(s.solved){ if(s.sel===i)cls+=" ok"; else {cls+=" faded";} dis=true; }
      else if(s.dis.indexOf(i)>=0){cls+=" no";dis=true;}
    }else if(d.type==="open"){
      if(s.sel===i)cls+=" chosen";
    }else{
      var on=s.sel.indexOf(i)>=0;
      if(s.solved){ cls+=o.ok?" ok":" faded"; dis=true; }
      else { if(on)cls+=" chosen"; if(s.bad.indexOf(i)>=0)cls+=" no"; }
    }
    h+='<button class="'+cls+'" data-i="'+i+'"'+(dis?" disabled":"")+(d.type!=="single"?' aria-pressed="'+(d.type==="multi"?(s.solved?!!o.ok:s.sel.indexOf(i)>=0):s.sel===i)+'"':"")+'>'+
      (d.type==="multi"?'<span class="bx" aria-hidden="true"></span>':"")+'<span>'+o.t+'</span></button>';
  });
  h+='</div>';
  if(d.type==="multi"&&!s.solved) h+='<div class="btnrow"><button class="btn ghost" data-check="'+id+'"'+(s.sel.length?"":" disabled")+'>Auswahl prüfen</button></div>';
  if(s.fb) h+='<div class="fb '+s.fbc+'">'+s.fb+'</div>';
  return h+'</div>';
}
function mcClick(id,i){
  var d=Q[id],s=st(id);
  if(d.type==="single"){
    if(s.solved||s.dis.indexOf(i)>=0)return;
    if(d.opts[i].ok){s.solved=true;s.sel=i;s.fb=d.ok;s.fbc="ok";S.flash="after-"+id;}
    else{s.dis.push(i);s.fb=d.opts[i].hint;s.fbc="hint";}
  }else if(d.type==="open"){
    var first=s.sel===null;s.sel=i;s.solved=true;s.fb=d.fb;s.fbc="neutral";if(first)S.flash="after-"+id;
  }else{
    if(s.solved)return;
    var k=s.sel.indexOf(i);if(k>=0)s.sel.splice(k,1);else s.sel.push(i);
    s.bad=[];s.fb="";
  }
  render();
}
function mcCheck(id){
  var d=Q[id],s=st(id),wrong=[],missing=0;
  d.opts.forEach(function(o,i){var on=s.sel.indexOf(i)>=0;if(on&&!o.ok)wrong.push(i);if(!on&&o.ok)missing++;});
  if(!wrong.length&&!missing){s.solved=true;s.fb=d.ok;s.fbc="ok";S.flash="after-"+id;}
  else{
    s.bad=wrong.slice();s.fbc="hint";
    var h="";wrong.forEach(function(i){h+="<p>"+d.opts[i].hint+"</p>";});
    if(missing)h+="<p>"+(wrong.length?"Außerdem fehlen":"Es fehlen")+" noch zutreffende Aussagen.</p>";
    s.fb=h;
  }
  render();
}

/* ================= Diagramm (SVG) ================= */
function niceStep(range){var c=[250,500,1000,2000,2500,5000,10000,20000,25000,50000];for(var i=0;i<c.length;i++)if(range/c[i]<=7)return c[i];return 100000;}
function chart(host,o){
  if(!host)return;
  var W=Math.max(260,Math.floor(host.clientWidth));
  var wide=window.innerWidth>=900;
  var H=Math.round(W*(o.ratio||(W<560?0.8:0.64)));
  var maxH=wide?Math.max(280,window.innerHeight-(o.reserve||200)):Math.max(260,Math.round(window.innerHeight*0.55));
  H=Math.max(220,Math.min(H,maxH,480));
  var fs=W<460?11.5:12.5;
  var yStep=o.yStep||niceStep(o.y1-o.y0);
  var ticksY=[];for(var v=o.y0;v<=o.y1+1e-9;v+=yStep)ticksY.push(v);
  var maxLab=Math.max.apply(null,ticksY.map(function(v){return num(v).length;}));
  var L=Math.round(maxLab*fs*0.62+16), R=14, TOP=12, B=o.tRow===false?30:46;
  var pw=W-L-R, ph=H-TOP-B;
  function X(t){return L+(t-o.t0)/(o.t1-o.t0)*pw;}
  function Yp(v){return TOP+ph-(v-o.y0)/(o.y1-o.y0)*ph;}
  var cid=host.id+"-clip";
  var h='<svg viewBox="0 0 '+W+' '+H+'" width="'+W+'" height="'+H+'" role="img" aria-label="'+(o.aria||"Diagramm")+'" font-family="Segoe UI,system-ui,-apple-system,Helvetica Neue,Arial,sans-serif" font-size="'+fs+'">';
  h+='<defs><clipPath id="'+cid+'"><rect x="'+L+'" y="'+TOP+'" width="'+pw+'" height="'+ph+'"/></clipPath></defs>';
  /* Datenbereich */
  if(o.band){
    var bx0=X(o.band[0]),bx1=X(o.band[1]);
    h+='<rect x="'+bx0+'" y="'+TOP+'" width="'+(bx1-bx0)+'" height="'+ph+'" fill="#eef2f7"/>';
    if(bx1-bx0>=90)h+='<text x="'+(bx1-6)+'" y="'+(TOP+32)+'" text-anchor="end" fill="#6b7686" font-size="'+(fs-0.5)+'">Datenbereich</text>';
  }
  /* Gitter */
  ticksY.forEach(function(v){var y=Yp(v);h+='<line x1="'+L+'" x2="'+(L+pw)+'" y1="'+y+'" y2="'+y+'" stroke="#e6e9ee"/>';
    h+='<text x="'+(L-7)+'" y="'+(y+4)+'" text-anchor="end" fill="#4a5566">'+num(v)+'</text>';});
  o.xt.forEach(function(t){var x=X(t);h+='<line x1="'+x+'" x2="'+x+'" y1="'+TOP+'" y2="'+(TOP+ph)+'" stroke="#eef0f3"/>';
    h+='<line x1="'+x+'" x2="'+x+'" y1="'+(TOP+ph)+'" y2="'+(TOP+ph+5)+'" stroke="#8a94a2"/>';
    h+='<text x="'+x+'" y="'+(TOP+ph+18)+'" text-anchor="middle" fill="#2d3a48">'+(Y0+t)+'</text>';
    if(o.tRow!==false)h+='<text x="'+x+'" y="'+(TOP+ph+34)+'" text-anchor="middle" fill="#7a8494" font-size="'+(fs-1)+'">'+t+'</text>';});
  h+='<text x="'+(L-7)+'" y="'+(TOP+ph+18)+'" text-anchor="end" fill="#7a8494" font-size="'+(fs-1)+'">Jahr</text>';
  if(o.tRow!==false)h+='<text x="'+(L-7)+'" y="'+(TOP+ph+34)+'" text-anchor="end" fill="#7a8494" font-size="'+(fs-1)+'" font-style="italic">t</text>';
  /* Achsen */
  h+='<line x1="'+L+'" x2="'+(L+pw)+'" y1="'+(TOP+ph)+'" y2="'+(TOP+ph)+'" stroke="#5b6573" stroke-width="1.3"/>';
  h+='<line x1="'+L+'" x2="'+L+'" y1="'+TOP+'" y2="'+(TOP+ph)+'" stroke="#5b6573" stroke-width="1.3"/>';
  h+='<text x="'+(L+8)+'" y="'+(TOP+14)+'" fill="#4a5566" font-weight="600" stroke="#fff" stroke-width="4" paint-order="stroke">Internetnutzer in Mio.</text>';
  /* Waagrechte Referenzlinie */
  if(o.hline){var yh=Yp(o.hline.v);
    h+='<line x1="'+L+'" x2="'+(L+pw)+'" y1="'+yh+'" y2="'+yh+'" stroke="#6f7a88" stroke-width="1.5" stroke-dasharray="7 5"/>';
    h+='<text x="'+(L+8)+'" y="'+(yh-7)+'" text-anchor="start" fill="#4f5a68" font-weight="600" stroke="#fff" stroke-width="4" paint-order="stroke">'+o.hline.label+'</text>';}
  /* Graphen */
  h+='<g clip-path="url(#'+cid+')">';
  (o.curves||[]).forEach(function(c){
    var d="",n=160,a=Math.max(o.t0,c.from!=null?c.from:o.t0),b=o.t1;
    for(var k=0;k<=n;k++){var t=a+(b-a)*k/n,v=c.f(t);var yy=Yp(v);if(yy<-2000)yy=-2000;d+=(k?"L":"M")+X(t).toFixed(1)+" "+yy.toFixed(1);}
    h+='<path d="'+d+'" fill="none" stroke="'+c.col+'" stroke-width="'+(c.w||2.6)+'"'+(c.dash?' stroke-dasharray="'+c.dash+'"':"")+(c.op?' opacity="'+c.op+'"':"")+
      (c.anim&&!c.dash?' pathLength="1" class="draw"':"")+' stroke-linecap="round" stroke-linejoin="round"/>';
  });
  h+='</g>';
  /* Abweichungsstrecken */
  if(o.sel!=null&&o.devs){
    var ti=T.indexOf(o.sel),yv=Y[ti],xs=X(o.sel);
    o.devs.forEach(function(dv){
      var x=xs+dv.dx,y1=Yp(yv),y2=Yp(dv.f(o.sel));
      if(Math.abs(y2-y1)<1)return;
      h+='<line x1="'+x+'" x2="'+x+'" y1="'+y1+'" y2="'+y2+'" stroke="'+dv.col+'" stroke-width="2.4" stroke-dasharray="4 3"/>';
      h+='<line x1="'+(x-4)+'" x2="'+(x+4)+'" y1="'+y2+'" y2="'+y2+'" stroke="'+dv.col+'" stroke-width="2.4"/>';
    });
  }
  /* Markierte Punkte (P1, P2 …) */
  (o.rings||[]).forEach(function(r){
    var ti=T.indexOf(r.t),x=X(r.t),y=Yp(Y[ti]);
    h+='<circle cx="'+x+'" cy="'+y+'" r="11" fill="none" stroke="'+(r.col||"#1f4e79")+'" stroke-width="2.2"/>';
    if(r.label){var lx=r.side==="l"?x-16:x+12,ly=r.side==="l"?y-4:(r.side==="b"?y+28:y-14);
      h+='<text x="'+lx+'" y="'+ly+'" text-anchor="'+(r.side==="l"?"end":"start")+'" fill="'+(r.col||"#1f4e79")+'" font-weight="600" stroke="#fff" stroke-width="4" paint-order="stroke">'+r.label+'</text>';}
  });
  /* Datenpunkte */
  if(o.pts!==false){
    T.forEach(function(t,i){
      var x=X(t),y=Yp(Y[i]),sel=o.sel===t;
      if(sel)h+='<circle cx="'+x+'" cy="'+y+'" r="10" fill="#fdf3df" stroke="'+AMB+'" stroke-width="2.4"/>';
      h+='<circle cx="'+x+'" cy="'+y+'" r="'+(sel?5.5:5.2)+'" fill="'+PT+'" stroke="#fff" stroke-width="1.6"/>';
    });
    if(o.pick) T.forEach(function(t,i){
      h+='<circle class="hit" data-t="'+t+'" cx="'+X(t)+'" cy="'+Yp(Y[i])+'" r="21" fill="transparent" tabindex="-1"><title>'+(Y0+t)+': '+Y[i]+' Mio.</title></circle>';
    });
  }
  /* Beschriftungen an Stellen */
  (o.marks||[]).forEach(function(m){
    var x=X(m.t),y=Yp(m.v);
    h+='<circle cx="'+x+'" cy="'+y+'" r="5" fill="#fff" stroke="'+m.col+'" stroke-width="2.4"/>';
    if(m.label)h+='<text x="'+(x+(m.side==="l"?-10:10))+'" y="'+(y+(m.dy||4))+'" text-anchor="'+(m.side==="l"?"end":"start")+'" fill="'+m.col+'" font-weight="700" stroke="#fff" stroke-width="4" paint-order="stroke">'+m.label+'</text>';
  });
  h+='</svg>';
  if(o.legend&&o.legend.length){
    h+='<div class="legend">';
    o.legend.forEach(function(l){
      h+='<span><svg viewBox="0 0 26 10" aria-hidden="true">'+(l.pt?'<circle cx="13" cy="5" r="4" fill="'+PT+'"/>':'<line x1="1" x2="25" y1="5" y2="5" stroke="'+l.col+'" stroke-width="'+(l.w||2.6)+'"'+(l.dash?' stroke-dasharray="'+l.dash+'"':"")+(l.op?' opacity="'+l.op+'"':"")+'/>')+'</svg>'+l.label+'</span>';
    });
    h+='</div>';
  }
  host.innerHTML=h;
}

  el.innerHTML=p.tab==="lin"?termLin(p.m):termExp(p.a);D3();saveState();
}
app.addEventListener("click",function(e){
  var b=e.target.closest("button,[data-t]");if(!b||!app.contains(b))return;
  if(b.disabled)return;
  var mc=b.closest("[data-mc]");
  if(mc&&b.classList.contains("opt")){mcClick(mc.getAttribute("data-mc"),+b.getAttribute("data-i"));return;}
  if(b.hasAttribute("data-check")){mcCheck(b.getAttribute("data-check"));return;}
  var a=b.getAttribute("data-act");
  if(a&&ACT[a]){ACT[a](b);return;}
  if(b.classList.contains("hit")){pick(+b.getAttribute("data-t"));}
});
app.addEventListener("input",function(e){
  if(e.target.id==="inL"){S.p4.lIn=e.target.value;saveState();}
  if(e.target.id==="inE"){S.p4.eIn=e.target.value;saveState();}
  if(e.target.id==="sl"){var v=parseFloat(e.target.value);if(S.p3.tab==="lin")S.p3.m=v;else S.p3.a=v;updTerm();}
});

/* ---------- Drag & Drop der Karten (Pointer Events, Maus und Touch) ---------- */
var DR=null;
function dragDown(e){
  if(DR||S.part!==7||S.p8.solved)return;
  if(e.pointerType==="mouse"&&e.button!==0)return;
  var li=e.target.closest(".dcard");if(!li)return;
  var ol=li.parentNode,items=[].slice.call(ol.querySelectorAll(".dcard")),or=ol.getBoundingClientRect();
  var tops=items.map(function(x){return x.getBoundingClientRect().top-or.top;});
  var hs=items.map(function(x){return x.getBoundingClientRect().height;});
  var gap=items.length>1?Math.max(0,tops[1]-tops[0]-hs[0]):0;
  DR={li:li,ol:ol,items:items,idx:items.indexOf(li),tops:tops,hs:hs,gap:gap,id:e.pointerId,y0:e.clientY+window.scrollY,lastY:e.clientY,started:false,k:-1,lay:null,done:false};
  try{li.setPointerCapture(e.pointerId);}catch(_){}
  if(e.pointerType!=="mouse")e.preventDefault();
}
function dragLayout(k){
  var n=DR.items.length,ord=[],i;for(i=0;i<n;i++)if(i!==DR.idx)ord.push(i);ord.splice(k,0,DR.idx);
  var y=DR.tops[0],nt=[];ord.forEach(function(j){nt[j]=y;y+=DR.hs[j]+DR.gap;});return {ord:ord,nt:nt};
}
function dragUpdate(){
  var i0=DR.idx,h=DR.hs[i0],n=DR.items.length,j;
  var top=DR.tops[i0]+(DR.lastY+window.scrollY-DR.y0);
  top=Math.max(DR.tops[0]-14,Math.min(DR.tops[n-1]+DR.hs[n-1]-h+14,top));
  var c=top+h/2,k=0;for(j=0;j<n;j++){if(j!==i0&&DR.tops[j]+DR.hs[j]/2<c)k++;}
  DR.li.style.transform="translateY("+(top-DR.tops[i0]).toFixed(1)+"px) scale(1.02)";
  if(k!==DR.k){DR.k=k;DR.lay=dragLayout(k);
    for(j=0;j<n;j++)if(j!==i0)DR.items[j].style.transform="translateY("+(DR.lay.nt[j]-DR.tops[j]).toFixed(1)+"px)";
    DR.ph.style.top=DR.lay.nt[i0]+"px";
    DR.lay.ord.forEach(function(ix,pos){var no=DR.items[ix].querySelector(".no");if(no)no.textContent=pos+1;});}
}
function dragBegin(){
  DR.started=true;DR.li.classList.add("drag");DR.ol.classList.add("dragging");
  var ph=document.createElement("div");ph.className="ph";ph.style.height=DR.hs[DR.idx]+"px";ph.style.top=DR.tops[DR.idx]+"px";
  DR.ol.appendChild(ph);DR.ph=ph;requestAnimationFrame(dragAuto);
}
function dragAuto(){
  if(!DR||!DR.started||DR.done)return;
  var y=DR.lastY,H=window.innerHeight,m=70,v=0;
  if(y<m)v=-Math.ceil((m-y)/5);else if(y>H-m)v=Math.ceil((y-(H-m))/5);
  if(v){var b=window.scrollY;window.scrollBy(0,v);if(window.scrollY!==b)dragUpdate();}
  requestAnimationFrame(dragAuto);
}
function dragMove(e){
  if(!DR||e.pointerId!==DR.id||DR.done)return;
  DR.lastY=e.clientY;
  if(!DR.started){if(Math.abs(e.clientY+window.scrollY-DR.y0)<5)return;dragBegin();}
  e.preventDefault();dragUpdate();
}
function dragUp(e){
  if(!DR||e.pointerId!==DR.id||DR.done)return;
  if(!DR.started){DR=null;return;}
  DR.done=true;
  var lay=DR.lay||dragLayout(DR.idx),li=DR.li;
  var order=lay.ord.map(function(i){return +DR.items[i].getAttribute("data-c");});
  li.classList.remove("drag");li.classList.add("settle");
  li.style.transform="translateY("+(lay.nt[DR.idx]-DR.tops[DR.idx]).toFixed(1)+"px)";
  var fin=function(){S.p8.order=order;S.p8.moved=+li.getAttribute("data-c");S.p8.fb="";DR=null;render();};
  if(RED)fin();else setTimeout(fin,170);
}
function dragCancel(e){
  if(!DR||e.pointerId!==DR.id||DR.done)return;
  var st=DR.started;DR=null;if(st)render();
}
function kbMove(li,d){
  var o=S.p8.order,c=+li.getAttribute("data-c"),i=o.indexOf(c),j=i+d;if(j<0||j>=o.length)return;
  o[i]=o[j];o[j]=c;S.p8.moved=c;S.p8.fb="";render();
  var el=app.querySelector('.dcard[data-c="'+c+'"]');if(el)el.focus({preventScroll:false});
}
app.addEventListener("pointerdown",dragDown);
app.addEventListener("pointermove",dragMove);
app.addEventListener("pointerup",dragUp);
app.addEventListener("pointercancel",dragCancel);
app.addEventListener("dragstart",function(e){if(e.target.closest&&e.target.closest(".dcard"))e.preventDefault();});
app.addEventListener("keydown",function(e){
  if(e.target.classList&&e.target.classList.contains("dcard")&&(e.key==="ArrowUp"||e.key==="ArrowDown")){e.preventDefault();if(!DR)kbMove(e.target,e.key==="ArrowUp"?-1:1);return;}
  if(e.key==="Enter"&&e.target.id==="inL"){e.preventDefault();ACT.chkL();}
  if(e.key==="Enter"&&e.target.id==="inE"){e.preventDefault();ACT.chkE();}
});
document.getElementById("nav").addEventListener("click",function(e){
  var b=e.target.closest("button[data-go]");if(!b||b.disabled)return;var p=+b.getAttribute("data-go");if(p<=S.max)go(p);
});
document.getElementById("restart").addEventListener("click",function(){DR=null;clearState();S=fresh();NOSAVE=true;try{render();}finally{NOSAVE=false;}window.scrollTo(0,0);});
/* ---------- Zahlenfeld (nur Touch, nur Abschnitt 4) ---------- */
var COARSE=!!(window.matchMedia&&window.matchMedia("(pointer:coarse)").matches);
var KP=document.getElementById("kpad"),kpFor=null;
(function(){
  var keys=["1","2","3","4","5","6","7","8","9","0",",","⌫"],h="";
  keys.forEach(function(k){h+='<button type="button" class="key'+(k==="⌫"||k===","?" fn":"")+'" data-k="'+k+'" aria-label="'+(k===","?"Komma":k==="⌫"?"Löschen":k)+'">'+k+'</button>';});
  h+='<button type="button" class="key go" data-k="go">Prüfen</button>';
  KP.innerHTML=h;
  KP.addEventListener("pointerdown",function(e){e.preventDefault();});
  KP.addEventListener("click",function(e){
    var b=e.target.closest("button");if(!b)return;
    var inp=document.getElementById("inL")||document.getElementById("inE");if(!inp)return;
    var k=b.getAttribute("data-k"),v=inp.value;
    if(k==="go"){if(inp.id==="inL")ACT.chkL();else ACT.chkE();return;}
    if(k==="⌫")v=v.slice(0,-1);
    else if(k===","){if(v.indexOf(",")<0&&v.indexOf(".")<0)v+=(v===""?"0,":",");}
    else if(v.length<8)v+=k;
    inp.value=v;
    if(inp.id==="inL")S.p4.lIn=v;else S.p4.eIn=v;
    saveState();
  });
})();
function kpMeasure(){document.documentElement.style.setProperty("--kh",KP.hidden?"0px":KP.offsetHeight+"px");}
function kpSync(){
  var inp=document.getElementById("inL")||document.getElementById("inE");
  var on=COARSE&&S.part===3&&!!inp;
  KP.hidden=!on;
  document.documentElement.style.setProperty("--kh",on?KP.offsetHeight+"px":"0px");
  if(!on){kpFor=null;return;}
  inp.setAttribute("inputmode","none");
  try{inp.focus({preventScroll:true});}catch(e){}
  if(kpFor!==inp.id){kpFor=inp.id;setTimeout(function(){try{inp.scrollIntoView({block:"nearest",behavior:"smooth"});}catch(e){}},60);}
}
var rz=null;
window.addEventListener("resize",function(){clearTimeout(rz);rz=setTimeout(function(){drawOnly();kpMeasure();},120);});

S=loadState()||fresh();render();
})();
</script>
