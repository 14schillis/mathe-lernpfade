<script>
const g=id=>document.getElementById(id),EZ='cubic-bezier(.45,0,.2,1)';
/* Mini-Formelsatz: ^ _ Exponent/Index, {a|b} Bruch, #n{..} Farbe n, [..] Markierung, * = Malpunkt, §( §) = Mengenklammern, log aufrecht */
function M(s){let o='',i=0,st=[];
const arg=()=>{if(s[i]=='{'){let d=0,j=i;for(;j<s.length;j++){if(s[j]=='{')d++;else if(s[j]=='}'){d--;if(!d)break}}const t=s.slice(i+1,j);i=j+1;return t}return s[i++]};
const E=h=>{o+=h;BIG=false};
while(i<s.length){const c=s[i];
if(c=='^'||c=='_'){i++;const t=arg(),f=t.includes('|')?' f':'',hs=BIG&&c=='^'?' hs':'',tg=c=='^'?'sup':'sub';o+=`<${tg} class="${(f+hs).trim()}">${M(t)}</${tg}>`;BIG=false}
else if(c=='{'){const t=arg();let d=0,k=-1;for(let j=0;j<t.length;j++){if(t[j]=='{')d++;else if(t[j]=='}')d--;else if(t[j]=='|'&&!d){k=j;break}}
E(k<0?M(t):`<span class="fr"><span>${M(t.slice(0,k))}</span><span>${M(t.slice(k+1))}</span></span>`)}
else if(c=='#'){const n=s[i+1];i+=2;const t=arg();o+=`<span class="c${n}">${M(t)}</span>`}
else if(c=='['){const j=s.indexOf(']',i);E('<span class="h">'+M(s.slice(i+1,j))+'</span>');i=j+1}
else if(c=='§'){E(s[i+1]=='('?'{':'}');i+=2}
else if(c=='('){const big=s[i+1]=='{'||(s[i+1]=='#'&&s[i+3]=='{'&&s[i+4]=='{');st.push(big);E(big?'<span class="bp">(</span>':'(');i++}
else if(c==')'){const big=st.pop();E(big?'<span class="bp">)</span>':')');if(big)BIG=true;i++}
else if(s.startsWith('log',i)){E('log');i+=3}
else if(/[a-z]/i.test(c)){E('<i>'+c+'</i>');i++}
else if(c=='*'){E('·');i++}else if(c=='-'){E('−');i++}else{E(c);i++}}return o}
let BIG=false;
const T=s=>s.replace(/\$([^$]+)\$/g,(_,x)=>{BIG=false;return '<m>'+M(x)+'</m>'});
/* Token-Zeilen: "schluessel.cN<quellen:inhalt", cN = Farbe, "*" = Malpunkt */
const PT=(s,r,t,w)=>`<div class="${w||'row'} rv" data-s="${s}" data-r="${r}"><div class="eq tks"></div>${t?`<span class="tag">${t}</span>`:''}</div>`;
const RES=(s,m,sub)=>`<div class="res rv" data-s="${s}"><div class="eq">$${m}$</div>${sub?`<div class="rs">${sub}</div>`:''}</div>`;
const FM='<br><span class="fm">✓ Form $a^x=b$</span>';
const TASK=(bd,t,e,q,k,b,rows,res)=>({t:'Aufgabe 15 '+bd+')',bd,e,q,k,b,h:`<div class="stack">${rows.map(([r,tg],i)=>{const one=k<1,w=one?' t1':'';if(i==0)return PT(0,r,'Ausgangsaufgabe','row a0'+w);return PT(i,r,one?tg.replace(/<br>(<span class="fm")/g,' $1').replace(/<br>/g,' &nbsp;·&nbsp; '):tg,'row'+w)}).join('')}${RES(rows.length,res[0],res[1])}</div>`});
const WK=(s,n,ttl,law,ex,use)=>`<div class="card tool fd" data-s="${s}" style="cursor:default"><span class="lb">Werkzeug ${n} · ${ttl}</span><div class="eq">${law}</div><div class="ex">$${ex}$</div><div class="vl">gebraucht bei <b>${use}</b></div></div>`;
const RC=(l,m,v)=>`<div class="card rc" style="cursor:default"><span class="lb">${l})</span><div class="eq">$${m}$</div><div class="vl">${v}</div></div>`;

const S=[
{t:'Das Ziel und der Werkzeugkasten',e:'$a^x=b$',q:'Jede Gleichung wird auf die Form $a^x=b$ gebracht. Vier Werkzeuge helfen dabei.',b:['Exponent aufspalten','Negativer Exponent','Exponent in die Basis','Gleicher Exponent'],
h:`<div class="stack"><div class="row ziel"><div class="eq">$#3{a}^x=#4{b}$</div><span class="ar">⇒</span><div class="eq">$x=log_{#3{a}}(#4{b})$</div><span class="tag">Basis <b class="c3">a</b> · Zahl <b class="c4">b</b> (positiv!)</span></div>
<div class="two">${WK(1,1,'Exponent aufspalten','$a^{#1{m}+#2{n}}=a^{#1{m}}*a^{#2{n}}$','2^{#1{x}+#2{1}}=2^{#1{x}}*2^{#2{1}}','a) d) f) g) h)')}${WK(2,2,'Negativer Exponent','$a^{−n}={1|a^n}$','2^{−1}={1|2}=0,5','b) f) h)')}${WK(3,3,'Exponent in die Basis','$a^{#1{k}*x}=(a^{#1{k}})^x$','3^{#1{2}x}=(3^{#1{2}})^x=9^x','d) e) g)')}${WK(4,4,'Gleicher Exponent','$a^x*b^x=(a*b)^x$ &nbsp; $a^x/b^x=({a|b})^x$'.replace('$a^x/b^x=({a|b})^x$','$a^x/b^x=(a/b)^x$'),'2^x*3^x=6^x','b) c) d) e) g) h)')}</div></div>`},

TASK('a','2^x+3=2^{x+1}','$2^x+3=2^{x+1}$','Wie bekommt man auch rechts eine Potenz $2^x$?',1,
['Exponent aufspalten','2¹ berechnen','2ˣ subtrahieren','Zusammenfassen','Logarithmus','Lösungsmenge'],
[['A.c1:2^x + n3:3 = B.c1:2^{x#2{+1}}'],
 ['A.c1:2^x + n3:3 = B1.c1<B:2^x * B2.c2<B:2^1','Exponent aufspalten<br>$a^{m+n}=a^m*a^n$'],
 ['A.c1:2^x + n3:3 = B1.c1:2^x * C.c2<B2:2','$2^1=2$'],
 ['n3:3 = B1.c1:2^x * C.c2:2 − D.c1<A:2^x','Beide Seiten $−2^x$<br>$|−2^x$'],
 ['n3.c4:3 = E<B1,C,D:#3{2}^x','$2*2^x−1*2^x=1*2^x$'+FM],
 ['X<E:x = lg:log sb.c3<E:_{2} p1:( n3.c4:3 p2:)','Definition des Logarithmus<br>$2^x=3 ⇔ x=log_2(3)$']],
['L=§(log_{#3{2}}(#4{3})§)','Taschenrechner: $x≈1,58$']),

TASK('b','20^{−x}*5^x=12','$20^{−x}*5^x=12$','Zwei Potenzen mit verschiedenen Basen – wie führt man sie zusammen?',.9,
['Negativer Exponent','Brüche multiplizieren','Gleicher Exponent','Bruch kürzen','Logarithmus','Lösungsmenge'],
[['A.c1:20^{−x} * B.c2:5^x = n:12'],
 ['A1.c1<A:{1|20^x} * B.c2:5^x = n:12','Negativer Exponent<br>$a^{−n}={1|a^n}$'],
 ['Q<A1,B:{#2{5^x}|#1{20^x}} = n:12','Brüche multiplizieren'],
 ['Q2<Q:({#2{5}|#1{20}})^x = n:12','Gleicher Exponent<br>$a^x/b^x=(a/b)^x$'],
 ['Q3<Q2:#3{({1|4})}^x = n.c4:12','Kürzen: $5/20=1/4$'+FM],
 ['X<Q3:x = lg:log sb.c3<Q3:_{{1|4}} p1:( n.c4:12 p2:)','Definition des Logarithmus']],
['L=§(log_{#3{{1|4}}}(#4{12})§)','Taschenrechner: $x≈−1,79$']),

TASK('c','7*2^x=13*3^x','$7*2^x=13*3^x$','Die Potenzen stehen auf beiden Seiten – was teilt man?',.86,
['Durch 3ˣ teilen','Rechts kürzen','Gleicher Exponent','Durch 7 teilen','Logarithmus','Lösungsmenge'],
[['n7:7 * A.c1:2^x = n13:13 * B.c2:3^x'],
 ['F<n7,A:{7*#1{2^x}|#2{3^x}} = G<n13,B:{13*#2{3^x}|#2{3^x}}','Beide Seiten durch $3^x$<br>$|:3^x$'],
 ['F:{7*#1{2^x}|#2{3^x}} = n13<G:13','Rechts kürzen: $3^x$ fällt weg'],
