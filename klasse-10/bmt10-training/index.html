<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Fit für den BMT 10 – Übungseinheit</title>
<style>
:root{
  --paper:#F7FAFD; --grid:#DEE7F1; --sheet:#FFFFFF; --line:#C9D5E3;
  --ink:#1C3D72; --ink2:#3A5E94; --inkbg:#E8EEF8;
  --text:#1E2633; --muted:#56616F;
  --red:#BE2F29; --redbg:#FBECEA; --margin:#E6A4A0;
  --green:#1E7746; --greenbg:#E6F3EB;
  --marker:#FFE35A; --amber:#B06F12;
  --head:64px; --foot:68px;
  --ui:"Avenir Next","Avenir","Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  --math:"Charter","Iowan Old Style","Cambria","Georgia","Times New Roman",serif;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:calc(var(--head) + 12px)}
body{
  margin:0; font-family:var(--ui); font-size:17px; line-height:1.45; color:var(--text);
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  padding-top:calc(var(--head) + env(safe-area-inset-top,0px));
  padding-bottom:calc(var(--foot) + 20px + env(safe-area-inset-bottom,0px));
}
i,.m{font-family:var(--math)}
i{font-style:italic}
sup{font-size:.7em;line-height:0}
button,input,select{font:inherit;color:inherit}
button{touch-action:manipulation}
:focus-visible{outline:3px solid var(--ink2);outline-offset:2px}

/* ---------- Kopfzeile mit Stationskästchen ---------- */
#top{position:fixed;top:0;left:0;right:0;z-index:20;background:#fff;border-bottom:2px solid var(--ink);
  height:calc(var(--head) + env(safe-area-inset-top,0px));padding:env(safe-area-inset-top,0px) 16px 0;
  display:flex;align-items:center;gap:14px}
#top .ttl{font-weight:700;color:var(--ink);font-size:18px;white-space:nowrap;background:none;border:0;padding:8px 0;cursor:pointer}
#squares{margin-left:auto;display:flex;gap:6px}
.sq8{width:46px;height:46px;border:2px solid var(--ink);border-radius:6px;background:#fff;color:var(--ink);
  font-weight:700;font-size:17px;cursor:pointer;padding:0;display:flex;align-items:center;justify-content:center;position:relative}
.sq8.cur{background:var(--marker);box-shadow:0 0 0 2px #fff,0 0 0 4px var(--ink)}
.sq8.done{background:var(--ink);color:#fff}
.sq8.cur.done{color:var(--marker)}

/* ---------- Grundlayout ---------- */
main{max-width:1120px;margin:0 auto;padding:16px 20px}
.page{display:none}
.page.on{display:block}
.shead{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;margin:0 0 4px}
.kicker{color:var(--muted);font-weight:600;font-size:15px;margin:0}
h1{font-size:28px;line-height:1.2;color:var(--ink);margin:0;letter-spacing:-.01em}
.lead{font-size:17px;color:var(--muted);margin:2px 0 14px;max-width:75ch}
.mk{background:linear-gradient(transparent 58%,var(--marker) 58%)}

/* ---------- Merkkasten ---------- */
.merke{background:#fff;border:2px solid var(--ink);border-radius:6px;padding:12px 18px 10px;margin:0 0 20px;box-shadow:5px 5px 0 var(--inkbg)}
.merke h2{margin:0 0 6px;font-size:17px;color:var(--ink)}
.merke p{margin:5px 0}
.merke ul{margin:4px 0;padding-left:20px}
.merke li{margin:3px 0}
/* Erklärung links, passende Grafik rechts */
.ex{display:grid;grid-template-columns:minmax(0,1fr) minmax(200px,280px);gap:6px 20px;align-items:center;padding:10px 0;border-top:1px dashed var(--line)}
.ex:first-of-type{border-top:0}
.ex.wide{grid-template-columns:minmax(0,1fr) minmax(260px,360px)}
.ex>div:first-child p:first-child{margin-top:0}
.ex figure{margin:0}
.ex figcaption,.cap{font-size:14px;color:var(--muted);text-align:center;margin-top:3px;line-height:1.3}
.ex b.t{color:var(--ink)}
dl.ops{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:5px 14px;margin:6px 0}
dl.ops dt{font-weight:700;color:var(--ink)}
dl.ops dd{margin:0}
.two{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:6px 0}
.two>div{border:1.5px solid var(--line);border-radius:6px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) 170px;gap:4px 12px;align-items:center}
.two h3{margin:0 0 4px;font-size:16px;color:var(--ink)}
.two p{margin:3px 0}
.minis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.minis figure{margin:0;text-align:center}
.minis figcaption{font-size:13.5px;color:var(--muted);margin-top:2px;line-height:1.25}
.minis svg{width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:4px}
.venns{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:8px 0}
.venns figure{margin:0;text-align:center}
.venns svg{width:100%;height:auto}
.venns figcaption{font-size:14px;color:var(--muted);line-height:1.25;margin-top:2px}
.anno{font-family:var(--math);font-size:19px;line-height:2;background:#fff;border:1.5px solid var(--line);border-radius:4px;padding:6px 12px;margin:6px 0}
.anno .op{background:var(--marker);padding:2px 4px;border-radius:3px}
.anno .ges{border-bottom:3px solid var(--ink2);padding-bottom:1px}
.legend{display:flex;flex-wrap:wrap;gap:4px 18px;font-size:15px;color:var(--muted);margin:2px 0 6px}
.legend span::before{content:"";display:inline-block;width:14px;height:14px;border-radius:3px;margin-right:6px;vertical-align:-2px}
.legend .l1::before{background:var(--marker)}
.legend .l2::before{border-bottom:3px solid var(--ink2);height:10px;border-radius:0}
.formulas{display:flex;flex-wrap:wrap;gap:8px 26px;font-family:var(--math);font-size:18px;margin:6px 0}
.strike{text-decoration:line-through;text-decoration-color:var(--red);text-decoration-thickness:2px}

/* ---------- Grafiken ---------- */
.fig{display:flex;justify-content:center}
svg.plot,svg.sk{display:block;width:100%;height:auto;background:#fff;border:1px solid var(--line);border-radius:6px}
.fig svg.plot{max-width:340px}
.fig svg.sk{max-width:380px}
.ex svg.plot,.ex svg.sk,.two svg.plot{max-width:100%}

/* ---------- Aufgabenkarte ---------- */
.task{background:var(--sheet);border:1px solid var(--line);border-radius:8px;margin:0 0 18px;padding:14px 16px 14px 60px;position:relative}
.task::before{content:"";position:absolute;left:46px;top:0;bottom:0;width:1.5px;background:var(--margin)}
.tl{position:absolute;left:10px;top:13px;font-weight:700;color:var(--ink);font-size:19px;text-align:center;width:28px}
.task.solved .tl::after{content:"✓";display:block;color:var(--green);font-size:21px;margin-top:4px}
.task.shown .tl::after{content:"L";display:block;color:var(--muted);font-size:15px;margin-top:6px}
.tp p{margin:0 0 7px}
.tp .bmt{font-family:var(--math);font-size:18px}
/* Aufgabe mit Bezugsgrafik: Grafik links, bleibt beim Scrollen sichtbar */
.tgrid{display:block}
.task.hasfig .tgrid{display:grid;grid-template-columns:minmax(230px,36%) minmax(0,1fr);gap:18px;align-items:start}
.tfig{position:sticky;top:calc(var(--head) + 12px + env(safe-area-inset-top,0px));align-self:start}
.tfig .fig{justify-content:flex-start}
.tfig .fig svg.plot,.tfig .fig svg.sk{max-width:100%}
.tfig .cap{text-align:left}
.w{margin:8px 0}
.wq{margin:0 0 8px;font-weight:600}

.opts{display:grid;grid-template-columns:1fr;gap:8px}
.opts.g2{grid-template-columns:1fr 1fr}
.opt,.chip{text-align:left;min-height:48px;padding:9px 14px;border:1.5px solid var(--line);border-radius:8px;background:#fff;cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:8px 14px;font-family:var(--math);font-size:17px}
.chip.txt{font-family:var(--ui);font-size:16px}
.opt.sel,.chip.sel{border-color:var(--ink);background:var(--inkbg);box-shadow:inset 0 0 0 1px var(--ink)}
.opt.right,.chip.right{border-color:var(--green);background:var(--greenbg);box-shadow:inset 0 0 0 1px var(--green)}
.opt.wrong,.chip.wrong{border-color:var(--red);background:var(--redbg);box-shadow:inset 0 0 0 1px var(--red)}
.opt:disabled,.chip:disabled{cursor:default;color:var(--text)}
.opt .m{font-size:18px}

/* Zuordnen: Text links, Auswahl rechts */
.mrow{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 16px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.mrow.sel{grid-template-columns:minmax(0,1fr) minmax(240px,340px)}
.mrow:last-child{border-bottom:0}
.mrow .mt .m{font-size:20px}
.mrow.right .mt::before{content:"✓ ";color:var(--green);font-weight:700}
.mrow.wrong .mt{color:var(--red)}
select.sel{width:100%;min-height:48px;font-size:16px;padding:6px 10px;border:1.5px solid var(--line);border-radius:8px;background:#fff;color:var(--text)}
.mrow.right select.sel{border-color:var(--green);background:var(--greenbg)}
.mrow.wrong select.sel{border-color:var(--red);background:var(--redbg)}

/* Eingaben */
.frow{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;margin:8px 0}
input.in{font-family:var(--math);font-size:19px;min-height:48px;padding:6px 12px;border:1.5px solid var(--line);border-radius:8px;width:8em;background:#fff;color:var(--text)}
input.in.wide{width:13em;max-width:100%}
input.in.right{border-color:var(--green);background:var(--greenbg)}
input.in.wrong{border-color:var(--red);background:var(--redbg)}
input.in:disabled{color:var(--text);opacity:1}
.syntax{font-size:14.5px;color:var(--muted);margin:2px 0 0}
.srow{display:grid;grid-template-columns:minmax(180px,240px) minmax(0,1fr);gap:4px 14px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.srow:last-child{border-bottom:0}
.srow .eq{font-family:var(--math);font-size:19px}
.task.hasfig .srow{grid-template-columns:1fr}
.srow .frow{margin:0}
.srow input.in{width:6.5em}
.chip.none{font-family:var(--ui);font-size:15px}

table.vft{border-collapse:collapse;margin:4px 0;font-family:var(--math);font-size:18px}
table.vft th,table.vft td{border:1.5px solid var(--ink);width:92px;height:54px;text-align:center;padding:3px}
table.vft th{background:var(--inkbg)}
table.vft input.in{width:78px;text-align:center;padding:4px}
.vwrap{overflow-x:auto}

/* Prüfen, Tipps, Lösung */
.ctrl{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-top:12px}
.btn{min-height:48px;padding:9px 20px;border-radius:8px;border:2px solid var(--ink);background:var(--ink);color:#fff;font-weight:600;cursor:pointer}
.btn.sec{background:#fff;color:var(--ink)}
.btn:disabled{opacity:.4;cursor:default}
.fb{margin-top:6px;font-weight:600}
.fb:empty{display:none}
.fb.no{color:var(--red)}
.fb.ok{color:var(--green)}
.help{margin-top:10px;border:1.5px solid var(--line);border-radius:8px;overflow:hidden}
.help[hidden]{display:none}
.htabs{display:flex;gap:0;border-bottom:1.5px solid var(--line);background:#FAFBFD}
.htabs button{border:0;background:none;padding:10px 16px;min-height:44px;font-weight:600;color:var(--muted);cursor:pointer;border-right:1px solid var(--line)}
.htabs button.on{background:#FFFBE3;color:var(--text)}
.htabs button.sol.on{background:var(--inkbg)}
.hbody{padding:10px 14px;background:#FFFBE3}
.hbody.sol{background:var(--inkbg)}
.hbody p{margin:4px 0}
.hbody .fig{justify-content:flex-start;margin-top:6px}
.hbody .fig svg{max-width:300px}
.after{margin-top:10px}
.after .fig{justify-content:flex-start}
.after .fig svg.plot{max-width:360px}
.info{font-size:15.5px;color:var(--muted)}
.info b{color:var(--text);font-weight:600}

/* Explorer: Regler links, Grafik rechts */
.explore{background:#fff;border:1px solid var(--line);border-radius:8px;padding:12px 16px;margin:0 0 20px}
.explore h2{font-size:17px;margin:0 0 6px;color:var(--ink)}
.exgrid{display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,360px);gap:10px 22px;align-items:center}
.explore .row{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin:4px 0}
.explore label{display:flex;align-items:center;gap:10px;min-height:48px}
input[type=range]{width:190px;accent-color:var(--ink);height:40px}
input[type=checkbox]{width:24px;height:24px;accent-color:var(--ink)}
.term{font-family:var(--math);font-size:22px;color:var(--ink);margin:6px 0}
.seg{display:inline-flex;border:2px solid var(--ink);border-radius:8px;overflow:hidden}
.seg button{border:0;background:#fff;color:var(--ink);padding:8px 16px;min-height:44px;font-weight:600;cursor:pointer}
.seg button.on{background:var(--ink);color:#fff}
.mini-ex label{min-height:44px}
.mini-ex input[type=range]{width:100%}

.done{display:none;border:2px dashed var(--green);background:var(--greenbg);padding:12px 16px;border-radius:8px;margin:4px 0 20px;align-items:center;gap:14px;flex-wrap:wrap}
.done.on{display:flex}
.done p{margin:0;font-weight:600;color:var(--green)}

/* ---------- Startseite ---------- */
.hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.35fr);gap:18px 30px;align-items:start}
.hero h1{font-size:34px;margin:2px 0 8px}
.hero .lead{margin-bottom:10px}
.how{font-size:15.5px;color:var(--muted);margin:0 0 14px}
.tiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.tile{display:grid;grid-template-columns:46px 1fr;gap:12px;align-items:center;min-height:64px;padding:8px 12px;text-align:left;background:#fff;border:1.5px solid var(--line);border-radius:8px;cursor:pointer}
.tile .n{width:46px;height:46px;border:2px solid var(--ink);border-radius:6px;display:flex;align-items:center;justify-content:center;font-weight:700;color:var(--ink);font-size:18px}
.tile.done .n{background:var(--ink);color:#fff}
.tile .tt{font-weight:600;line-height:1.25}
.tile:hover{border-color:var(--ink)}
.check{display:grid;grid-template-columns:1fr 1fr;gap:10px 26px;background:#fff;border:2px solid var(--ink);border-radius:6px;padding:14px 18px 14px 40px;margin:12px 0;box-shadow:5px 5px 0 var(--inkbg)}
.check li{margin:0}

/* ---------- Brüche, Wurzeln, Querstriche ---------- */
.fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.94em;margin:0 .15em;line-height:1.25}
.fr>span:first-child{border-bottom:1.3px solid currentColor;padding:0 .25em}
.fr>span:last-child{padding:0 .25em}
.sr{white-space:nowrap}
.sr>span{border-top:1.3px solid currentColor;padding:0 .12em;margin-left:.05em}
.ol{text-decoration:overline;text-decoration-thickness:1.5px}

/* ---------- Fußleiste ---------- */
#bottom{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:2px solid var(--ink);
  min-height:calc(var(--foot) + env(safe-area-inset-bottom,0px));padding:9px 16px calc(9px + env(safe-area-inset-bottom,0px));
  display:flex;align-items:center;justify-content:space-between;gap:10px}
#bottom .mid{color:var(--muted);font-weight:600;text-align:center;font-size:15px;line-height:1.25;min-width:0}
#bottom .mid .nt{display:block;color:var(--ink);font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#bottom .btn{min-width:120px}

/* ---------- Tablet hochkant / kleinere Laptops ---------- */
@media (max-width:980px){
  .venns{grid-template-columns:repeat(3,1fr)}
  dl.ops{grid-template-columns:auto 1fr}
  .two>div{grid-template-columns:1fr}
  .two>div .fig svg{max-width:240px}
  .hero{grid-template-columns:1fr;gap:10px}
  .hero .lead{max-width:none}
}
@media (max-width:760px){
  :root{--head:60px}
  body{font-size:16.5px}
  main{padding:12px 12px}
  #top{padding-left:10px;padding-right:10px;gap:8px}
  #top .ttl{display:none}
  #squares{margin:0;width:100%;gap:5px}
  .sq8{flex:1 1 0;width:auto;height:46px;min-width:0;font-size:16px}
  h1{font-size:24px}
  .hero h1{font-size:28px}
  .task{padding:12px 12px 12px 44px}
  .task::before{left:34px}
  .tl{left:4px;width:26px}
  .task.hasfig .tgrid{display:block}
  .tfig{position:static;margin-bottom:10px}
  .tfig .fig{justify-content:center}
  .tfig .fig svg.plot,.tfig .fig svg.sk{max-width:320px}
  .tfig .cap{text-align:center}
  .ex,.ex.wide{grid-template-columns:1fr}
  .ex figure,.ex>div:last-child{max-width:280px;margin:0 auto;width:100%}
  .two{grid-template-columns:1fr}
  .mrow,.mrow.sel{grid-template-columns:1fr}
  .srow{grid-template-columns:1fr}
  .opts.g2{grid-template-columns:1fr}
  .exgrid{grid-template-columns:1fr}
  .exgrid .fig svg{max-width:340px}
  .tiles{grid-template-columns:1fr}
  .check{grid-template-columns:1fr}
  #bottom .btn{min-width:88px;padding:9px 12px}
  #bottom .mid .nt{display:none}
  table.vft th,table.vft td{width:68px;height:50px}
  table.vft input.in{width:58px}
}
@media (max-width:480px){
  .venns{grid-template-columns:repeat(2,1fr)}
  .minis{grid-template-columns:repeat(3,1fr);gap:5px}
  input.in{width:7em}
}
/* ---------- Kompakte Merkhilfe ---------- */
.merke{position:relative}
.qsent{position:absolute;left:0;top:0;bottom:90px;width:1px;pointer-events:none}
#quick{position:fixed;z-index:15;background:#fff;border:2px solid var(--ink);border-radius:8px;box-shadow:4px 4px 0 var(--inkbg);
  padding:10px 14px 10px;font-size:15px;line-height:1.35;visibility:hidden;opacity:0;overflow:auto;overscroll-behavior:contain}
#quick h2{font-size:15.5px;margin:0 0 6px;color:var(--ink)}
#quick ul{margin:0;padding-left:18px}
#quick li{margin:5px 0}
#quick .m{font-size:16px}
#quick li::marker{color:var(--ink)}
#quick .qx{display:none}
#quickBtn{display:none}
@media (min-width:1000px){
  body.st-page main{max-width:1374px;padding-right:274px}
  #quick{top:calc(var(--head) + 16px + env(safe-area-inset-top,0px));right:calc(max(0px, (100vw - 1374px) / 2) + 20px);width:230px;max-height:50vh}
  body.st-page.quick-on #quick{visibility:visible;opacity:1}
}
@media (max-width:999px){
  #quickBtn{position:fixed;z-index:16;right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(var(--foot) + 14px + env(safe-area-inset-bottom,0px));
    align-items:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:24px;background:var(--marker);border:2px solid var(--ink);color:var(--ink);font-weight:700;cursor:pointer;box-shadow:3px 3px 0 var(--inkbg)}
  body.st-page.quick-on #quickBtn{display:inline-flex}
  #quick{right:calc(12px + env(safe-area-inset-right,0px));bottom:calc(var(--foot) + 74px + env(safe-area-inset-bottom,0px));width:min(310px, calc(100vw - 24px));max-height:50vh;padding-right:12px}
  body.st-page.quick-on.quick-open #quick{visibility:visible;opacity:1}
  #quick h2{padding-right:42px;min-height:30px;display:flex;align-items:center}
  #quick .qx{display:flex;align-items:center;justify-content:center;position:absolute;top:3px;right:3px;width:44px;height:44px;border:0;background:none;color:var(--ink);font-size:26px;font-weight:700;line-height:1;cursor:pointer;border-radius:6px}
}
@media (prefers-reduced-motion:no-preference){
  #quick{transition:opacity .2s,visibility .2s}
  .opt,.chip,.btn,input.in,.tile{transition:background-color .15s,border-color .15s}
}
</style>
</head>
<body>
<header id="top">
  <button class="ttl" id="homeBtn" type="button">Fit für den BMT 10</button>
  <div id="squares" role="navigation" aria-label="Stationen"></div>
</header>
<main id="main"></main>
<aside id="quick" aria-label="Merkhilfe"><h2 id="quickTitle">Merkhilfe</h2><button class="qx" id="quickClose" type="button" aria-label="Merkhilfe schließen">×</button><ul id="quickList"></ul></aside>
<button id="quickBtn" type="button" aria-controls="quick" aria-expanded="false">Merkhilfe</button>
<nav id="bottom" aria-label="Blättern">
  <button class="btn sec" id="prevBtn" type="button">Zurück</button>
  <span class="mid" id="navMid"></span>
  <button class="btn" id="nextBtn" type="button">Weiter</button>
</nav>

<script>
"use strict";
/* ---------- kleine Helfer ---------- */
const F = (a,b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const R = x => `<span class="sr">√<span>${x}</span></span>`;
const O = x => `<span class="ol">${x}</span>`;
const X = "<i>x</i>";
const sq = "<sup>2</sup>";
function el(tag, cls, html){ const e=document.createElement(tag); if(cls) e.className=cls; if(html!=null) e.innerHTML=html; return e; }
function num(n){ // Anzeige mit Komma und echtem Minus
  let s = (Math.round(n*1000)/1000).toString().replace(".", ",");
  return s.replace("-", "−");
}

/* ---------- Term-Auswertung (eigener Parser, kein eval) ---------- */
function compile(src){
  let s = String(src).trim();
  s = s.replace(/^[a-zA-Z]\s*\(\s*x\s*\)\s*=/, "")
       .replace(/^\s*(x\s*[₁₂12]?|y|V|A|t|P\s*\(.*\))\s*=/, "");
  s = s.replace(/\s+/g, "");
  s = s.replace(/(m|s|g|%|l|liter|minuten|min|sekunden|einwohner|cm|km|µg|mg)\.?$/i, "");
  if(/^-?\d{1,3}(\.\d{3})+$/.test(s)) s = s.replace(/\./g, "");
  s = s.replace(/[−–]/g,"-").replace(/[·⋅×]/g,"*").replace(/:/g,"/").replace(/,/g,".")
       .replace(/²/g,"^2").replace(/³/g,"^3").replace(/⁴/g,"^4").replace(/⁶/g,"^6").replace(/⁸/g,"^8")
       .replace(/sqrt|wurzel/gi,"r").replace(/π/g,"p").replace(/pi/gi,"p").replace(/√/g,"r").replace(/X/g,"x");
  if(!s) throw new Error("leer");
  const toks = [];
  let i = 0;
  while(i < s.length){
    const c = s[i];
    if(/[0-9.]/.test(c)){ let j=i; while(j<s.length && /[0-9.]/.test(s[j])) j++; const v=parseFloat(s.slice(i,j)); if(isNaN(v)) throw new Error("Zahl"); toks.push({t:"n",v}); i=j; continue; }
    if(s.startsWith("sin",i)||s.startsWith("cos",i)||s.startsWith("tan",i)){ toks.push({t:"f",v:s.substr(i,3)}); i+=3; continue; }
    if(c==="x"){ toks.push({t:"x"}); i++; continue; }
    if(c==="p"){ toks.push({t:"c",v:Math.PI}); i++; continue; }
    if(c==="r"){ toks.push({t:"f",v:"r"}); i++; continue; }
    if("+-*/^()".includes(c)){ toks.push({t:"o",v:c}); i++; continue; }
    throw new Error("Zeichen");
  }
  let pos = 0, usesX = false;
  const peek = () => toks[pos], next = () => toks[pos++];
  const isOp = (t,v) => t && t.t==="o" && t.v===v;
  const starts = t => t && (t.t==="n"||t.t==="x"||t.t==="c"||t.t==="f"||isOp(t,"("));
  const FN = {r:Math.sqrt, sin:v=>Math.sin(v*Math.PI/180), cos:v=>Math.cos(v*Math.PI/180), tan:v=>Math.tan(v*Math.PI/180)};
  function pExpr(){ let l=pTerm(); while(isOp(peek(),"+")||isOp(peek(),"-")){ const o=next().v, r=pTerm(), L=l; l = o==="+" ? x=>L(x)+r(x) : x=>L(x)-r(x); } return l; }
  function pTerm(){ let l=pUnary(); for(;;){ const t=peek();
      if(isOp(t,"*")||isOp(t,"/")){ next(); const r=pUnary(), L=l; l = t.v==="*" ? x=>L(x)*r(x) : x=>L(x)/r(x); }
      else if(starts(t)){ const r=pPow(), L=l; l = x=>L(x)*r(x); }
      else break; } return l; }
  function pUnary(){ const t=peek(); if(isOp(t,"-")||isOp(t,"+")){ next(); const u=pUnary(); return t.v==="-" ? x=>-u(x) : u; } return pPow(); }
  function pPow(){ const b=pPrim(); if(isOp(peek(),"^")){ next(); const e=pUnary(); return x=>Math.pow(b(x),e(x)); } return b; }
  function pPrim(){ const t=next(); if(!t) throw new Error("Ende");
    if(t.t==="n") return ()=>t.v;
    if(t.t==="c") return ()=>t.v;
    if(t.t==="x"){ usesX=true; return x=>x; }
    if(t.t==="f"){ const a = isOp(peek(),"(") ? pPrim() : pPow(); const f=FN[t.v]; return x=>f(a(x)); }
    if(isOp(t,"(")){ const e=pExpr(); if(!isOp(next(),")")) throw new Error("Klammer"); return e; }
    throw new Error("Syntax"); }
  const fn = pExpr();
  if(pos < toks.length) throw new Error("Rest");
  return {fn, usesX};
}
function sameFn(f, g, skip=[]){
  let n = 0;
  for(const x of [-3.7,-2.3,-1.4,-0.6,0.35,1.3,2.6,3.9,5.2,7.1]){
    if(skip.some(s=>Math.abs(s-x)<1e-9)) continue;
    const b = g(x); if(!isFinite(b)) continue;
    const a = f(x); if(!isFinite(a)) return false;
    if(Math.abs(a-b) > 1e-6*Math.max(1,Math.abs(b))) return false;
    n++;
  }
  return n >= 5;
}
function linCoeffs(f){ const t=f(0), m=f(1)-t; for(const x of [2,-3,5.5]) if(!(Math.abs(f(x)-(m*x+t))<1e-6)) return null; return {m,t}; }
function quadCoeffs(f){
  const c=f(0), p=f(1), q=f(-1), a=(p+q-2*c)/2, b=(p-q)/2;
  for(const x of [2,-3,4.5,-2.5]){ const v=f(x); if(!(Math.abs(v-(a*x*x+b*x+c)) < 1e-6*Math.max(1,Math.abs(v)))) return null; }
  return {a,b,c};
}
const near = (a,b,t=1e-6) => Math.abs(a-b) <= t;

/* ---------- Koordinatensystem als SVG ---------- */
let svgId = 0;
function plot(o){
  const {xmin,xmax,ymin,ymax} = o, W = o.w || 300;
  const H = o.h || Math.round(W*(ymax-ymin)/(xmax-xmin));
  const sx = x => (x-xmin)/(xmax-xmin)*W, sy = y => H-(y-ymin)/(ymax-ymin)*H;
  const id = "p"+(++svgId), tick = o.tick || 1, ytick = o.ytick || tick, gx = o.gx || 1, gy = o.gy || 1, fs = o.fs || 13.5;
  let s = `<svg class="plot" viewBox="0 0 ${W} ${H}" role="img" aria-label="${o.label||"Koordinatensystem"}">`;
  s += `<defs><clipPath id="${id}"><rect x="0" y="0" width="${W}" height="${H}"/></clipPath>
    <marker id="${id}a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#1E2633"/></marker></defs>`;
  for(let x=Math.ceil(xmin/gx)*gx; x<=xmax; x+=gx) s += `<line x1="${sx(x)}" y1="0" x2="${sx(x)}" y2="${H}" stroke="#E3EAF3" stroke-width="1"/>`;
  for(let y=Math.ceil(ymin/gy)*gy; y<=ymax; y+=gy) s += `<line x1="0" y1="${sy(y)}" x2="${W}" y2="${sy(y)}" stroke="#E3EAF3" stroke-width="1"/>`;
  if(o.band==="y") s += `<rect x="${sx(0)-6}" y="0" width="12" height="${H}" fill="#FFE35A" opacity=".7"/>`;
  if(o.band==="x") s += `<rect x="0" y="${sy(0)-6}" width="${W}" height="12" fill="#FFE35A" opacity=".7"/>`;
  const x0 = (xmin<=0 && 0<=xmax) ? sx(0) : 0, y0 = (ymin<=0 && 0<=ymax) ? sy(0) : H;
  s += `<line x1="0" y1="${y0}" x2="${W-2}" y2="${y0}" stroke="#1E2633" stroke-width="1.3" marker-end="url(#${id}a)"/>`;
  s += `<line x1="${x0}" y1="${H}" x2="${x0}" y2="2" stroke="#1E2633" stroke-width="1.3" marker-end="url(#${id}a)"/>`;
  s += `<text x="${W-12}" y="${y0-7}" font-size="16" font-style="italic" font-family="Georgia,serif">x</text>`;
  s += `<text x="${x0+7}" y="14" font-size="16" font-style="italic" font-family="Georgia,serif">y</text>`;
  if(!o.noTicks){
  for(let x=Math.floor(xmin/tick)*tick+tick; x<xmax-1e-9; x+=tick){ if(Math.abs(x)<1e-9) continue;
    s += `<line x1="${sx(x)}" y1="${y0-3}" x2="${sx(x)}" y2="${y0+3}" stroke="#1E2633"/><text x="${sx(x)}" y="${y0+fs+4}" font-size="${fs}" fill="#5A6576" text-anchor="middle">${num(x)}</text>`; }
  for(let y=Math.floor(ymin/ytick)*ytick+ytick; y<ymax-1e-9; y+=ytick){ if(Math.abs(y)<1e-9) continue;
    s += `<line x1="${x0-3}" y1="${sy(y)}" x2="${x0+3}" y2="${sy(y)}" stroke="#1E2633"/><text x="${x0-6}" y="${sy(y)+4}" font-size="${fs}" fill="#5A6576" text-anchor="end">${num(y)}</text>`; } }
  s += `<g clip-path="url(#${id})">`;
  for(const v of (o.vlines||[])) s += `<line x1="${sx(v)}" y1="0" x2="${sx(v)}" y2="${H}" stroke="#3A5E94" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  for(const h of (o.hlines||[])) s += `<line x1="0" y1="${sy(h)}" x2="${W}" y2="${sy(h)}" stroke="#3A5E94" stroke-width="1.5" stroke-dasharray="6 5"/>`;
  for(const g of (o.fns||[])){
    const N = 600, dx = (xmax-xmin)/N, span = ymax-ymin;
    let d = "", pen = false, prev = null;
    for(let k=0; k<=N; k++){
      const x = xmin+k*dx, y = g.f(x);
      const bad = !isFinite(y) || y>ymax+span || y<ymin-span || (prev!==null && Math.abs(y-prev)>span);
      if(bad){ pen=false; prev = isFinite(y)?y:null; continue; }
      d += (pen?"L":"M") + sx(x).toFixed(1) + " " + sy(y).toFixed(1);
      pen = true; prev = y;
    }
    s += `<path d="${d}" fill="none" stroke="${g.color||"#1C3D72"}" stroke-width="3"/>`;
  }
  for(const g of (o.segs||[])) s += `<line x1="${sx(g.x1)}" y1="${sy(g.y1)}" x2="${sx(g.x2)}" y2="${sy(g.y2)}" stroke="${g.color||"#B06F12"}" stroke-width="${g.w||2.5}"${g.dash?` stroke-dasharray="5 4"`:""}/>`;
  s += `</g>`;
  for(const t of (o.texts||[])) s += `<text x="${sx(t.x)}" y="${sy(t.y)}" font-size="${t.fs||14.5}" font-weight="700" fill="${t.color||"#B06F12"}" text-anchor="${t.anchor||"middle"}">${t.t}</text>`;
  for(const p of (o.pts||[])){
    s += `<circle cx="${sx(p.x)}" cy="${sy(p.y)}" r="6" fill="${p.color||"#BE2F29"}" stroke="#fff" stroke-width="2"/>`;
    if(p.label) s += `<text x="${sx(p.x)+(p.dx||8)}" y="${sy(p.y)+(p.dy||-9)}" font-size="15" font-weight="700" fill="${p.color||"#BE2F29"}" text-anchor="${p.anchor||"start"}">${p.label}</text>`;
  }
  return s + `</svg>`;
}

/* ---------- Eingabe-Bausteine ---------- */
function wChoice({q, options, correct, wrong={}, cols=1}){
  const root = el("div","w"); if(q) root.append(el("p","wq",q));
  const box = el("div","opts"+(cols===2?" g2":"")), fb = el("div","fb");
  let sel = null;
  const btns = options.map((o,i) => {
    const b = el("button","opt",o); b.type="button"; b.setAttribute("aria-pressed","false");
    b.onclick = () => { sel=i; btns.forEach(x=>{x.classList.remove("sel","right","wrong"); x.setAttribute("aria-pressed","false");}); b.classList.add("sel"); b.setAttribute("aria-pressed","true"); };
    box.append(b); return b; });
  root.append(box, fb);
  return {el:root, fb,
    check(){ if(sel===null) return {ok:false,msg:"Wähle eine Antwort aus."};
      if(sel===correct){ btns[sel].classList.add("right"); return {ok:true}; }
      btns[sel].classList.add("wrong"); return {ok:false,msg:wrong[sel]||"Das passt noch nicht."}; },
    reveal(){ btns.forEach(b=>b.classList.remove("wrong","sel")); btns[correct].classList.add("right"); },
    lock(){ btns.forEach(b=>b.disabled=true); } };
}
function wMulti({q, options, correct, wrong={}, chips=false, cols=1}){
  const root = el("div","w"); if(q) root.append(el("p","wq",q));
  const box = el("div", chips?"chips":("opts"+(cols===2?" g2":""))), fb = el("div","fb");
  const on = new Set();
  const btns = options.map((o,i) => {
    const b = el("button", chips?"chip":"opt", o); b.type="button"; b.setAttribute("aria-pressed","false");
    b.onclick = () => { if(on.has(i)) on.delete(i); else on.add(i); b.classList.toggle("sel", on.has(i)); b.setAttribute("aria-pressed", on.has(i)); btns.forEach(x=>x.classList.remove("right","wrong")); };
    box.append(b); return b; });
  root.append(box, fb);
  return {el:root, fb,
    check(){ if(!on.size) return {ok:false,msg:"Markiere mindestens eine Antwort."};
      let msg = null;
      for(const i of on){ if(!correct.includes(i)){ btns[i].classList.add("wrong"); msg = msg || wrong[i] || "Mindestens eine markierte Antwort stimmt nicht."; } else btns[i].classList.add("right"); }
      if(msg) return {ok:false,msg};
      if(correct.some(i=>!on.has(i))) return {ok:false,msg:"Richtig bisher – aber es gibt noch eine weitere richtige Antwort."};
      return {ok:true}; },
    reveal(){ btns.forEach((b,i)=>{ b.classList.remove("wrong","sel"); b.classList.toggle("right", correct.includes(i)); }); },
    lock(){ btns.forEach(b=>b.disabled=true); } };
}
/* Zuordnen: mode "select" (Textoptionen) oder "chips" (kurze Optionen, auch mit Formeln) */
function wMatch({q, items, options, mode="select", txt=false, wrongMsg}){
  const root = el("div","w"); if(q) root.append(el("p","wq",q));
  const fb = el("div","fb");
  const rows = items.map(it => {
    const row = el("div", mode==="select" ? "mrow sel" : "mrow"); row.append(el("div","mt",it.t));
    let getVal, setVal, lockRow;
    if(mode==="select"){
      const s = el("select","sel"); s.setAttribute("aria-label","Zuordnung wählen");
      s.innerHTML = `<option value="">– bitte wählen –</option>` + options.map((o,i)=>`<option value="${i}">${o}</option>`).join("");
      s.onchange = () => row.classList.remove("right","wrong");
      row.append(s);
      getVal = () => s.value===""?null:+s.value; setVal = v => s.value=v; lockRow = () => s.disabled=true;
    } else {
      const box = el("div","chips"); let v = null;
      const bs = options.map((o,i)=>{ const b=el("button","chip"+(txt?" txt":""),o); b.type="button"; b.setAttribute("aria-pressed","false");
        b.onclick=()=>{ v=i; bs.forEach(x=>{x.classList.toggle("sel",x===b); x.setAttribute("aria-pressed",x===b);}); row.classList.remove("right","wrong"); }; box.append(b); return b; });
      row.append(box);
      getVal = () => v; setVal = k => { v=k; bs.forEach((x,i)=>x.classList.toggle("sel",i===k)); }; lockRow = () => bs.forEach(b=>b.disabled=true);
    }
    root.append(row);
    return {row, it, getVal, setVal, lockRow};
  });
  root.append(fb);
  return {el:root, fb,
    check(){ let open=0, bad=0, firstMsg=null;
      rows.forEach(r=>{ const v=r.getVal(); r.row.classList.remove("right","wrong");
        if(v===null){ open++; return; }
        if(v===r.it.a) r.row.classList.add("right"); else { r.row.classList.add("wrong"); bad++; if(!firstMsg && r.it.w && r.it.w[v]) firstMsg=r.it.w[v]; } });
      if(open) return {ok:false,msg:`Es fehlen noch ${open} Zuordnung${open>1?"en":""}.`};
      if(bad) return {ok:false,msg: firstMsg || (wrongMsg||"") + `${bad} von ${rows.length} Zuordnungen stimmen noch nicht (rot markiert).`};
      return {ok:true}; },
    reveal(){ rows.forEach(r=>{ r.setVal(r.it.a); r.row.classList.remove("wrong"); r.row.classList.add("right"); }); },
    lock(){ rows.forEach(r=>r.lockRow()); } };
}
/* Eingabefelder: Zahl oder Term */
function wFields(fields){
  const root = el("div","w"), fb = el("div","fb");
  const ins = fields.map(f => {
    const row = el("div","frow");
    if(f.pre) row.append(el("span","pre",f.pre));
    const inp = el("input","in"+(f.term?" wide":"")); inp.type="text"; inp.autocomplete="off"; inp.spellcheck=false;
    inp.setAttribute("autocapitalize","off"); inp.setAttribute("aria-label", f.aria || "Antwort");
    inp.inputMode = "text"; inp.setAttribute("autocorrect","off");
    if(f.ph) inp.placeholder = f.ph;
    inp.oninput = () => inp.classList.remove("right","wrong");
    row.append(inp);
    if(f.post) row.append(el("span","post",f.post));
    root.append(row);
    return {f, inp};
  });
  root.append(fb);
  if(fields.some(f=>f.term)) root.append(el("p","syntax","Schreibweise: ^ für Hochzahlen (x^2), / für Brüche, das Malzeichen darf fehlen."));
  return {el:root, fb,
    check(){ const msgs=[];
      for(const {f,inp} of ins){
        inp.classList.remove("right","wrong");
        const raw = inp.value.trim();
        if(!raw){ msgs.push("Fülle alle Felder aus."); inp.classList.add("wrong"); continue; }
        let c; try{ c = compile(raw); }catch(e){ inp.classList.add("wrong"); msgs.push(`„${raw}“ kann ich nicht lesen – prüfe die Schreibweise.`); continue; }
        if(f.term){
          const r = f.check(c.fn, raw, c.usesX);
          if(r===true) inp.classList.add("right"); else { inp.classList.add("wrong"); msgs.push(r); }
        } else {
          if(c.usesX){ inp.classList.add("wrong"); msgs.push("Hier ist eine Zahl gesucht, kein Term mit x."); continue; }
          const v = c.fn(0);
          if(near(v, f.ans, f.tol||1e-6)) { inp.classList.add("right"); continue; }
          inp.classList.add("wrong");
          const e = (f.errs||[]).find(e=>near(v,e.v,e.tol||1e-6));
          msgs.push(e ? e.msg : (f.msg || "Dieser Wert stimmt noch nicht."));
        }
      }
      const uniq = [...new Set(msgs)];
      return uniq.length ? {ok:false,msg:uniq.slice(0,2).join(" ")} : {ok:true}; },
    reveal(){ ins.forEach(({f,inp})=>{ inp.value = f.show || num(f.ans); inp.classList.remove("wrong"); inp.classList.add("right"); }); },
    lock(){ ins.forEach(({inp})=>inp.disabled=true); } };
}
/* Quadratische Gleichungen: zwei Lösungsfelder + „keine Lösung“ */
function wSolve(eqs){
  const root = el("div","w"), fb = el("div","fb");
  const rows = eqs.map(q => {
    const row = el("div","srow"); row.append(el("div","eq",q.eq));
    const line = el("div","frow");
    const a = el("input","in"), b = el("input","in");
    [a,b].forEach((inp,k)=>{ inp.type="text"; inp.inputMode="text"; inp.autocomplete="off"; inp.spellcheck=false; inp.setAttribute("autocorrect","off"); inp.setAttribute("autocapitalize","off"); inp.setAttribute("aria-label",`Lösung ${k+1}`); inp.oninput=()=>{inp.classList.remove("right","wrong"); none=false; nb.classList.remove("sel","right","wrong");}; });
    const nb = el("button","chip none","keine Lösung"); nb.type="button";
    let none = false;
    nb.onclick = () => { none=!none; nb.classList.toggle("sel",none); nb.classList.remove("right","wrong"); if(none){ a.value=""; b.value=""; a.classList.remove("right","wrong"); b.classList.remove("right","wrong"); } };
    line.append(el("span","",`${X}<sub>1</sub> =`), a, el("span","",`${X}<sub>2</sub> =`), b, nb);
    row.append(line); root.append(row);
    return {q,a,b,nb,get none(){return none;}, set none(v){none=v;}};
  });
  root.append(fb);
  return {el:root, fb,
    check(){ const msgs=[];
      for(const r of rows){
        const {q,a,b,nb} = r;
        if(r.none){
          if(q.sol.length===0){ nb.classList.add("right"); continue; }
          nb.classList.add("wrong"); msgs.push(`${q.name}: Diese Gleichung hat Lösungen.`); continue;
        }
        const vals=[]; let bad=false;
        for(const inp of [a,b]){ if(!inp.value.trim()) continue;
          try{ const c=compile(inp.value); if(c.usesX) throw 0; vals.push(c.fn(0)); }catch(e){ bad=true; inp.classList.add("wrong"); } }
        if(bad){ msgs.push(`${q.name}: Eine Eingabe kann ich nicht lesen.`); continue; }
        if(!vals.length){ msgs.push(`${q.name}: Trage die Lösungen ein oder wähle „keine Lösung“.`); continue; }
        const custom = q.errs ? q.errs(vals) : null;
        const allIn = vals.every(v=>q.sol.some(s=>near(v,s)));
        const complete = q.sol.every(s=>vals.some(v=>near(v,s)));
        [a,b].forEach(inp=>{ if(!inp.value.trim()) return; try{ const v=compile(inp.value).fn(0); inp.classList.add(q.sol.some(s=>near(v,s))?"right":"wrong"); }catch(e){} });
        if(q.sol.length===0){ msgs.push(custom || `${q.name}: Prüfe, ob diese Gleichung überhaupt Lösungen hat.`); continue; }
        if(allIn && complete) continue;
        if(custom){ msgs.push(`${q.name}: ${custom}`); continue; }
        if(allIn) msgs.push(`${q.name}: Stimmt – aber es fehlt noch eine Lösung.`);
        else msgs.push(`${q.name}: Mindestens eine Lösung stimmt nicht.`);
      }
      return msgs.length ? {ok:false,msg:msgs.slice(0,2).join(" ")} : {ok:true}; },
    reveal(){ rows.forEach(r=>{ if(r.q.sol.length===0){ r.none=true; r.nb.classList.add("sel","right"); r.a.value=""; r.b.value=""; }
        else { r.a.value=num(r.q.sol[0]); r.b.value=r.q.sol[1]!==undefined?num(r.q.sol[1]):""; r.a.classList.add("right"); if(r.b.value) r.b.classList.add("right"); } }); },
    lock(){ rows.forEach(r=>{ r.a.disabled=r.b.disabled=r.nb.disabled=true; }); } };
}
/* Vierfeldertafel */
function wVFT(){
  const root = el("div","w vwrap"), fb = el("div","fb");
  const ans = {b:80, c:180, d:120, Sb:300, Fb:200};
  const inputs = {};
  const cell = k => { const i=el("input","in"); i.type="text"; i.inputMode="numeric"; i.autocomplete="off"; i.setAttribute("aria-label","Feld der Vierfeldertafel"); i.oninput=()=>i.classList.remove("right","wrong"); inputs[k]=i; const td=el("td"); td.append(i); return td; };

function circleSVG(a, plus){

  s += `<g font-size="15" fill="#56616F"><text x="${cx+R+5}" y="${cy+18}">1</text><text x="${cx-R-18}" y="${cy+18}">−1</text><text x="${cx+7}" y="${cy-R-5}">1</text><text x="${cx+7}" y="${cy+R+17}">−1</text></g>`;
  const draw = (t, dash) => { const [px,py]=P(t); const da = dash?` stroke-dasharray="7 5"`:"";
    return `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${py}" stroke="#56616F" stroke-width="1.6"${da}/>`+
      `<line x1="${cx}" y1="${cy}" x2="${px}" y2="${cy}" stroke="#1C3D72" stroke-width="5"${da}/>`+

      `<circle cx="${px}" cy="${py}" r="6" fill="#BE2F29"/>`; };
  const la = ((a%360)+360)%360, [ax,ay]=[cx+28*Math.cos(rad(la)), cy-28*Math.sin(rad(la))];
  if(la>0) s += `<path d="M${cx+28} ${cy} A28 28 0 ${la>180?1:0} 0 ${ax} ${ay}" fill="none" stroke="#BE2F29" stroke-width="2"/>`;
  s += draw(a,false);
  const [px,py]=P(a), right = Math.cos(rad(a))>=0, up = Math.sin(rad(a))>=0;
  s += `<text x="${px+(right?9:-9)}" y="${(py+cy)/2+5}" font-size="16" fill="#B06F12" font-weight="700" text-anchor="${right?"start":"end"}">sin α</text>`;
  s += `<text x="${(px+cx)/2}" y="${cy+(up?21:-10)}" font-size="16" fill="#1C3D72" font-weight="700" text-anchor="middle">cos α</text>`;

  return s + `</svg>`;
}

function circleExplorer(){
  const box = el("div","explore");
  box.append(el("h2","","Ausprobieren: Einheitskreis"));
  let a = 40, plus = false, show = false;
  const g = el("div","exgrid"), left = el("div"), fig = el("div","fig");
  const L = el("label"), sl = el("input"), out = el("span","term");
  sl.type="range"; sl.min=0; sl.max=360; sl.step=1; sl.value=a; sl.setAttribute("aria-label","Winkel α");
  L.append(el("span","","Winkel α"), sl, out);
  const C1 = el("label"), c1 = el("input"); c1.type="checkbox"; C1.append(c1, el("span","","α + 90° zeigen"));
  const C2 = el("label"), c2 = el("input"); c2.type="checkbox"; C2.append(c2, el("span","","Werte anzeigen"));
  const info = el("p","info");
  left.append(L, C1, C2, info); g.append(left, fig); box.append(g);
  function upd(){
    out.textContent = a+"°"; fig.innerHTML = circleSVG(a, plus);
    info.innerHTML = "P(cos α | sin α). Blau: cos α (waagrecht), ocker: sin α (senkrecht)." + (plus?" Gestrichelt: Punkt Q zum Winkel α + 90°.":"") + (show?"<br>"+circleValues(a,plus):"");
  }
  sl.oninput=()=>{a=+sl.value;upd();}; c1.onchange=()=>{plus=c1.checked;upd();}; c2.onchange=()=>{show=c2.checked;upd();};
  upd(); return box;
}

      sol:`<p>Dreht man P um 90° weiter, wird aus dem waagrechten Abstand die Höhe: sin(α + 90°) = cos α.</p>` },

    { fig: paraSVG, cap:"Parallelogramm mit den Seiten 6 und 3",
      prompt:`<p>Gegeben ist ein Parallelogramm mit den Seitenlängen 6 und 3.</p>`,
      parts:[()=>wChoice({ cols:2, q:"Welcher Term beschreibt den Flächeninhalt in Abhängigkeit von α?",
          options:[`<span class="m">${F("1","2")} · 6 · 3 · sin α</span>`,`<span class="m">6 · 3 · cos α</span>`,`<span class="m">6 · 3</span>`,`<span class="m">6 · 3 · sin α</span>`],
          correct:3, wrong:{0:"Der Faktor ½ gehört zum Dreieck. Das Parallelogramm besteht aus zwei solchen Dreiecken.",1:"Die Höhe liegt dem Winkel α gegenüber: h = 3 · sin α.",2:"6 · 3 gilt nur für ein Rechteck, also für α = 90°."}}),
        ()=>wFields([{pre:"Für α = 30° beträgt der Flächeninhalt", ans:9, errs:[{v:18,msg:"sin 30° = 0,5 – den Faktor hast du vergessen."},{v:4.5,msg:"Beim Parallelogramm gibt es keinen Faktor ½."}]}])],
      hints:["Flächeninhalt = Grundseite · Höhe. Die Höhe h auf die Seite 6 ist die Gegenkathete zu α im Dreieck mit der Hypotenuse 3.",`h = 3 · sin α, also A = 6 · 3 · sin α. sin 30° = 0,5.<div class="fig">${paraHSVG()}</div>`],
      sol:`<div class="fig">${paraHSVG()}</div><p><i>A</i> = 6 · 3 · sin α = 18 · sin α. Für α = 30°: 18 · 0,5 = 9.</p>` },

    { fig: cylSVG, cap:"Zylinder mit Radius 3 und Höhe 4",
      prompt:`<p class="bmt">Ein Zylinder hat den Radius 3 und die Höhe 4. Geben Sie sein Volumen an.</p><p class="info">π kannst du als π oder pi eingeben.</p>`,
      parts:[()=>wFields([{pre:"<i>V</i> =", ans:36*Math.PI, tol:0.2, show:"36π",
        errs:[{v:24*Math.PI,tol:0.2,msg:"24π ist die Mantelfläche 2 · π · r · h. Volumen = Grundfläche · Höhe."},{v:12*Math.PI,tol:0.2,msg:"Prüfe die Formel: Der Radius wird quadriert (r² = 9), und beim Zylinder gibt es keinen Faktor ⅓."},{v:36,msg:"Da fehlt π."},{v:144*Math.PI,tol:0.2,msg:"Du hast mit dem Durchmesser 6 statt mit dem Radius 3 gerechnet."}]}])],
      hints:["Volumen = Grundfläche · Höhe. Die Grundfläche ist ein Kreis.","V = 3² · π · 4"],
      sol:`<p>Grundfläche: Kreis mit <i>G</i> = 3${sq} · π = 9π. <i>V</i> = <i>G</i> · <i>h</i> = 9π · 4 = 36π ≈ 113.</p>` }
  ]
});

/* ---------- Aufbau der Seiten ---------- */
const main = document.getElementById("main");
const state = { cur:0, done: ST.map(()=>new Set()), pages:[] };
const isDone = si => state.done[si].size === ST[si].tasks.length;
let tileEls = [];

function buildIntro(){
  const p = el("section","page");
  const hero = el("div","hero"), left = el("div"), right = el("div");
  left.innerHTML = `<p class="kicker">Übungseinheit Mathematik, 10. Klasse</p>
  <h1>Fit für den BMT 10</h1>
  <p class="lead">Der BMT prüft grundlegende Kompetenzen aus den Klassen 7 bis 9 – häufig in neuer Verpackung. In acht Stationen übst du, Aufgabentexte richtig zu lesen, den passenden Ansatz zu wählen und sicher zu rechnen.</p>
  <p class="how">Die Reihenfolge wählst du selbst. Jede Station beginnt mit einem Merkkasten. Bei jeder Aufgabe kannst du zwei Tipps und zum Schluss die Lösung aufdecken. Nebenrechnungen machst du im Heft.</p>`;
  const b = el("button","btn","Mit Station 1 beginnen"); b.type="button"; b.onclick=()=>go(1); left.append(b);
  const tiles = el("div","tiles");
  tileEls = ST.map((s,i)=>{ const t = el("button","tile",`<span class="n">${i+1}</span><span class="tt">${s.title}</span>`); t.type="button"; t.onclick=()=>go(i+1); tiles.append(t); return t; });
  right.append(tiles); hero.append(left, right); p.append(hero);
  return p;
}
function buildStation(si){
  const s = ST[si], p = el("section","page");
  const head = el("div","shead"); head.append(el("p","kicker",`Station ${si+1} von ${ST.length}`), el("h1","",s.title));
  const mk = el("div","merke",s.merke); const sent = el("span","qsent"); sent.setAttribute("aria-hidden","true"); mk.append(sent); s._sent = sent;
  p.append(head, el("p","lead",s.lead), mk);
  if(s.top) p.append(s.top());
  s.tasks.forEach((t,ti)=>p.append(buildTask(si,t,ti)));
  const done = el("div","done"); done.id = "done"+si;
  done.append(el("p","", si<ST.length-1 ? "Station geschafft – alle Aufgaben erledigt." : "Letzte Station geschafft!"));
  const nb = el("button","btn", si<ST.length-1 ? `Weiter zu Station ${si+2}` : "Zur Checkliste"); nb.type="button"; nb.onclick=()=>go(si+2);
  done.append(nb); p.append(done);
  return p;
}
function buildTask(si, t, ti){
  const card = el("section","task");
  card.append(el("span","tl", String.fromCharCode(97+ti)+")"));
  const grid = el("div","tgrid"), body = el("div","tbody");
  if(t.fig){
    card.classList.add("hasfig");
    const side = el("div","tfig"), f = el("div","fig"), content = t.fig();
    if(typeof content === "string") f.innerHTML = content; else f.append(content);
    side.append(f); if(t.cap) side.append(el("p","cap",t.cap));
    grid.append(side);
  }
  grid.append(body); card.append(grid);
  body.append(el("div","tp",t.prompt));
  const parts = t.parts.map(mk=>mk());
  parts.forEach(w=>body.append(w.el));
  const ctrl = el("div","ctrl");
  const bc = el("button","btn","Prüfen"), bh = el("button","btn sec","Tipp 1 zeigen");
  bc.type = bh.type = "button";
  const fb = el("span","fb");
  ctrl.append(bc,bh,fb); body.append(ctrl);
  /* Tipps und Lösung in einem festen Bereich mit Reitern statt untereinander */
  const help = el("div","help"), tabs = el("div","htabs"), hb = el("div","hbody");
  help.hidden = true; help.append(tabs, hb); body.append(help);
  const after = el("div","after"); body.append(after);
  body.querySelectorAll("input.in").forEach(i=>i.enterKeyHint="go");
  body.addEventListener("keydown", e => { if(e.key==="Enter" && e.target.tagName==="INPUT"){ e.preventDefault(); bc.click(); } });
  let h = 0, finished = false, solTab = false;
  const show = k => {
    [...tabs.children].forEach((b,i)=>b.classList.toggle("on", i===k));
    if(k < t.hints.length){ hb.className="hbody"; hb.innerHTML = `<div>${t.hints[k]}</div>`; }
    else { hb.className="hbody sol"; hb.innerHTML = t.sol; }
  };
  const addTab = (label, k, cls) => { const b = el("button", cls||"", label); b.type="button"; b.onclick=()=>show(k); tabs.append(b); help.hidden=false; show(k); };
  const addSol = () => { if(solTab) return; solTab = true; addTab("Lösung", t.hints.length, "sol"); };
  const finish = how => {
    finished = true; parts.forEach(w=>w.lock()); bc.disabled = true;
    card.classList.add(how); state.done[si].add(ti);
    if(t.onSolved) t.onSolved(card);
    if(t.after) after.innerHTML = t.after();
    if(how==="solved"){ bh.textContent = "Lösungsweg ansehen"; } else { bh.hidden = true; }
    stationCheck(si);
  };
  bc.onclick = () => {
    if(finished) return;
    let all = true;
    parts.forEach(w=>{ const r=w.check(); w.fb.className = "fb " + (r.ok?"ok":"no"); w.fb.innerHTML = r.ok ? (parts.length>1?"✓ Richtig.":"") : r.msg; if(!r.ok) all=false; });
    if(all){ fb.className="fb ok"; fb.textContent = h ? "Richtig! Nächstes Mal vielleicht ohne Tipp." : "Richtig!"; finish("solved"); }
    else { fb.className="fb"; fb.textContent=""; }
  };
  bh.onclick = () => {
    if(finished){ addSol(); return; }
    if(h < t.hints.length){
      addTab(`Tipp ${h+1}`, h); h++;
      bh.textContent = h < t.hints.length ? `Tipp ${h+1} zeigen` : "Lösung zeigen";
    } else {
      addSol();
      parts.forEach(w=>{ w.reveal(); w.fb.textContent=""; });
      fb.className="fb"; fb.textContent="Vergleiche die Lösung mit deinem Ansatz.";
      finish("shown");
    }
  };
  return card;
}
function buildFinal(){
  const p = el("section","page");
  p.innerHTML = `<div class="shead"><p class="kicker">Geschafft</p><h1>Checkliste für den BMT</h1></div>
  <p class="lead">Typische Fehlerquellen – kurz vor dem Test noch einmal durchlesen.</p>
  <ol class="check">
    <li><b>Alle Operatoren markieren.</b> Angeben: Ergebnis genügt. Berechnen und Bestimmen: Weg zeigen. Begründen: Satz mit „weil“. Deuten: Antwortsatz zur Situation.</li>
    <li><b>y-Achsenabschnitt:</b> ${X} = 0 einsetzen. <b>Nullstellen:</b> <i>f</i>(${X}) = 0 lösen.</li>
    <li>${X}${sq} = 49 hat <b>zwei</b> Lösungen. Bei 3${X}${sq} − 12${X} = 0 ausklammern, <b>nie durch ${X} teilen</b>.</li>
    <li>(${X} + 2)${sq} ist nach <b>links</b> verschoben. Hyperbel: senkrechte Asymptote aus dem Nenner, waagrechte hinter dem Bruch.</li>
    <li>Kürzen nur bei Produkten. Der Nenner darf nicht 0 werden.</li>
    <li>Prozentuale Änderung: durch den <b>alten</b> Wert teilen. Gegebener Prozentwert: durch den Prozentsatz teilen.</li>
    <li>∩ = und, ∪ = oder (mindestens eines), Querstrich = nicht. Zählprinzip: <i>k</i><sup><i>n</i></sup>.</li>
    <li>Einheitskreis: P(cos α | sin α). Parallelogramm: <i>a</i> · <i>b</i> · sin α. Zylinder: <i>r</i>${sq} · π · <i>h</i>.</li>
  </ol>
  <p>Schreib auch bei schweren Aufgaben deinen Ansatz hin: Bei Aufgaben mit 2 Punkten kann schon ein richtiger Ansatz einen Punkt bringen.</p>`;
  const b = el("button","btn sec","Zur Startseite"); b.type="button"; b.onclick=()=>go(0); p.append(b);
  return p;
}
function stationCheck(si){
  if(isDone(si)){ document.getElementById("done"+si).classList.add("on"); renderChrome(); }
}

/* ---------- Navigation: jede Station jederzeit erreichbar ---------- */
const sqBox = document.getElementById("squares");
const prevBtn = document.getElementById("prevBtn"), nextBtn = document.getElementById("nextBtn"), navMid = document.getElementById("navMid");
function renderChrome(){
  sqBox.innerHTML = "";
  ST.forEach((s,i)=>{
    const b = el("button","sq8",String(i+1)); b.type="button";
    b.title = `Station ${i+1}: ${s.title}`; b.setAttribute("aria-label", b.title + (isDone(i)?" (erledigt)":""));
    if(state.cur===i+1){ b.classList.add("cur"); b.setAttribute("aria-current","page"); }
    if(isDone(i)) b.classList.add("done");
    b.onclick = () => go(i+1);
    sqBox.append(b);
  });
  tileEls.forEach((t,i)=>t.classList.toggle("done", isDone(i)));
  const c = state.cur;
  prevBtn.disabled = c===0;
  if(c===0){ navMid.innerHTML="Start"; nextBtn.hidden=false; nextBtn.textContent="Station 1"; }
  else if(c===ST.length+1){ navMid.innerHTML="Checkliste"; nextBtn.hidden=true; }
  else {
    navMid.innerHTML = `<span>Station ${c} / ${ST.length}</span><span class="nt">${ST[c-1].short}</span>`;
    nextBtn.hidden=false; nextBtn.textContent = c===ST.length ? "Checkliste" : "Weiter";
  }
}
/* ---------- Kompakte Merkhilfe ---------- */
const quickEl = document.getElementById("quick"), quickList = document.getElementById("quickList");
const quickBtn = document.getElementById("quickBtn"), quickClose = document.getElementById("quickClose");
let quickObs = null, quickSent = null;
function setQuickOpen(open){
  document.body.classList.toggle("quick-open", open);
  quickBtn.setAttribute("aria-expanded", open ? "true" : "false");
}
function setQuickOn(on){
  document.body.classList.toggle("quick-on", on);
  if(!on) setQuickOpen(false);
}
function onQuickEntries(entries){
  for(const e of entries){
    if(e.target !== quickSent) continue;
    /* Der Sensor reicht vom oberen Rand des Merkkastens bis 90 px vor dessen Ende. Ist er komplett oben aus dem Bild, ist der Kasten weitgehend weg. */
    const top = e.rootBounds ? e.rootBounds.top : 0;
    setQuickOn(!e.isIntersecting && e.boundingClientRect.bottom < top);
  }
}
function headHeight(){ return document.getElementById("top").getBoundingClientRect().height || 64; }
function watchQuick(n){
  if(quickObs) quickObs.disconnect();
  quickSent = null; setQuickOn(false);
  const isStation = n>=1 && n<=ST.length;
  document.body.classList.toggle("st-page", isStation);
  if(!isStation) return;
  const s = ST[n-1];
  quickList.innerHTML = s.quick.map(q=>`<li>${q}</li>`).join("");
  document.getElementById("quickTitle").textContent = "Merkhilfe";
  quickEl.setAttribute("aria-label", `Merkhilfe zu Station ${n}`);
  if(!("IntersectionObserver" in window)) return;
  quickObs = new IntersectionObserver(onQuickEntries, {rootMargin:`-${Math.round(headHeight())}px 0px 0px 0px`, threshold:0});
  quickSent = s._sent;
  quickObs.observe(quickSent);
}
quickBtn.onclick = () => setQuickOpen(!document.body.classList.contains("quick-open"));
quickClose.onclick = () => { setQuickOpen(false); quickBtn.focus(); };
document.addEventListener("keydown", e => { if(e.key==="Escape" && document.body.classList.contains("quick-open")) setQuickOpen(false); });
let resizeT = null;
window.addEventListener("resize", () => { clearTimeout(resizeT); resizeT = setTimeout(()=>{ if(state.cur>=1 && state.cur<=ST.length){ const keep = document.body.classList.contains("quick-on"); watchQuick(state.cur); if(keep) setQuickOn(true); } }, 200); });

function go(n){
  state.cur = n;
  state.pages.forEach((p,i)=>p.classList.toggle("on", i===n));
  renderChrome();
  window.scrollTo(0,0);
  watchQuick(n);
}
prevBtn.onclick = () => go(Math.max(0,state.cur-1));
nextBtn.onclick = () => go(Math.min(ST.length+1, state.cur+1));
document.getElementById("homeBtn").onclick = () => go(0);

state.pages.push(buildIntro());
ST.forEach((s,i)=>state.pages.push(buildStation(i)));
state.pages.push(buildFinal());
state.pages.forEach(p=>main.append(p));
go(0);
</script>
