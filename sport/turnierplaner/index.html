<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Turnierplaner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@600;700&display=swap" rel="stylesheet">
<style>
:root{
  --floor:#EDF0EA; --paper:#FFFFFF; --soft:#F4F6F2; --ink:#1B2638; --muted:#5D6878; --line:#D3D9D0;
  --g0:#2360C4; --g1:#C9323A; --g2:#A87300; --ko:#1C8656; --warn:#B3261E; --focus:#2360C4;
  --cond:"Barlow Condensed","Arial Narrow","Roboto Condensed",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  color-scheme:light dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --floor:#111923; --paper:#1A2431; --soft:#212D3C; --ink:#E7ECF2; --muted:#98A5B5; --line:#2E3B4C;
    --g0:#77A3F2; --g1:#F07A80; --g2:#E5B53C; --ko:#4CC38A; --warn:#FF8A80; --focus:#77A3F2;
  }
}
:root[data-theme="dark"]{
  --floor:#111923; --paper:#1A2431; --soft:#212D3C; --ink:#E7ECF2; --muted:#98A5B5; --line:#2E3B4C;
  --g0:#77A3F2; --g1:#F07A80; --g2:#E5B53C; --ko:#4CC38A; --warn:#FF8A80; --focus:#77A3F2;
}
*,*::before,*::after{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
body{margin:0;background:var(--floor);color:var(--ink);font:400 17px/1.45 var(--body)}
[hidden]{display:none!important}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--focus);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding-left:20px;padding-right:20px}

/* Kopf */
.top{background:var(--paper);border-bottom:1px solid var(--line);position:sticky;top:env(safe-area-inset-top,0px);z-index:5}
.top-inner{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:0 20px;padding-top:12px}
h1{font:700 1.9rem/1.1 var(--cond);margin:0 0 10px;letter-spacing:.01em;overflow-wrap:anywhere}
nav{display:flex;gap:2px;overflow-x:auto}
.tab{background:none;border:0;border-bottom:4px solid transparent;padding:10px 12px 8px;font-weight:600;color:var(--muted);cursor:pointer;white-space:nowrap}
.tab.on{color:var(--ink);border-bottom-color:var(--ink)}
main{padding-top:22px;padding-bottom:60px}

/* Buttons */
.btn{font-weight:600;padding:12px 18px;border-radius:8px;border:1.5px solid var(--ink);background:var(--paper);color:var(--ink);cursor:pointer;touch-action:manipulation}
.btn.primary{background:var(--ink);color:var(--paper)}
.btn.danger{border-color:var(--warn);color:var(--warn)}
.btn.ghost{border-color:var(--line)}
.btn:disabled{opacity:.4;cursor:default}
.btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}

/* Spielplan */
.bar{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.info{margin:0;color:var(--muted)}
.phase{font:700 1.45rem/1.2 var(--cond);margin:26px 0 10px}
.phase:first-of-type{margin-top:6px}
.phase span{font:500 .95rem var(--body);color:var(--muted);margin-left:8px}
.game{background:var(--paper);border:1px solid var(--line);border-left:6px solid var(--gc);border-radius:10px;padding:10px 16px 12px;margin:0 0 10px}
.game.done{background:var(--soft)}
.game.next{box-shadow:0 0 0 2px var(--gc)}
.meta{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 14px;font-size:.9rem;color:var(--muted);margin-bottom:6px}
.time{font:700 1.1rem var(--cond);color:var(--ink)}
.tag{color:var(--gc);font-weight:600}
.flag{margin-left:auto;font-weight:700;color:var(--gc)}
.match{display:grid;grid-template-columns:1fr auto 1fr;gap:14px;align-items:center}
.team{display:flex;flex-direction:column;min-width:0}
.team.home{text-align:right;align-items:flex-end}
.nm{font-weight:600;font-size:1.15rem;line-height:1.2;overflow-wrap:anywhere}
.nm.win{font-weight:700}
.nm.lose{color:var(--muted);font-weight:500}
.nm.ph{color:var(--muted);font-style:italic;font-weight:500}
.hint{font-size:.85rem;color:var(--muted)}
.hint:empty{display:none}
.score{display:flex;align-items:center;gap:8px}
.stp{display:flex;align-items:center;gap:4px}
.si{width:3.4rem;height:3.4rem;border:1.5px solid var(--line);border-radius:8px;background:var(--floor);color:var(--ink);font:700 2rem/1 var(--cond);text-align:center;padding:0;-webkit-appearance:none;appearance:none}
.si:focus{outline:3px solid var(--focus);outline-offset:1px;background:var(--paper)}
.sb{width:2.5rem;height:2.5rem;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-size:1.35rem;line-height:1;font-weight:600;cursor:pointer;touch-action:manipulation;padding:0}
.sb:disabled,.si:disabled{opacity:.3;cursor:default}
.colon{font:700 2rem var(--cond);color:var(--muted)}
.deci{margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:8px 16px;text-align:center}
.deci-l{font-size:.92rem;color:var(--muted);max-width:26rem}
.score.small .si{width:2.8rem;height:2.8rem;font-size:1.6rem}
.ref{font-size:.92rem;color:var(--muted);text-align:center;margin-top:6px}
.ref:empty{display:none}
@media (max-width:640px){
  .match{grid-template-columns:1fr 1fr;gap:8px 12px}
  .score{grid-column:1 / -1;grid-row:2;justify-content:center}
  .team.away{text-align:left}
}

/* Tabellen */
.tables{display:grid;gap:16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,420px),1fr))}
.tbl,.ko,.podium,.ov-now,.ov-list{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:14px 16px}
.tbl{border-top:5px solid var(--gc)}
.tbl h2,.ko h2,.podium h2,.ov-list h2{font:700 1.35rem/1.2 var(--cond);margin:0 0 8px;display:flex;flex-wrap:wrap;justify-content:space-between;align-items:baseline;gap:4px 10px}
.prog{font:500 .85rem var(--body);color:var(--muted)}
.scroll{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums}
th{font-weight:600;color:var(--muted);font-size:.85rem;text-align:right;padding:6px;border-bottom:1px solid var(--line);white-space:nowrap}
td{text-align:right;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th.tn,td.tn{text-align:left;width:100%;white-space:normal}
th.pl,td.pl{text-align:left;width:2.4em}
td.pk,th.pk{font-weight:700}
tr.q td{background:color-mix(in srgb,var(--gc) 11%,transparent)}
tr.q td.pl{box-shadow:inset 4px 0 0 var(--gc)}
.notes{margin:10px 0 0;padding:0;list-style:none;font-size:.86rem;color:var(--muted)}
.legend{font-size:.9rem;color:var(--muted);margin:0 0 12px}
.ko{margin-top:18px;border-top:5px solid var(--ko)}
.ko-g{display:grid;grid-template-columns:8.5rem 1fr auto 1fr;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line)}
.ko-g:last-child{border-bottom:0}
.ko-l{color:var(--ko);font-weight:600;font-size:.9rem}
.ko-t{text-align:right;overflow-wrap:anywhere}
.ko-t.r{text-align:left}
.ko-t.win{font-weight:700}
.ko-s{font:700 1.35rem var(--cond);text-align:center;min-width:4.5rem}
.ko-s small{display:block;font:500 .75rem var(--body);color:var(--muted)}
.ph{color:var(--muted);font-style:italic}
@media (max-width:560px){
  .ko-g{grid-template-columns:1fr auto 1fr}
  .ko-l{grid-column:1 / -1}
}
.podium{margin-bottom:18px;border-top:5px solid var(--g2)}
.podium ol{list-style:none;margin:0;padding:0;display:flex;flex-wrap:wrap;gap:8px 28px}
.podium li{display:flex;align-items:baseline;gap:8px}
.pp{font:700 1.6rem var(--cond);color:var(--muted)}
.pn{font-weight:600;font-size:1.15rem}
.podium li.p1 .pp{color:var(--g2)}
.podium li.p1 .pn{font:700 1.7rem/1.1 var(--cond)}
.podium.big li.p1 .pn{font-size:clamp(2.2rem,7vw,3.6rem)}
.podium.big .pn{font-size:1.4rem}

/* Übersicht */
.ov-now{border-left:8px solid var(--gc);padding:18px 22px;margin-bottom:16px}
.ov-k{margin:0 0 6px;font-weight:700;color:var(--gc);font-size:1.1rem}
.ov-k span{font-weight:500;color:var(--muted);margin-left:6px}
.ov-match{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 18px;font:700 clamp(2.1rem,6.5vw,3.6rem)/1.05 var(--cond);overflow-wrap:anywhere}
.ov-match .vs{font:500 1.1rem var(--body);color:var(--muted)}
.ov-ref{margin:10px 0 0;font-size:1.15rem}
.ov-list{margin-bottom:16px}
.ovr{display:grid;grid-template-columns:3.6rem 1fr;gap:2px 12px;padding:10px 0;border-bottom:1px solid var(--line);font-size:1.12rem}
.ovr:last-child{border-bottom:0}
.ovr .t{font:700 1.2rem var(--cond)}
.ovr .s{grid-column:2;font-size:.9rem;color:var(--muted)}
.ovr .g{color:var(--gc);font-weight:600;font-size:.9rem;margin-left:6px}
.ov .tbl td{font-size:1.08rem}
.ftag{font-weight:700;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:0 7px}
.ovc{display:flex;flex-direction:column;gap:4px}
.ovg .s{display:block}
.ovr .ftg{color:var(--muted)}
.ov-multi{border-left-color:var(--ink)}
.ov-multi .ov-k{color:var(--ink)}
.ov-g{border-left:6px solid var(--gc);padding-left:14px;margin-top:14px}
.ov-gk{margin:0 0 2px;font-weight:700;color:var(--gc)}
.ov-multi .ov-match{font-size:clamp(1.8rem,5.5vw,3rem)}
.startnote{font-size:.9rem;color:var(--muted)}
.startnote .help{margin:0}
.startnote .btn{padding:7px 12px;font-size:.9rem}

/* Einrichten */
.card{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin-bottom:14px}
.card h2{font:700 1.4rem/1.2 var(--cond);margin:0 0 12px}
.fld{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.fld>span{font-weight:600;font-size:.95rem}
.fld input,.trow input{font-weight:500;font-size:1.05rem;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;background:var(--floor);color:var(--ink);min-width:0;width:100%}
.fld input:focus,.trow input:focus{outline:3px solid var(--focus);outline-offset:1px;background:var(--paper)}
.count{display:flex;align-items:center;gap:14px}
.count output{font:700 2.3rem/1 var(--cond);min-width:2.2ch;text-align:center}
.modes{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,270px),1fr));margin-bottom:14px}
.mode{display:flex;flex-direction:column;gap:3px;border:1.5px solid var(--line);border-radius:8px;padding:12px 14px;cursor:pointer;position:relative}
.mode input{position:absolute;opacity:0;pointer-events:none}
.mode.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.mode:focus-within{outline:3px solid var(--focus);outline-offset:2px}
.mode.dis{opacity:.45;cursor:default}
.mn{font-weight:700}
.md{font-size:.9rem;color:var(--muted)}
.chk{display:flex;gap:10px;align-items:center;font-weight:500;cursor:pointer;margin:4px 0}
.chk input{width:1.3rem;height:1.3rem;accent-color:var(--ink);flex:none}
.teams{display:grid;gap:8px 16px;grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.trow{display:flex;align-items:center;gap:8px}
.tno{font:700 1.15rem var(--cond);color:var(--muted);width:1.6rem;text-align:right;flex:none}
.gsel{display:flex;gap:4px;flex:none}
.gb{width:2.5rem;height:2.5rem;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);color:var(--gc);font-weight:700;cursor:pointer;touch-action:manipulation}
.gb.on{background:var(--gc);border-color:var(--gc);color:var(--paper)}
.gcount{font-size:.9rem;color:var(--muted);margin:12px 0 0}
.gcount:empty{display:none}
.grid4{display:grid;gap:0 14px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.seg{display:flex;gap:6px}
.segb{padding:10px 16px;border-radius:8px;border:1.5px solid var(--line);background:var(--paper);font-weight:600;cursor:pointer}
.segb.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.help{font-size:.9rem;color:var(--muted);margin:2px 0 12px}
.err{color:var(--warn);font-weight:600;margin:0 0 12px}
.warn{color:var(--warn);margin:0 0 12px}
.ok{color:var(--ko);margin:0 0 12px}
.sum-main{margin:0 0 10px;font-size:1.08rem}
.sum{border-color:var(--ink)}
/* Stoppuhr */
.sw{padding-top:8px;padding-bottom:10px;border-top:1px solid var(--line)}
.sw-row{display:flex;align-items:center;gap:6px}
.sw-set{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.sw-lbl{font-weight:600;color:var(--muted)}
.sw-in{width:3.6rem;height:2.5rem;border:1.5px solid var(--line);border-radius:8px;background:var(--floor);color:var(--ink);font:700 1.4rem/1 var(--cond);text-align:center;padding:0;-webkit-appearance:none;appearance:none}
.sw-in:focus{outline:3px solid var(--focus);outline-offset:1px;background:var(--paper)}
.sw .btn.on{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.sw-time{font:700 2rem/1 var(--cond);font-variant-numeric:tabular-nums;min-width:0;margin-right:auto;white-space:nowrap}
.sw-time.over{color:var(--warn)}
.sw .btn{padding:9px 10px;min-height:44px;font-size:.95rem;white-space:nowrap;flex:none}
.sw .btn.primary{min-width:4.6rem}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-inner">
    <h1 id="title">Turnierplaner</h1>
    <nav id="tabs" aria-label="Bereiche"></nav>
  </div>
  <div class="wrap sw" id="sw" hidden>
    <div class="sw-row">
      <span class="sw-time" id="swTime" role="timer">0:00</span>
      <button type="button" class="btn primary" id="swGo">Start</button>
      <button type="button" class="btn ghost" id="swReset" disabled>Reset</button>
      <button type="button" class="btn ghost" id="swCfg" aria-expanded="false" aria-controls="swSet" aria-label="Dauer und Ton einstellen">⚙</button>
    </div>
    <div class="sw-set" id="swSet" hidden>
      <span class="sw-lbl">Dauer</span>
      <button type="button" class="sb" id="swMinus" aria-label="Eine Minute weniger">−</button>
      <input id="swDur" class="sw-in" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="3" autocomplete="off" aria-label="Dauer in Minuten">
      <span class="sw-lbl">min</span>
      <button type="button" class="sb" id="swPlus" aria-label="Eine Minute mehr">+</button>
      <button type="button" class="btn ghost" id="swStd" hidden>Standard</button>
      <button type="button" class="btn ghost" id="swSnd">Ton an</button>
    </div>
  </div>
</header>
<main id="app" class="wrap"></main>

<script>
(function(){
"use strict";
const KEY='turnierplaner-v1';
const LETTERS='ABC';
const MODES=[
  {id:'rr',       name:'Jeder gegen jeden', desc:'Alle spielen gegeneinander, die Tabelle entscheidet.', groups:1, ko:false, min:2},
  {id:'rr_final', name:'Jeder gegen jeden mit Finale', desc:'Danach Finale 1. gegen 2. und ab 4 Teams Spiel um Platz 3 (3. gegen 4.).', groups:1, ko:true, min:3},
  {id:'g2',       name:'Zwei Gruppen', desc:'Jede Gruppe spielt jeder gegen jeden, ohne Endrunde.', groups:2, ko:false, min:4},
  {id:'g3',       name:'Drei Gruppen', desc:'Jede Gruppe spielt jeder gegen jeden, ohne Endrunde.', groups:3, ko:false, min:6},
  {id:'g2_ko',    name:'Zwei Gruppen mit Endrunde über Kreuz', desc:'Halbfinale A1 gegen B2 und B1 gegen A2, danach Spiel um Platz 3 und Finale.', groups:2, ko:true, min:4},
  {id:'g3_ko',    name:'Drei Gruppen mit Endrunde', desc:'Die drei Gruppensieger und der beste Zweite spielen Halbfinale, danach Spiel um Platz 3 und Finale.', groups:3, ko:true, min:6}
];
const modeOf=id=>MODES.find(m=>m.id===id)||MODES[0];
const $=s=>document.querySelector(s);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const num=v=>(v===''||v===null||v===undefined||isNaN(parseInt(v,10)))?null:parseInt(v,10);
const cmp=(a,b)=>{for(let i=0;i<a.length;i++){if(a[i]<b[i])return -1;if(a[i]>b[i])return 1;}return 0;};
const reduceMotion=()=>window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches;

let S=load();
let view=S?'plan':'setup';
let draft=null;
let pendingConfirm=null;

function load(){
  try{
    const raw=localStorage.getItem(KEY); if(!raw) return null;
    const o=JSON.parse(raw);
    if(!o||!o.settings||!Array.isArray(o.games)) return null;
    o.results=o.results||{};
    o.settings.fields=fieldsOf(o.settings);
    o.games.forEach((g,i)=>{if(g.slot===undefined){g.slot=i; g.f=0;}});
    if(!Array.isArray(o.lots)||o.lots.length!==o.settings.teamCount) o.lots=makeLots(o.settings.teamCount);
    return o;
  }catch(e){return null;}
}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
function makeLots(n){return Array.from({length:n},()=>Math.random());}

function tname(st,i){const v=(st.teams[i]||'').trim(); return v||('Team '+(i+1));}
const name=i=>tname(S.settings,i);
function defaultGroups(n,g){return Array.from({length:n},(_,i)=>g===1?0:Math.floor(i*g/n));}
function toMin(t){const m=/^(\d{1,2}):(\d{2})/.exec(t||''); return m?(+m[1])*60+(+m[2]):null;}
function fmt(m){m=((Math.round(m)%1440)+1440)%1440; return String(Math.floor(m/60)).padStart(2,'0')+':'+String(m%60).padStart(2,'0');}
function nowExact(){const d=new Date(); return fmt(d.getHours()*60+d.getMinutes());}
const fieldsOf=st=>Math.max(1,Math.min(4,Math.floor((+st.teamCount||2)/2),Math.round(+st.fields)||1));
function finalize(d){const o=clone(d); if(o.startAuto) o.start=nowExact(); o.startAuto=false; return o;}
function defaultsDraft(){
  const n=6;
  return {name:'',teamCount:n,teams:Array(n).fill(''),mode:'g2_ko',groupOf:defaultGroups(n,2),hinRueck:false,winPts:3,fields:1,startAuto:true,start:nowExact(),dur:'7',change:'1',pause:'0',end:'',refs:true};
}
const gcol=g=>g.phase==='ko'?'var(--ko)':'var(--g'+g.g+')';

/* ---------- Spielplan erzeugen ---------- */
function circlePairs(list){
  const arr=list.slice(); if(arr.length%2) arr.push(null);
  const n=arr.length, out=[];
  for(let r=0;r<n-1;r++){
    for(let i=0;i<n/2;i++){
      const a=arr[i], b=arr[n-1-i];
      if(a!==null&&b!==null) out.push((r+i)%2?[b,a]:[a,b]);
    }
    arr.splice(1,0,arr.pop());
  }
  return out;
}
// Zeitfenster füllen: pro Fenster bis zu F Spiele auf verschiedenen Feldern, kein Team doppelt,
// möglichst wenige direkt aufeinanderfolgende Spiele eines Teams, Spiele gleichmäßig verteilen.
// Mit F=1 entspricht das exakt der bisherigen Reihenfolge.
function scheduleSlots(list,F,slots,last,cnt){
  const rem=list.map((x,i)=>Object.assign({},x,{i}));
  while(rem.length){
    const pos=slots.length, pick=[], used=new Set();
    for(let n=0;n<F&&rem.length;n++){
      let bi=-1, bk=null;
      const left={}; rem.forEach(x=>{left[x.g]=(left[x.g]||0)+1;});
      rem.forEach((x,k)=>{
        if(used.has(x.h)||used.has(x.a)) return;
        const rh=last[x.h]===undefined?99:pos-last[x.h];
        const ra=last[x.a]===undefined?99:pos-last[x.a];
        const minR=Math.min(rh,ra);
        const key=[Math.min(minR,2), left[x.g], -((cnt[x.h]||0)+(cnt[x.a]||0)), minR, -x.i];
        if(!bk||cmp(key,bk)>0){bk=key;bi=k;}
      });
      if(bi<0) break;
      const x=rem.splice(bi,1)[0];
      used.add(x.h); used.add(x.a); pick.push(x);
      cnt[x.h]=(cnt[x.h]||0)+1; cnt[x.a]=(cnt[x.a]||0)+1;
    }
    pick.forEach(x=>{last[x.h]=pos; last[x.a]=pos;});
    slots.push(pick);
  }
}
function buildGames(st){
  const m=modeOf(st.mode), F=fieldsOf(st), groups=[...Array(m.groups)].map(()=>[]);
  for(let i=0;i<st.teamCount;i++) groups[m.groups===1?0:st.groupOf[i]].push(i);
  const hin=[];
  groups.forEach((list,g)=>circlePairs(list).forEach(p=>hin.push({g,h:p[0],a:p[1]})));
  const slots=[], last={}, cnt={};
  scheduleSlots(hin,F,slots,last,cnt);
  if(st.hinRueck) scheduleSlots(hin.map(x=>({g:x.g,h:x.a,a:x.h})),F,slots,last,cnt);
  const games=[];
  slots.forEach((pick,sl)=>{
    // Feld: Gruppe bleibt nach Möglichkeit auf "ihrem" Feld
    const taken=new Set(), asg=pick.map(x=>{const w=x.g%F; if(!taken.has(w)){taken.add(w); return [x,w];} return [x,null];});
    asg.forEach(a=>{if(a[1]===null){let f=0; while(taken.has(f)) f++; taken.add(f); a[1]=f;}});
    asg.sort((p,q)=>p[1]-q[1]);
    asg.forEach(([x,f])=>games.push({id:'G'+(games.length+1),phase:'group',g:x.g,h:x.h,a:x.a,slot:sl,f}));
  });
  const R=(g,r)=>({t:'rank',g,r}), W=id=>({t:'w',id}), L=id=>({t:'l',id}), Q=s=>({t:'q',slot:s});
  let ko=[];
  if(m.id==='rr_final'){
    if(st.teamCount>=4) ko.push({id:'P3',label:'Spiel um Platz 3',hs:R(0,3),as:R(0,4)});
    ko.push({id:'F',label:'Finale',hs:R(0,1),as:R(0,2)});
  }
  if(m.id==='g2_ko'||m.id==='g3_ko'){
    const hf1=m.id==='g2_ko'?[R(0,1),R(1,2)]:[Q(1),Q(4)];
    const hf2=m.id==='g2_ko'?[R(1,1),R(0,2)]:[Q(2),Q(3)];
    ko=[
      {id:'HF1',label:'Halbfinale 1',hs:hf1[0],as:hf1[1]},
      {id:'HF2',label:'Halbfinale 2',hs:hf2[0],as:hf2[1]},
      {id:'P3',label:'Spiel um Platz 3',hs:L('HF1'),as:L('HF2')},
      {id:'F',label:'Finale',hs:W('HF1'),as:W('HF2')}
    ];
  }
  // Endrunde: mit mehreren Feldern laufen Halbfinale 1 und 2 sowie Spiel um Platz 3 und Finale gleichzeitig
  const rounds=m.id==='rr_final'?[ko.map(k=>k.id)]:(ko.length?[['HF1','HF2'],['P3','F']]:[]);
  const fpos={HF1:0,HF2:1,F:0,P3:1}, slotOf={}, fOf={};
  let sn=slots.length;
  rounds.forEach(r=>{
    if(F>=2){r.forEach(id=>{slotOf[id]=sn; fOf[id]=fpos[id];}); sn++;}
    else r.forEach(id=>{slotOf[id]=sn++; fOf[id]=0;});
  });
  ko.forEach(k=>games.push(Object.assign({phase:'ko',slot:slotOf[k.id],f:fOf[k.id]},k)));
  return games;
}
function srcLabel(src,st){
  if(!src) return '';
  const m=modeOf(st.mode);
  if(src.t==='rank') return m.groups===1?(src.r+'. der Tabelle'):(src.r+'. Gruppe '+LETTERS[src.g]);
  if(src.t==='q') return src.slot===4?'Bester Zweiter':'Gruppensieger';
  const lab={HF1:'Halbfinale 1',HF2:'Halbfinale 2'}[src.id]||src.id;
  return (src.t==='w'?'Sieger ':'Verlierer ')+lab;
}
function times(st,games){
  const s=toMin(st.start); const start=s===null?480:s;
  const step=(durOf(st,games).dur||0)+(+st.change||0);
  const firstKO=games.findIndex(g=>g.phase==='ko');
  const koSlot=firstKO>0?games[firstKO].slot:null;
  return games.map(g=>start+g.slot*step+(koSlot!==null&&g.slot>=koSlot?(+st.pause||0):0));
}
const slotCount=games=>games.length?Math.max(...games.map(g=>g.slot))+1:0;
function endTime(st,games){if(!games.length) return null; const t=times(st,games); return t[t.length-1]+(durOf(st,games).dur||0);}
// Spieldauer: eingegeben, sonst aus Beginn und Stundenende berechnet (ganze Minuten, abgerundet)
function durOf(st,games){
  const raw=st.dur===undefined||st.dur===null?'':String(st.dur).trim();
  if(raw!==''&&+raw>0) return {dur:+raw,auto:false};
  const s=toMin(st.start), e=toMin(st.end), n=slotCount(games);
  if(s===null||e===null||!n) return {dur:null,auto:true};
  const firstKO=games.findIndex(g=>g.phase==='ko');
  const avail=e-s-(firstKO>0?(+st.pause||0):0)-(n-1)*(+st.change||0);
  const v=Math.floor(avail/n);
  return {dur:v>=1?v:null,auto:true};
}

/* ---------- Auswertung ---------- */
function sortTeams(list,played,wp){
  const gd=o=>o.gf-o.ga;
  list.sort((x,y)=>y.pts-x.pts||gd(y)-gd(x)||y.gf-x.gf||x.team-y.team);
  const out=[]; let i=0;
  while(i<list.length){
    let j=i+1;
    while(j<list.length&&list[j].pts===list[i].pts&&gd(list[j])===gd(list[i])&&list[j].gf===list[i].gf) j++;
    const block=list.slice(i,j);
    if(block.length>1){
      const set=new Set(block.map(b=>b.team)), mini={};
      block.forEach(b=>mini[b.team]={pts:0,gd:0,gf:0});
      played.forEach(p=>{
        if(set.has(p.h)&&set.has(p.a)){
          const A=mini[p.h], B=mini[p.a];
          A.gf+=p.x; B.gf+=p.y; A.gd+=p.x-p.y; B.gd+=p.y-p.x;
          if(p.x>p.y) A.pts+=wp; else if(p.y>p.x) B.pts+=wp; else {A.pts++;B.pts++;}
        }
      });
      block.sort((x,y)=>{const a=mini[x.team],b=mini[y.team]; return b.pts-a.pts||b.gd-a.gd||b.gf-a.gf||S.lots[x.team]-S.lots[y.team];});
      for(let k=1;k<block.length;k++){
        const a=mini[block[k-1].team], b=mini[block[k].team];
        block[k].tie=(a.pts===b.pts&&a.gd===b.gd&&a.gf===b.gf)?'Los':'direkter Vergleich';
      }
    }
    out.push(...block); i=j;
  }
  return out;
}
function qSlots(rank){
  const key=s=>{const p=Math.max(s.sp,1); return [s.pts/p,(s.gf-s.ga)/p,s.gf/p,-S.lots[s.team]];};
  const byKey=(a,b)=>cmp(key(b),key(a));
  const W=rank.map((r,g)=>Object.assign({},r[0],{g})).sort(byKey);
  const sec=rank.map((r,g)=>r[1]?Object.assign({},r[1],{g}):null).filter(Boolean).sort(byKey)[0];
  if(!sec||W.length<3) return {};
  if(W[0].g===sec.g) return {1:W[1].team,4:sec.team,2:W[0].team,3:W[2].team};
  return {1:W[0].team,4:sec.team,2:W[1].team,3:W[2].team};
}
function compute(){
  const st=S.settings, m=modeOf(st.mode), wp=+st.winPts||3;
  const res=id=>S.results[id]||{};
  const doneG=g=>num(res(g.id).h)!==null&&num(res(g.id).a)!==null;
  const groupGames=[...Array(m.groups)].map(()=>[]);
  S.games.forEach(g=>{if(g.phase==='group') groupGames[g.g].push(g);});
  const groupDone=groupGames.map(l=>l.every(doneG));
  const groupStarted=groupGames.map(l=>l.some(doneG));
  const rank=groupGames.map((list,gi)=>{
    const s={};
    for(let i=0;i<st.teamCount;i++) if((m.groups===1?0:st.groupOf[i])===gi) s[i]={team:i,sp:0,s:0,u:0,n:0,gf:0,ga:0,pts:0};
    const played=list.filter(doneG).map(g=>({h:g.h,a:g.a,x:num(res(g.id).h),y:num(res(g.id).a)}));
    played.forEach(p=>{add(s[p.h],p.x,p.y); add(s[p.a],p.y,p.x);});
    return sortTeams(Object.values(s),played,wp);
  });
  function add(o,f,a){o.sp++;o.gf+=f;o.ga+=a; if(f>a){o.s++;o.pts+=wp;} else if(f===a){o.u++;o.pts+=1;} else o.n++;}
  const allGroupsDone=groupDone.every(Boolean);
  const anyStarted=groupStarted.some(Boolean);
  const q=m.id==='g3_ko'?qSlots(rank):{};
  const ko={}, teamsOf=[], hint=[];
  function resolve(src,strict){
    if(src.t==='rank'){
      if(strict&&!groupDone[src.g]) return null;
      if(!strict&&!groupStarted[src.g]) return null;
      const e=rank[src.g][src.r-1]; return e?e.team:null;
    }
    if(src.t==='q'){
      if(strict&&!allGroupsDone) return null;
      if(!strict&&!anyStarted) return null;
      return q[src.slot]===undefined?null:q[src.slot];
    }
    const k=ko[src.id]; if(!k||k.winner===null) return null;
    return src.t==='w'?k.winner:k.loser;
  }
  S.games.forEach((g,i)=>{
    if(g.phase==='group'){teamsOf[i]=[g.h,g.a]; hint[i]=[null,null]; return;}
    const r=[resolve(g.hs,true),resolve(g.as,true)];
    teamsOf[i]=r; hint[i]=[r[0]===null?resolve(g.hs,false):null, r[1]===null?resolve(g.as,false):null];
    const rr=res(g.id), x=num(rr.h), y=num(rr.a), px=num(rr.ph), py=num(rr.pa);
    let winner=null, loser=null;
    const known=r[0]!==null&&r[1]!==null;
    if(known&&x!==null&&y!==null){
      if(x!==y){winner=x>y?r[0]:r[1]; loser=x>y?r[1]:r[0];}
      else if(px!==null&&py!==null&&px!==py){winner=px>py?r[0]:r[1]; loser=px>py?r[1]:r[0];}
    }
    ko[g.id]={winner,loser,draw:known&&x!==null&&y!==null&&x===y};
  });
  const done=S.games.map(g=>g.phase==='group'?doneG(g):ko[g.id].winner!==null);
  const next=done.indexOf(false);
  const nextSet=new Set(next<0?[]:S.games.map((g,i)=>i).filter(i=>S.games[i].slot===S.games[next].slot&&!done[i]));
  return {m,rank,groupGames,groupDone,allGroupsDone,q,ko,teamsOf,hint,done,next,nextSet,refs:computeRefs(teamsOf)};
}
function computeRefs(teamsOf){
  const st=S.settings, n=st.teamCount, G=S.games;
  if(!st.refs||n<3) return teamsOf.map(()=>null);
  const cnt=Array(n).fill(0), out=G.map(()=>null), inSlot={}, taken={};
  G.forEach((g,i)=>{const set=inSlot[g.slot]||(inSlot[g.slot]=new Set()); teamsOf[i].forEach(t=>{if(t!==null) set.add(t);});});
  const plays=(sl,t)=>!!inSlot[sl]&&inSlot[sl].has(t);
  const laterKO=(sl,t)=>G.some((g,k)=>g.phase==='ko'&&g.slot>sl&&teamsOf[k].includes(t));
  G.forEach((g,i)=>{
    const tt=teamsOf[i]; if(tt[0]===null||tt[1]===null) return;
    const sl=g.slot, tk=taken[sl]||(taken[sl]=new Set());
    let best=null, bs=Infinity;
    for(let t=0;t<n;t++){
      if(plays(sl,t)||tk.has(t)) continue;
      const sc=cnt[t]*10+(plays(sl+1,t)?5:0)+(plays(sl-1,t)?2:0)+(g.phase==='ko'&&laterKO(sl,t)?4:0);
      if(sc<bs){bs=sc;best=t;}
    }
    if(best!==null){cnt[best]++; tk.add(best); out[i]=best;}
  });
  return out;
}
function podium(c){
  const m=c.m;
  if(m.ko){
    const f=c.ko.F; if(!f||f.winner===null) return null;
    let third=null;
    if(c.ko.P3) third=c.ko.P3.winner;
    else if(m.id==='rr_final'&&c.rank[0][2]) third=c.rank[0][2].team;
    return {type:'podium',list:[f.winner,f.loser,third]};
  }
  if(!c.done.every(Boolean)) return null;
  if(m.groups===1) return {type:'podium',list:c.rank[0].slice(0,3).map(s=>s.team)};
  return {type:'groups',list:c.rank.map(r=>r[0].team)};
}
function qualifies(pos,team,c){
  const id=c.m.id;
  if(id==='g2_ko'||id==='rr_final') return pos<=2;
  if(id==='g3_ko') return pos===1||team===c.q[4];
  return false;
}

function stepper(id,k){
  const v=(S.results[id]||{})[k];
  return `<div class="stp"><button type="button" class="sb" data-step="-1" data-id="${id}" data-k="${k}" aria-label="Ein Tor weniger">−</button><input id="in-${id}-${k}" class="si" type="text" inputmode="numeric" pattern="[0-9]*" maxlength="2" autocomplete="off" data-id="${id}" data-k="${k}" value="${v===null||v===undefined?'':v}"><button type="button" class="sb" data-step="1" data-id="${id}" data-k="${k}" aria-label="Ein Tor mehr">+</button></div>`;
}
function renderPlan(){
  const st=S.settings, m=modeOf(st.mode), T=times(st,S.games), end=endTime(st,S.games);
  const firstKO=S.games.findIndex(g=>g.phase==='ko');
  let h=`<div class="bar"><p class="info">${S.games.length} Spiele${fieldsOf(st)>1?` auf ${fieldsOf(st)} Feldern`:''} je ${durOf(st,S.games).dur} min${durOf(st,S.games).auto?' (automatisch berechnet)':''}, Ende ca. ${fmt(end)} Uhr</p><button type="button" class="btn ghost" id="jump">Zum aktuellen Spiel</button></div>`;
  S.games.forEach((g,i)=>{
    if(i===0&&firstKO>0) h+=`<h2 class="phase">Vorrunde</h2>`;

    const tag=g.phase==='ko'?g.label:(m.groups>1?'Gruppe '+LETTERS[g.g]:'');
    h+=`<article class="game" data-i="${i}" style="--gc:${gcol(g)}">
      <div class="meta"><span class="time">${fmt(T[i])}</span><span>Spiel ${i+1}</span>${fieldsOf(st)>1?`<span class="ftag">Feld ${g.f+1}</span>`:''}${tag?`<span class="tag">${esc(tag)}</span>`:''}<span class="flag"></span></div>
      <div class="match">
        <div class="team home"><span class="nm"></span><span class="hint"></span></div>
        <div class="score">${stepper(g.id,'h')}<span class="colon">:</span>${stepper(g.id,'a')}</div>
        <div class="team away"><span class="nm"></span><span class="hint"></span></div>
      </div>
      ${g.phase==='ko'?`<div class="deci" hidden><span class="deci-l">Unentschieden. Ergebnis der Entscheidung, z. B. Siebenmeterschießen:</span><div class="score small">${stepper(g.id,'ph')}<span class="colon">:</span>${stepper(g.id,'pa')}</div></div>`:''}
      <div class="ref"></div>

  });

function refreshPlan(){
  const c=compute(), st=S.settings;
  document.querySelectorAll('.game').forEach(el=>{
    const i=+el.dataset.i, g=S.games[i], tt=c.teamsOf[i], hn=c.hint[i];
    const r=S.results[g.id]||{}, x=num(r.h), y=num(r.a);
    const nm=el.querySelectorAll('.nm'), hi=el.querySelectorAll('.hint');
    [0,1].forEach(k=>{
      if(tt[k]!==null){nm[k].textContent=name(tt[k]); nm[k].classList.remove('ph'); hi[k].textContent='';}
      else{nm[k].textContent=srcLabel(k?g.as:g.hs,st); nm[k].classList.add('ph'); hi[k].textContent=hn[k]!==null?'aktuell: '+name(hn[k]):'';}
    });
    const known=tt[0]!==null&&tt[1]!==null;
    el.querySelectorAll('.si,.sb').forEach(b=>{b.disabled=!known;});
    el.querySelectorAll('.si').forEach(inp=>{
      const k=inp.dataset.k, team=(k==='h'||k==='ph')?tt[0]:tt[1];
      inp.setAttribute('aria-label',(k.charAt(0)==='p'?'Entscheidung ':'Tore ')+(team!==null?name(team):''));
    });
    let w=null;
    if(g.phase==='ko') w=c.ko[g.id].winner;
    else if(x!==null&&y!==null&&x!==y) w=x>y?g.h:g.a;
    [0,1].forEach(k=>{
      nm[k].classList.toggle('win',w!==null&&w===tt[k]);
      nm[k].classList.toggle('lose',w!==null&&w!==tt[k]);
    });
    el.classList.toggle('done',c.done[i]);
    el.classList.toggle('next',c.nextSet.has(i));
    el.querySelector('.flag').textContent=c.nextSet.has(i)?'Jetzt dran':'';
    const d=el.querySelector('.deci'); if(d) d.hidden=!c.ko[g.id].draw;
    const ref=el.querySelector('.ref');
    if(!st.refs||st.teamCount<3) ref.textContent='';
    else ref.textContent=c.refs[i]!==null?'Schiri: '+name(c.refs[i]):(known?'':'Schiri steht noch nicht fest');
  });
}

function renderOverview(){
  const c=compute(), st=S.settings, T=times(st,S.games);
  const label=(i,k)=>{const g=S.games[i], t=c.teamsOf[i][k]; return t!==null?esc(name(t)):`<span class="ph">${esc(srcLabel(k?g.as:g.hs,st))}</span>`;};
  const tagOf=g=>g.phase==='ko'?g.label:(c.m.groups>1?'Gruppe '+LETTERS[g.g]:'');
  let h='<div class="ov">';
  if(c.next===-1){
    h+=podiumHTML(c,true)||'';
  }else{
    const F=fieldsOf(st), idx=[...c.nextSet].sort((x,y)=>x-y), i=idx[0], sl=S.games[i].slot;
    const refLine=k=>c.refs[k]!==null?`<p class="ov-ref">Schiri: ${esc(name(c.refs[k]))}</p>`:'';
    if(idx.length===1){
      const g=S.games[i], tag=tagOf(g);
      h+=`<section class="ov-now" style="--gc:${gcol(g)}"><p class="ov-k">Jetzt dran<span>${fmt(T[i])} Uhr, Spiel ${i+1}${F>1?', Feld '+(g.f+1):''}${tag?', '+esc(tag):''}</span></p><div class="ov-match"><span>${label(i,0)}</span><span class="vs">gegen</span><span>${label(i,1)}</span></div>${refLine(i)}</section>`;
    }else{
      h+=`<section class="ov-now ov-multi" style="--gc:var(--ink)"><p class="ov-k">Jetzt dran<span>${fmt(T[i])} Uhr</span></p>`+idx.map(k=>{
        const g=S.games[k], tg=tagOf(g);
        return `<div class="ov-g" style="--gc:${gcol(g)}"><p class="ov-gk">Feld ${g.f+1}${tg?' · '+esc(tg):''}</p><div class="ov-match"><span>${label(k,0)}</span><span class="vs">gegen</span><span>${label(k,1)}</span></div>${refLine(k)}</div>`;
      }).join('')+'</section>';
    }
    const groups=[]; S.games.forEach((g2,k)=>{if(g2.slot>sl){let e=groups.find(x=>x.slot===g2.slot); if(!e){e={slot:g2.slot,list:[]}; groups.push(e);} e.list.push(k);}});
    const nx=groups.slice(0,4);
    if(nx.length){
      h+='<section class="ov-list"><h2>Danach</h2>'+nx.map(sg=>`<div class="ovr"><span class="t">${fmt(T[sg.list[0]])}</span><div class="ovc">${sg.list.map(k=>{
        const g2=S.games[k], tg=tagOf(g2);
        return `<div class="ovg" style="--gc:${gcol(g2)}"><span>${label(k,0)} gegen ${label(k,1)}${tg?`<span class="g">${esc(tg)}</span>`:''}${F>1?`<span class="g ftg">Feld ${g2.f+1}</span>`:''}</span>${c.refs[k]!==null?`<span class="s">Schiri: ${esc(name(c.refs[k]))}</span>`:''}</div>`;
      }).join('')}</div></div>`).join('')+'</section>';
    }
    h+=podiumHTML(c,false);
  }
  h+=legendHTML(c)+'<div class="tables">'+c.rank.map((l,g)=>tableHTML(l,g,c,true)).join('')+'</div>';
  if(c.m.ko) h+=koHTML(c);
  $('#app').innerHTML=h+'</div>';
}

/* ---------- Einrichten ---------- */
function structKey(d){return JSON.stringify([+d.teamCount,d.mode,modeOf(d.mode).groups>1?d.groupOf:[],!!d.hinRueck,fieldsOf(d)]);}
const startNoteHTML=d=>d.startAuto?'<p class="help">Aktuelle Uhrzeit, wird beim Erstellen übernommen.</p>':'<button type="button" class="btn ghost" data-act="start-now">Auf aktuelle Zeit setzen</button>';
function hasResults(){return !!S&&Object.values(S.results).some(r=>r&&(num(r.h)!==null||num(r.a)!==null));}
function validate(d){
  const m=modeOf(d.mode), e=[];
  if(d.teamCount<m.min) e.push(`Dieser Modus braucht mindestens ${m.min} Teams.`);
  else if(m.groups>1) for(let g=0;g<m.groups;g++) if(d.groupOf.filter(x=>x===g).length<2) e.push(`Gruppe ${LETTERS[g]} braucht mindestens 2 Teams.`);
  if(toMin(d.start)===null) e.push('Trage eine Startzeit ein.');
  const raw=String(d.dur===undefined||d.dur===null?'':d.dur).trim();
  if(raw!==''&&!(+raw>0)) e.push('Die Spieldauer muss mindestens 1 Minute betragen.');
  else if(raw===''){
    if(toMin(d.end)===null) e.push('Trage eine Spieldauer oder ein Stundenende ein.');
    else if(!e.length){
      const games=buildGames(d);
      if(durOf(d,games).dur===null) e.push(`Bis zum Stundenende reicht die Zeit nicht für ${games.length} Spiele. Wähle einen anderen Modus, verringere die Wechselzeit oder trage eine Spieldauer ein.`);
    }
  }
  return e;
}
function renderSetup(){
  if(!draft){
    draft=S?clone(S.settings):defaultsDraft();
    if(draft.fields===undefined) draft.fields=1;
    if(S) draft.startAuto=false;
  }
  const d=draft, m=modeOf(d.mode);
  let h='<div class="setup">';
  h+=`<section class="card"><h2>Turnier</h2>
    <label class="fld"><span>Name (optional)</span><input type="text" data-f="name" value="${esc(d.name)}" placeholder="z. B. Fußballturnier 7b"></label>
    <div class="fld"><span id="lbl-count">Anzahl Teams</span><div class="count" role="group" aria-labelledby="lbl-count"><button type="button" class="sb" data-cnt="-1" aria-label="Ein Team weniger">−</button><output>${d.teamCount}</output><button type="button" class="sb" data-cnt="1" aria-label="Ein Team mehr">+</button></div></div>
    <div class="fld"><span id="lbl-fld">Spielfelder (Hallen)</span><div class="count" role="group" aria-labelledby="lbl-fld"><button type="button" class="sb" data-fld="-1" aria-label="Ein Spielfeld weniger">−</button><output>${fieldsOf(d)}</output><button type="button" class="sb" data-fld="1" aria-label="Ein Spielfeld mehr">+</button></div><p class="help">Bei mehreren Feldern laufen Spiele gleichzeitig. Ein Team spielt nie auf zwei Feldern zugleich.</p></div>
  </section>`;
  h+=`<section class="card"><h2>Modus</h2><div class="modes">${MODES.map(x=>{
      const dis=d.teamCount<x.min;
      return `<label class="mode${d.mode===x.id?' on':''}${dis?' dis':''}"><input type="radio" name="mode" value="${x.id}"${d.mode===x.id?' checked':''}${dis?' disabled':''}><span class="mn">${x.name}</span><span class="md">${dis?`Ab ${x.min} Teams möglich.`:x.desc}</span></label>`;
    }).join('')}</div>
    <label class="chk"><input type="checkbox" data-f="hinRueck"${d.hinRueck?' checked':''}><span>Hin- und Rückrunde${m.ko||m.groups>1?' in der Vorrunde':''}</span></label>
  </section>`;
  h+=`<section class="card"><h2>Teams</h2>${m.groups>1?'<p class="help">Die Gruppen sind der Reihe nach vorbelegt. Mit A, B oder C lässt sich ein Team umsetzen.</p>':''}<div class="teams">${d.teams.map((t,i)=>`<div class="trow"><span class="tno">${i+1}</span><input type="text" data-team="${i}" value="${esc(t)}" placeholder="Team ${i+1}" aria-label="Name von Team ${i+1}">${m.groups>1?`<div class="gsel" role="group" aria-label="Gruppe für Team ${i+1}">${[...Array(m.groups)].map((_,g)=>`<button type="button" class="gb${d.groupOf[i]===g?' on':''}" style="--gc:var(--g${g})" data-grp="${g}" data-ti="${i}" aria-pressed="${d.groupOf[i]===g}">${LETTERS[g]}</button>`).join('')}</div>`:''}</div>`).join('')}</div><p class="gcount" id="gcount"></p></section>`;
  h+=`<section class="card"><h2>Zeitplan</h2><div class="grid4">
    <div class="fld"><label class="fld" style="margin:0"><span>Beginn</span><input type="time" data-f="start" value="${esc(d.start)}"></label><div class="startnote" id="startNote">${startNoteHTML(d)}</div></div>
    <label class="fld"><span>Spieldauer in Minuten</span><input type="number" min="1" max="60" inputmode="numeric" data-f="dur" value="${esc(d.dur)}" placeholder="automatisch"></label>
    <label class="fld"><span>Wechselzeit in Minuten</span><input type="number" min="0" max="30" inputmode="numeric" data-f="change" value="${esc(d.change)}"></label>
    ${m.ko?`<label class="fld"><span>Pause vor der Endrunde</span><input type="number" min="0" max="60" inputmode="numeric" data-f="pause" value="${esc(d.pause)}"></label>`:''}
    <label class="fld"><span>Stundenende (optional)</span><input type="time" data-f="end" value="${esc(d.end)}"></label>
  </div><p class="help">Bleibt die Spieldauer leer, wird sie aus Beginn und Stundenende berechnet.</p></section>`;
  h+=`<section class="card"><h2>Wertung und Schiris</h2>
    <div class="fld"><span>Punkte für einen Sieg</span><div class="seg">${[3,2].map(p=>`<button type="button" class="segb${+d.winPts===p?' on':''}" data-pts="${p}" aria-pressed="${+d.winPts===p}">${p} Punkte</button>`).join('')}</div></div>
    <p class="help">Ein Unentschieden gibt 1 Punkt. Bei Gleichstand zählen nacheinander: Punkte, Tordifferenz, mehr erzielte Tore, direkter Vergleich, Los.${m.id==='g3_ko'?' Der beste Zweite wird nach Punkten pro Spiel ermittelt, damit ungleich große Gruppen fair verglichen werden.':''}</p>
    <label class="chk"><input type="checkbox" data-f="refs"${d.refs?' checked':''}><span>Spielfreie Teams als Schiri einteilen</span></label>
  </section>`;
  h+='<section class="card sum" id="summary"></section></div>';
  $('#app').innerHTML=h;
  refreshSummary();
}
function refreshSummary(){
  const d=draft, m=modeOf(d.mode), el=$('#summary'); if(!el) return;
  const gc=$('#gcount');
  if(gc) gc.textContent=m.groups>1?[...Array(m.groups)].map((_,g)=>`Gruppe ${LETTERS[g]}: ${d.groupOf.filter(x=>x===g).length} Teams`).join(', '):'';
  const errs=validate(d);
  let h='';
  if(errs.length) h+=`<p class="err">${errs.join(' ')}</p>`;
  else{
    const games=buildGames(d), ko=games.filter(g=>g.phase==='ko').length, end=endTime(d,games), lim=toMin(d.end);
    const du=durOf(d,games);
    const F=fieldsOf(d), nsl=slotCount(games);
    h+=`<p class="sum-main"><strong>${games.length} Spiele</strong>${F>1?` auf ${F} Spielfeldern in ${nsl} Zeitfenstern`:''}${ko?`, davon ${ko} in der Endrunde`:''}. ${du.auto?`Spieldauer automatisch berechnet: <strong>${du.dur} min</strong> pro Spiel. `:''}Voraussichtliches Ende: <strong>${fmt(end)} Uhr</strong>.</p>`;
    if(d.refs&&F>1&&d.teamCount<3*F) h+=`<p class="help">Bei ${F} Feldern und ${d.teamCount} Teams steht nicht für jedes Spiel ein spielfreies Team als Schiri bereit.</p>`;
    if(du.auto&&du.dur<4) h+=`<p class="warn">Das sind nur ${du.dur} ${du.dur===1?'Minute':'Minuten'} pro Spiel. Eventuell passt ein Modus mit weniger Spielen besser.</p>`;
    if(lim!==null){
      const diff=end-lim;
      h+=diff>0?`<p class="warn">Das sind ${diff} ${diff===1?'Minute':'Minuten'} zu viel. Spieldauer oder Wechselzeit kürzen oder einen anderen Modus wählen.</p>`:`<p class="ok">Passt, ${-diff} ${diff===-1?'Minute':'Minuten'} Puffer bis zum Stundenende.</p>`;
    }
  }
  const structural=!!S&&structKey(d)!==structKey(S.settings);
  if(!S){
    h+=`<div class="btns"><button type="button" class="btn primary" data-act="create"${errs.length?' disabled':''}>Turnier erstellen</button></div>`;
  }else if(pendingConfirm==='rebuild'){
    h+=`<p class="warn">Mit diesen Änderungen wird der Spielplan neu erstellt. Alle eingetragenen Ergebnisse werden gelöscht.</p><div class="btns"><button type="button" class="btn danger" data-act="rebuild-yes">Neu erstellen und Ergebnisse löschen</button><button type="button" class="btn ghost" data-act="cancel">Abbrechen</button></div>`;
  }else if(pendingConfirm==='new'){
    h+=`<p class="warn">Das aktuelle Turnier mit allen Ergebnissen wird gelöscht.</p><div class="btns"><button type="button" class="btn danger" data-act="new-yes">Turnier löschen und neu anlegen</button><button type="button" class="btn ghost" data-act="cancel">Abbrechen</button></div>`;
  }else{
    if(structural) h+='<p class="help">Teams, Gruppen, Modus oder Spielfelder wurden geändert. Der Spielplan wird dann neu erstellt.</p>';
    h+=`<div class="btns"><button type="button" class="btn primary" data-act="apply"${errs.length?' disabled':''}>Änderungen übernehmen</button><button type="button" class="btn ghost" data-act="new">Neues Turnier anlegen</button></div>`;
  }
  el.innerHTML=h;
}
function goPlan(){draft=null; pendingConfirm=null; view='plan'; render(); window.scrollTo(0,0);}
function act(a){
  if(a==='create'){
    S={v:1,settings:finalize(draft),games:buildGames(draft),results:{},lots:makeLots(draft.teamCount)};
    save(); goPlan();
  }else if(a==='apply'){
    const structural=structKey(draft)!==structKey(S.settings);
    if(structural&&hasResults()){pendingConfirm='rebuild'; refreshSummary(); return;}
    if(structural){S.games=buildGames(draft); S.results={}; S.lots=makeLots(draft.teamCount);}
    S.settings=finalize(draft); save(); goPlan();
  }else if(a==='rebuild-yes'){
    S.settings=finalize(draft); S.games=buildGames(draft); S.results={}; S.lots=makeLots(draft.teamCount);
    save(); goPlan();
  }else if(a==='new'){pendingConfirm='new'; refreshSummary();}
  else if(a==='new-yes'){
    S=null; try{localStorage.removeItem(KEY);}catch(e){}
    draft=defaultsDraft(); pendingConfirm=null; view='setup'; render(); window.scrollTo(0,0);
  }else if(a==='start-now'){
    draft.startAuto=true; draft.start=nowExact();
    const el=document.querySelector('[data-f="start"]'); if(el) el.value=draft.start;
    const nt=$('#startNote'); if(nt) nt.innerHTML=startNoteHTML(draft);
    refreshSummary();
  }else if(a==='cancel'){pendingConfirm=null; refreshSummary();}
}

/* ---------- Stoppuhr ---------- */
// Läuft rückwärts von der Spieldauer, danach vorwärts als Nachspielzeit (+m:ss).
// Zeit basiert auf Date.now() und wird gespeichert, damit sie ein Neuladen übersteht.
const SW_KEY='turnierplaner-sw';
let sw=swLoad(), swTimer=null, swAudio=null, swLock=null, swOpen=false;
function swLoad(){
  try{
    const o=JSON.parse(localStorage.getItem(SW_KEY)||'null')||{};
    return {acc:+o.acc||0, t0:typeof o.t0==='number'?o.t0:null, fired:!!o.fired, sound:o.sound!==false, dur:(+o.dur>=1?Math.min(180,Math.round(+o.dur)):null)};
  }catch(e){return {acc:0,t0:null,fired:false,sound:true,dur:null};}
}
function swSave(){try{localStorage.setItem(SW_KEY,JSON.stringify(sw));}catch(e){}}
const swElapsed=()=>sw.acc+(sw.t0===null?0:Date.now()-sw.t0);
const swAutoMin=()=>S?(durOf(S.settings,S.games).dur||0):0;
const swMin=()=>sw.dur!==null?sw.dur:swAutoMin();
const swTarget=()=>swMin()*60000;
const swFmt=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function swPaint(){
  const box=$('#sw'); if(!box) return;
  box.hidden=!(S&&view==='plan');
  if(box.hidden) return;
  const target=swTarget(), ms=swElapsed();
  let txt, over=false;
  if(target>0){
    if(ms<target) txt=swFmt(Math.ceil((target-ms)/1000));
    else{over=true; const o=Math.floor((ms-target)/1000); txt=o?'+'+swFmt(o):'0:00';}
  }else txt=swFmt(Math.floor(ms/1000));
  const t=$('#swTime'); if(t.textContent!==txt) t.textContent=txt;
  t.classList.toggle('over',over);
  const idle=sw.t0===null&&sw.acc===0;
  $('#swGo').textContent=sw.t0!==null?'Pause':(idle?'Start':'Weiter');
  $('#swReset').disabled=idle||sw.t0!==null;
  $('#swSnd').textContent=sw.sound?'🔊 Ton an':'🔇 Ton aus';
  $('#swSet').hidden=!swOpen;
  const cfg=$('#swCfg'); cfg.classList.toggle('on',swOpen); cfg.setAttribute('aria-expanded',String(swOpen));
  const inp=$('#swDur'); if(document.activeElement!==inp) inp.value=swMin()||'';
  const std=$('#swStd'); std.hidden=sw.dur===null; std.textContent='Standard ('+swAutoMin()+' min)';
}
function swTick(){
  const target=swTarget();
  if(target>0&&!sw.fired&&swElapsed()>=target){sw.fired=true; swSave(); swAlarm();}
  swPaint();
}
function swLoop(){
  if(swTimer){clearInterval(swTimer); swTimer=null;}
  if(sw.t0!==null) swTimer=setInterval(swTick,200);
  swWake(sw.t0!==null);
}
function swToggle(){
  if(sw.t0===null){swUnlock(); sw.t0=Date.now();}
  else{sw.acc+=Date.now()-sw.t0; sw.t0=null;}
  swSave(); swLoop(); swTick();
}
function swSetDur(m){
  sw.dur=m===null?null:Math.max(1,Math.min(180,Math.round(m)));
  const t=swTarget(); sw.fired=t>0&&swElapsed()>=t;
  swSave(); swPaint();
}
function swReset(){sw.acc=0; sw.t0=null; sw.fired=false; swSave(); swLoop(); swPaint();}
function swUnlock(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
    if(!swAudio) swAudio=new AC();
    if(swAudio.state==='suspended') swAudio.resume();
  }catch(e){}
}
function swAlarm(){
  try{if(navigator.vibrate) navigator.vibrate([400,150,400,150,900]);}catch(e){}
  if(!sw.sound||!swAudio) return;
  try{
    const t=swAudio.currentTime;
    [[0,.35],[.5,.35],[1,1]].forEach(([d,len])=>{
      const o=swAudio.createOscillator(), g=swAudio.createGain();
      o.type='square'; o.frequency.value=880;
      g.gain.setValueAtTime(.0001,t+d);
      g.gain.exponentialRampToValueAtTime(.3,t+d+.02);
      g.gain.setValueAtTime(.3,t+d+len-.05);
      g.gain.exponentialRampToValueAtTime(.0001,t+d+len);
      o.connect(g); g.connect(swAudio.destination);
      o.start(t+d); o.stop(t+d+len+.02);
    });
  }catch(e){}
}
// Bildschirm wach halten, solange die Uhr läuft
async function swWake(on){
  try{
    if(on&&!swLock&&navigator.wakeLock){
      swLock=await navigator.wakeLock.request('screen');
      swLock.addEventListener('release',()=>{swLock=null;});
    }else if(!on&&swLock){const l=swLock; swLock=null; await l.release();}
  }catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(!document.hidden&&sw.t0!==null){swWake(true); swTick();}});

/* ---------- Ereignisse ---------- */
function step(id,k,dlt){
  const r=S.results[id]||(S.results[id]={});
  const other={h:'a',a:'h',ph:'pa',pa:'ph'}[k];
  let v=num(r[k]);
  v=v===null?(dlt>0?1:0):Math.max(0,Math.min(99,v+dlt));
  r[k]=v; if(num(r[other])===null) r[other]=0;
  const a=document.getElementById(`in-${id}-${k}`), b=document.getElementById(`in-${id}-${other}`);
  if(a) a.value=v; if(b) b.value=r[other];
  save(); refreshPlan();
}
function init(){
  $('#tabs').addEventListener('click',e=>{
    const b=e.target.closest('[data-view]'); if(!b) return;
    view=b.dataset.view;
    if(view!=='setup'){draft=null;} pendingConfirm=null;
    render(); window.scrollTo(0,0);
  });
  const app=$('#app');
  app.addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b||b.disabled) return;
    if(b.dataset.step){step(b.dataset.id,b.dataset.k,+b.dataset.step); return;}
    if(b.id==='jump'){
      const n=document.querySelector('.game.next');
      if(n) n.scrollIntoView({behavior:reduceMotion()?'auto':'smooth',block:'center'});
      return;
    }
    if(b.dataset.fld){
      const cur=fieldsOf(draft), n=Math.max(1,Math.min(4,Math.floor(draft.teamCount/2),cur+(+b.dataset.fld)));
      if(n===cur) return;
      draft.fields=n; pendingConfirm=null; renderSetup(); return;
    }
    if(b.dataset.cnt){
      const n=Math.max(2,Math.min(16,draft.teamCount+(+b.dataset.cnt)));
      if(n===draft.teamCount) return;
      draft.teamCount=n; draft.fields=fieldsOf(draft);
      while(draft.teams.length<n) draft.teams.push('');
      draft.teams.length=n;
      draft.groupOf=defaultGroups(n,modeOf(draft.mode).groups);
      pendingConfirm=null; renderSetup(); return;
    }
    if(b.dataset.grp!==undefined){
      const i=+b.dataset.ti, g=+b.dataset.grp; draft.groupOf[i]=g;
      b.parentElement.querySelectorAll('.gb').forEach(x=>{const on=+x.dataset.grp===g; x.classList.toggle('on',on); x.setAttribute('aria-pressed',String(on));});
      pendingConfirm=null; refreshSummary(); return;
    }
    if(b.dataset.pts){
      draft.winPts=+b.dataset.pts;
      b.parentElement.querySelectorAll('.segb').forEach(x=>{const on=x===b; x.classList.toggle('on',on); x.setAttribute('aria-pressed',String(on));});
      refreshSummary(); return;
    }
    if(b.dataset.act) act(b.dataset.act);
  });
  app.addEventListener('input',e=>{
    const t=e.target;
    if(t.classList.contains('si')){
      const clean=t.value.replace(/\D/g,'').slice(0,2);
      if(clean!==t.value) t.value=clean;
      const r=S.results[t.dataset.id]||(S.results[t.dataset.id]={});
      r[t.dataset.k]=clean===''?null:+clean;
      save(); refreshPlan(); return;
    }
    if(t.dataset.team!==undefined){draft.teams[+t.dataset.team]=t.value; return;}
    if(t.dataset.f&&t.type!=='checkbox'){
      draft[t.dataset.f]=t.value; pendingConfirm=null;
      if(t.dataset.f==='start'){draft.startAuto=false; const nt=$('#startNote'); if(nt) nt.innerHTML=startNoteHTML(draft);}
      refreshSummary();
    }
  });
  app.addEventListener('change',e=>{
    const t=e.target;
    if(t.type==='checkbox'&&t.dataset.f){draft[t.dataset.f]=t.checked; pendingConfirm=null; refreshSummary(); return;}
    if(t.name==='mode'){
      const old=modeOf(draft.mode), nw=modeOf(t.value);
      draft.mode=t.value;
      if(old.groups!==nw.groups) draft.groupOf=defaultGroups(draft.teamCount,nw.groups);
      pendingConfirm=null; renderSetup();
    }
  });
  $('#sw').addEventListener('click',e=>{
    const b=e.target.closest('button'); if(!b||b.disabled) return;
    if(b.id==='swGo') swToggle();
    else if(b.id==='swReset') swReset();
    else if(b.id==='swSnd'){sw.sound=!sw.sound; if(sw.sound) swUnlock(); swSave(); swPaint();}
    else if(b.id==='swCfg'){swOpen=!swOpen; swPaint();}
    else if(b.id==='swMinus') swSetDur((swMin()||1)-1);
    else if(b.id==='swPlus') swSetDur(swMin()+1);
    else if(b.id==='swStd') swSetDur(null);
  });
  $('#sw').addEventListener('input',e=>{
    if(e.target.id!=='swDur') return;
    const clean=e.target.value.replace(/\D/g,'').slice(0,3);
    if(clean!==e.target.value) e.target.value=clean;
    const m=parseInt(clean,10); if(m>=1) swSetDur(m);
  });
  $('#sw').addEventListener('focusin',e=>{if(e.target.id==='swDur') setTimeout(()=>{try{e.target.select();}catch(_){}},0);});
  $('#swDur').addEventListener('blur',()=>swPaint());
  swLoop();
  app.addEventListener('focusin',e=>{if(e.target.classList.contains('si')) setTimeout(()=>{try{e.target.select();}catch(_){}} ,0);});
  // Beginn "aktuelle Zeit" bleibt im Einrichten-Dialog aktuell, bis er von Hand geändert wird
  setInterval(()=>{
    if(view!=='setup'||!draft||!draft.startAuto) return;
    const now=nowExact(); if(now===draft.start) return;
    draft.start=now;
    const el=document.querySelector('[data-f="start"]'); if(el&&document.activeElement!==el) el.value=now;
    refreshSummary();
  },10000);
  render();
}
globalThis.__TP={buildGames,compute,setState:s=>{S=s;},podium};
if(typeof document!=='undefined'&&document.getElementById('app')) init();
})();
</script>
