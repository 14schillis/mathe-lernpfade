              {id:"p",t:"die Anzahl der Pausentage"},{id:"s",t:"die Gesamtstrecke in km"}],
        rows:[
          {html:"<i>x</i>",ans:"x"},
          {html:"320",ans:"s"},
          {html:"320 : <i>x</i>",ans:"fahr",no:{all:"Die Pausentage fehlen hier noch – "+mfs("320 : <i>x</i>")+" zählt nur die Tage, an denen gefahren wird."}},
          {html:"+ 2",ans:"p"},
          {html:"320 : <i>x</i> + 2",ans:"all",no:{fahr:"Hier sind die 2 Pausentage schon dazugezählt."}}
        ]},done);
    }},
    {title:"Hohlkammerprofil",sum:mfs("5<i>x</i> + (<i>x</i> − 1)")+": Grundelemente plus Verbindungsstäbe.",run:function(h,done){
      ctx(h,{fig:'<div style="max-width:300px;margin:0 auto">'+profileSVG(3,"plain")+'</div><div class="figcap">Bauschritt 3</div>',
        text:"Lena zerlegt das Profil in "+IF+"e Grundelemente aus je 5 Stäben. Sie berechnet die Anzahl der Stäbe mit:",term:'<i>S</i>(<i>x</i>) = 5<i>x</i> + (<i>x</i> − 1)',
        pool:[{id:"one",t:"die Stäbe eines einzelnen "+IF+"en Grundelements"},{id:"con",t:"die senkrechten Verbindungsstäbe zwischen den Grundelementen"},
              {id:"n",t:"die Nummer des Bauschritts (= Anzahl der Grundelemente)"},{id:"all",t:"die Anzahl aller Stäbe in Bauschritt "+X()},{id:"I",t:"die Stäbe aller "+IF+"en Grundelemente zusammen"}],
        rows:[
          {html:"<i>x</i>",ans:"n"},
          {html:"5<i>x</i>",ans:"I",no:{one:"Ein einzelnes Grundelement hat 5 Stäbe. 5"+X()+" zählt die Stäbe von "+X()+" Grundelementen."}},
          {html:"<i>x</i> − 1",ans:"con",no:{n:"Das wäre "+X()+". Zwischen "+X()+" Grundelementen gibt es eine Verbindung weniger."}},
          {html:"5<i>x</i> + (<i>x</i> − 1)",ans:"all"}

/* ---------------- C2 · Welches Modell passt? ---------------- */
defTask("C2","Welches Modell passt?","C3",function(body){
  var MODELS=[
    {id:"A",fn:mSepTri,unit:"Stäbe",ok:false,counts:[3,6,9],desc:"einzelne Dreiecke aus Stäben",
     no:"Modell A: 3, 6, 9 Stäbe. Es kommen zwar immer 3 dazu – aber das „+ 1“ fehlt."},
    {id:"B",fn:mTower,unit:"Steine",ok:true,counts:[4,7,10],desc:"Turm aus Steinen mit Dachstein",
     ex:"Jedes Stockwerk hat 3 Steine (blau) → "+mfs("3<i>x</i>")+". Der Dachstein (orange) kommt nur einmal vor → "+mfs("+ 1")+"."},
    {id:"C",fn:mSquares,unit:"Stäbe",ok:true,counts:[4,7,10],desc:"Quadratreihe aus Stäben",
     ex:"Der erste senkrechte Stab (orange) kommt einmal vor → "+mfs("+ 1")+". Jedes Quadrat bringt 3 neue Stäbe (blau) → "+mfs("3<i>x</i>")+"."},
    {id:"D",fn:mSepSquares,unit:"Stäbe",ok:false,counts:[4,8,12],desc:"einzelne Quadrate aus Stäben",
     no:"Modell D: Bauschritt 1 hat 4 Stäbe – das passt. Dann kommen aber jeweils 4 dazu: 8 statt 7."},
    {id:"E",fn:mStar,unit:"Steine",ok:true,counts:[4,7,10],desc:"Mittelstein mit drei Armen",
     ex:"Der Mittelstein (orange) kommt einmal vor → "+mfs("+ 1")+". Mit jedem Bauschritt wird jeder der 3 Arme um einen Stein länger (blau) → "+mfs("3<i>x</i>")+"."}
  ];
  var card=el("section","card"); body.appendChild(card);
  card.appendChild(el("p","lead","Welche Bausysteme passen zu diesem Term?"));
  card.appendChild(el("p","mblock",'<i>T</i>(<i>x</i>) = 3<i>x</i> + 1'));
  card.appendChild(el("p","","Gezeigt sind jeweils die Bauschritte 1, 2 und 3. <b>Es können mehrere Modelle passen.</b> Wähle alle passenden aus."));
  var grid=el("div","mgrid"); card.appendChild(grid);
  var sel={}, cards={}, locked=false;
  MODELS.forEach(function(M){
    var c=btn("","mcard");
    c.innerHTML='<div class="mh"><span>Modell '+M.id+'</span><span class="box" aria-hidden="true"></span></div>'+
      '<div class="msvg">'+seriesSVG(M.fn,false,"Modell "+M.id+": "+M.desc)+'</div><div class="md">'+M.desc+'</div><div class="md mcnt" hidden></div>';
    c.setAttribute("aria-pressed","false");
    c.onclick=function(){
      if(locked) return;
      sel[M.id]=!sel[M.id]; c.classList.toggle("sel",!!sel[M.id]); c.setAttribute("aria-pressed",sel[M.id]?"true":"false");
      c.querySelector(".box").textContent=sel[M.id]?"✓":"";
      c.classList.remove("good","bad");
    };
    grid.appendChild(c); cards[M.id]=c;
  });
  var row=el("div","btnrow"); card.appendChild(row);
  var chk=btn("Prüfen","btn"); row.appendChild(chk);
  var fb=el("div","fb"); card.appendChild(fb);
  var help=helpLadder(card,{levels:[
      {t:"Welche Anzahlen liefert der Term "+mfs("3<i>x</i> + 1")+" für die Bauschritte 1, 2 und 3?"},
      {t:"Zähle bei jedem Modell die Stäbe bzw. Steine in den Bauschritten 1, 2 und 3. Es reicht nicht, nur Bauschritt 1 zu prüfen."},
      {t:"Unter jedem Modell stehen jetzt die Anzahlen. Der Term liefert 4, 7, 10.",act:function(){
        MODELS.forEach(function(M){ var d=cards[M.id].querySelector(".mcnt"); d.hidden=false; d.innerHTML=M.unit+": <b>"+M.counts.join(" · ")+"</b>"; });
      }}
    ],onSolution:function(){
      MODELS.forEach(function(M){ sel[M.id]=M.ok; cards[M.id].classList.toggle("sel",M.ok); cards[M.id].querySelector(".box").textContent=M.ok?"✓":""; });
      showFb(fb,"sol",'<span class="soltag">Lösung angezeigt</span>Die Modelle B, C und E passen zu '+mfs("3<i>x</i> + 1")+'.');
      success(true);
    }});
  card.appendChild(fb);
  chk.onclick=function(){
    if(locked) return;
    var wrongSel=[], missing=0, any=false;
    MODELS.forEach(function(M){
      var c=cards[M.id]; c.classList.remove("good","bad");
      if(sel[M.id]){ any=true; if(M.ok) c.classList.add("good"); else { c.classList.add("bad"); wrongSel.push(M.no); } }
      else if(M.ok) missing++;
    });
    if(!any){ showFb(fb,"hint","Wähle mindestens ein Modell aus."); return; }
    if(!wrongSel.length&&!missing){ showFb(fb,"ok","<strong>Richtig.</strong> Die Modelle B, C und E passen – drei ganz verschiedene Bauwerke zu demselben Term."); success(false); return; }
    var msg="<strong>Noch nicht ganz.</strong> ";
    if(wrongSel.length) msg+=wrongSel.join(" ")+" ";
    if(missing) msg+=(wrongSel.length?"Außerdem gibt es ":"Die grün markierten Modelle passen. Es gibt aber ")+"noch mindestens ein weiteres passendes Modell.";
    showFb(fb,"hint",msg); help.nudge();
  };
  function success(viaSol){
    locked=true; chk.disabled=true; help.close();
    MODELS.forEach(function(M){ var c=cards[M.id]; c.disabled=true; c.classList.remove("bad"); if(M.ok) c.classList.add("good"); });
    var c2=el("section","card"); body.appendChild(c2);
    c2.appendChild(el("h3","","Wo steckt 3"+X()+", wo steckt + 1?"));
    analogStep(c2,'<p>'+ic("heft")+' Wähle eines der passenden Modelle und erkläre im Heft: Wo steckt in diesem Bauwerk '+mfs("3<i>x</i>")+' und wo '+mfs("+ 1")+'?</p><p>'+ic("team")+' Vergleicht eure Erklärungen.</p>',"Ich habe meine Erklärung notiert",function(){
      MODELS.forEach(function(M){
        if(!M.ok) return;
        cards[M.id].querySelector(".msvg").innerHTML=seriesSVG(M.fn,true,"Modell "+M.id+" farbig zerlegt");
      });
      var ex=el("div","heft");
      ex.innerHTML='<div class="h">Mögliche Deutungen (siehe Farben oben)</div>'+MODELS.filter(function(M){return M.ok;}).map(function(M){ return "<p><b>Modell "+M.id+":</b> "+M.ex+"</p>"; }).join("")+
        '<p>Zu einem Term können also <b>verschiedene</b> Bauwerke passen.</p>';
      c2.appendChild(ex);
      complete();
    });
    setTimeout(function(){ softScroll(c2); },60);
    void viaSol;
  }
},MC_);

}
