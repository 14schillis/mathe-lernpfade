<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Summen umformen – Übungswerkstatt</title>
<style>
:root{
  --bg:#f1f5f9; --card:#fff; --ink:#0f172a; --soft:#64748b; --line:#e2e8f0;
  --blue:#2563eb; --blue-soft:#dbeafe; --blue-dark:#1e3a8a;
  --g:#16a34a; --gs:#dcfce7; --gd:#166534;
  --y:#d97706; --ys:#fef3c7; --yd:#92400e;
  --r:#dc2626; --rs:#fee2e2; --rd:#991b1b;
  --mf:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,"Times New Roman",serif;
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--ink);
  font:16px/1.45 system-ui,"Segoe UI",Roboto,-apple-system,"Helvetica Neue",Arial,sans-serif;
  display:flex;flex-direction:column;height:100vh;height:100dvh;-webkit-text-size-adjust:100%;
  padding-bottom:env(safe-area-inset-bottom)}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid #93b4f5;outline-offset:2px}

/* Kopf */
header{flex:0 0 auto;display:flex;align-items:center;gap:6px 18px;flex-wrap:wrap;
  padding:calc(env(safe-area-inset-top) + 8px) clamp(10px,2vw,22px) 8px}
h1{font-size:1.2rem;color:var(--blue-dark);line-height:1.2}
h1 small{display:block;font-size:.78rem;font-weight:500;color:var(--soft)}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tab{min-height:44px;padding:4px 16px;border-radius:999px;background:#fff;border:2px solid var(--line);font-weight:650;font-size:.95rem}
.tab .n{font-weight:500;color:var(--soft);margin-left:.4em;font-size:.85rem}
.tab[aria-current="true"]{color:#fff;border-color:transparent}
.tab[aria-current="true"] .n{color:#ffffffcc}
.tab.ha[aria-current="true"]{background:var(--blue)}
.tab.l[aria-current="true"]{background:var(--g)}
.tab.m[aria-current="true"]{background:var(--y)}
.tab.s[aria-current="true"]{background:var(--r)}

/* Layout */
main{flex:1 1 auto;min-height:0;display:grid;grid-template-columns:minmax(200px,250px) minmax(0,1fr);
  gap:12px;padding:0 clamp(10px,2vw,22px) 10px;width:100%;max-width:1360px;margin:0 auto}
@media (orientation:portrait){
  main{grid-template-columns:minmax(0,1fr);grid-template-rows:auto minmax(0,1fr)}
}
.side{min-height:0;display:flex;flex-direction:column;gap:8px}
.info{font-size:.88rem;color:var(--soft)}
.done-banner{background:var(--gs);color:var(--gd);border-radius:10px;padding:6px 10px;font-weight:650;font-size:.9rem}
.list{display:flex;flex-direction:column;gap:6px;overflow-y:auto;min-height:0;padding-bottom:4px}
@media (orientation:portrait){
  .list{flex-direction:row;flex-wrap:wrap;overflow:visible}
}
.li{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:44px;padding:6px 12px;
  background:#fff;border:2px solid var(--line);border-left-width:6px;border-radius:10px;text-align:left;font-weight:600;font-size:.93rem}
.li.ha{border-left-color:var(--blue)}.li.l{border-left-color:var(--g)}.li.m{border-left-color:var(--y)}.li.s{border-left-color:var(--r)}
.li.sel{background:var(--blue-soft);border-color:var(--blue);border-left-width:6px}
.li .ck{display:none;color:var(--g);font-weight:800}
.li.done .ck{display:inline}
@media (orientation:portrait){.li{flex:0 0 auto}}

.right{min-height:0;display:flex;flex-direction:column;gap:8px}
.cardwrap{flex:1 1 auto;min-height:0;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;
  background:var(--card);border-radius:14px;box-shadow:0 2px 10px #0f172a1f;padding:14px 20px 16px}
.ch{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.lv{font-size:.78rem;font-weight:700;border-radius:999px;padding:2px 10px;letter-spacing:.03em}
.lv.ha{background:var(--blue-soft);color:var(--blue-dark)}.lv.l{background:var(--gs);color:var(--gd)}
.lv.m{background:var(--ys);color:var(--yd)}.lv.s{background:var(--rs);color:var(--rd)}
.lab{font-weight:700;font-size:1.05rem}
.instr{color:var(--soft);font-size:.92rem;margin-top:2px}
.mline{font-family:var(--mf);font-style:normal;white-space:nowrap;overflow:visible}
.mline i{font-style:italic}
.mline sup{font-size:.62em;vertical-align:.55em;line-height:0}
.mline .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;margin:0 .1em;line-height:1.15;font-size:.82em}
.mline .fr>span:first-child{border-bottom:.07em solid currentColor;padding:0 .18em}
.mline .fr>span:last-child{padding:0 .18em}
.big{font-size:clamp(1.7rem,3.6vw,2.6rem);margin:12px 0 8px;line-height:1.5;background:var(--bg);border-radius:12px;padding:10px 16px;text-align:center}
.stage{display:flex;justify-content:center;align-items:center;flex-wrap:nowrap;min-height:2.2em}
.tk{flex:none;display:inline-block;white-space:nowrap;border-radius:.2em;padding:0 .02em}
.tk.o.bi{margin:0 .26em}
.tk.o.un{margin-right:.04em}
.tk.chg{animation:chgk 2.2s}
@keyframes chgk{0%,60%{background:#fde047;color:#b45309}}
.tk.gh{position:fixed;pointer-events:none;margin:0;z-index:50}
.orig{margin-top:10px;font-size:.78rem;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--soft)}
.orig .mline{font-size:1.15rem;font-weight:400;letter-spacing:0;text-transform:none;color:#475569;margin-top:1px;display:block}
.tip{margin-top:10px;background:var(--ys);border-left:6px solid var(--y);border-radius:10px;padding:8px 14px;font-size:.98rem}
.tip b{color:var(--yd)}
.res{margin-top:12px;background:var(--gs);border-left:6px solid var(--g);border-radius:10px;padding:8px 14px}
.res small{display:block;font-size:.76rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--gd)}
.res .mline{font-size:clamp(1.4rem,2.8vw,2rem);margin-top:2px}
.res .alt{font-size:.9rem;color:var(--gd);margin-top:2px}
.res .alt .mline{display:inline;font-size:1.15em}
.steps{margin-top:14px;display:flex;flex-direction:column;gap:10px}
.stp{display:flex;gap:12px;align-items:flex-start}
.sn{flex:0 0 auto;width:34px;height:34px;border-radius:50%;background:var(--blue);color:#fff;display:grid;place-items:center;font-weight:700;margin-top:4px}
.sb{flex:1;min-width:0;border-left:3px solid var(--blue-soft);padding-left:12px}
.sb .mline{font-size:clamp(1.25rem,2.4vw,1.7rem);line-height:1.5}
.sb .mline+.mline{margin-top:2px}
.why{font-size:.95rem;color:#334155;margin-top:2px}
.why .fr{display:inline-flex;flex-direction:column;vertical-align:middle;text-align:center;font-size:.8em;line-height:1.1;margin:0 .1em;font-family:var(--mf)}
.why .fr>span:first-child{border-bottom:1px solid currentColor;padding:0 .15em}
.why .fr>span:last-child{padding:0 .15em}
.fade{animation:fade .35s ease-out}
.stp.wait{visibility:hidden}
@keyframes fade{from{opacity:0;transform:translateY(6px)}}
@media (prefers-reduced-motion:reduce){.fade,.tk.chg{animation:none}}

.bar{flex:0 0 auto;display:flex;gap:10px;flex-wrap:wrap;justify-content:flex-end}
.btn{min-height:52px;padding:0 22px;border-radius:14px;font-weight:700;font-size:1.02rem;background:#fff;color:var(--blue-dark);
  box-shadow:0 1px 5px #0f172a33}
.btn.pri{background:var(--blue);color:#fff}
.btn.ok{background:var(--g);color:#fff}
.btn:active{transform:scale(.97)}
.hint0{color:var(--soft);font-size:.92rem;margin-right:auto;align-self:center}
@media (max-width:719px){html,body{overflow:auto;height:auto}body{display:block;height:auto}main{display:block}.cardwrap{overflow:visible}}
</style>
</head>

    .replace(/\{(-?\d+)\/(\d+)\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>')
    .replace(/-/g,"\u2212");
}
function wm(s){
  return s.replace(/\{(-?\d+)\/(\d+)\}/g,'<span class="fr"><span>$1</span><span>$2</span></span>');
}

/* ---------- Zerlegung eines Terms in Bausteine ---------- */
function varpart(t){
  var u=t.replace(/\{[^}]*\}/g,"1"),pos=0;
  function seq(){
    var m={};
    while(pos<u.length&&u[pos]!==")"&&u[pos]!=="]"){
      var c=u[pos],f;
      if(c==="("||c==="["){pos++;f=seq();pos++}
      else if(/[a-z\u00f6]/.test(c)){f={};f[c]=1;pos++}
      else{pos++;continue}
      var e=1;
      if(u[pos]==="^"){e=parseInt(u[pos+1],10);pos+=2}
      for(var k in f)m[k]=(m[k]||0)+f[k]*e;
    }
    return m;
  }
  var mm=seq();
  return Object.keys(mm).sort().map(function(k){return k+"^"+mm[k]}).join("");
}
function matchClose(m,i){
  var d=0,j;
  for(j=i;j<m.length;j++){
    if(m[j]==="("||m[j]==="[")d++;
    else if(m[j]===")"||m[j]==="]"){d--;if(d===0)return j}
  }
  return m.length-1;
}
function nextCh(m,j){while(j<m.length&&m[j]===" ")j++;return j<m.length?m[j]:""}
function parse(m){
  var toks=[],terms=[],groups=[],stack=[],i=0,n=m.length,c,p,j;
  while(i<n){
    c=m[i];
    if(c===" "){i++;continue}
    p=toks.length?toks[toks.length-1]:null;
    if(c==="+"||c==="-"){toks.push({k:"o",s:c,un:(!p||(p.k==="b"&&p.open))});i++;continue}
    if(c==="("||c==="["){
      j=matchClose(m,i);
      var after=nextCh(m,j+1),ts=(!p||p.k==="o"||(p.k==="b"&&p.open));
      if(ts&&(after===""||"+-)]".indexOf(after)>=0)){
        var g={open:toks.length,close:-1,lead:(p&&p.k==="o")?toks.length-1:null,terms:[]};
        groups.push(g);stack.push(groups.length-1);
        toks.push({k:"b",s:c,open:true,g:groups.length-1});i++;continue;
      }
    }
    if(c===")"||c==="]"){
      var gi=stack.pop();groups[gi].close=toks.length;
      toks.push({k:"b",s:c,open:false,g:gi});i++;continue;
    }
    j=i;var d=0;
    while(j<n){
      var ch=m[j];
      if(ch==="{"){j=m.indexOf("}",j)+1;continue}
      if(ch==="("||ch==="["){d++}
      else if(ch===")"||ch==="]"){if(d===0)break;d--}
      else if((ch==="+"||ch==="-")&&d===0){break}
      j++;
    }
    var txt=m.slice(i,j).replace(/\s+$/,"");
    var own=(p&&p.k==="o")?toks.length-1:null;
    terms.push({tok:toks.length,key:txt,own:own,enc:stack.slice(),vp:varpart(txt)});
    toks.push({k:"t",s:txt});
    i=j;
  }
  terms.forEach(function(t,ti){
    var sg=(t.own!==null&&toks[t.own].s==="-")?-1:1;
    t.enc.forEach(function(g){groups[g].terms.push(ti);var l=groups[g].lead;if(l!==null&&toks[l].s==="-")sg=-sg});
    t.eff=sg;
  });
  return {toks:toks,terms:terms,groups:groups};
}
var _pc={};
function parsed(str){return _pc[str]||(_pc[str]=parse(str))}
function stageHtml(P){
  var h="";

    else if(t.k==="b")h+='<span class="tk b" data-i="'+i+'">'+t.s+'</span>';
    else h+='<span class="tk t" data-i="'+i+'">'+fm(t.s)+'</span>';
  });
  return h;
}

/* Zuordnung der Bausteine zweier aufeinanderfolgender Zeilen */
function align(A,B){
  var plan=[],used={},tmA=[],tmB=[],gmA=[],gmB=[],takenA=[],srcOfB={},i;
  B.terms.forEach(function(bt,bi){
    for(var ai=0;ai<A.terms.length;ai++){
      var at=A.terms[ai];
      if(tmA[ai]===undefined&&at.key===bt.key&&at.eff===bt.eff){tmA[ai]=bi;tmB[bi]=ai;break}
    }
  });
  var cand=[];
  B.groups.forEach(function(bg,bi){
    A.groups.forEach(function(ag,ai){
      if(A.toks[ag.open].s!==B.toks[bg.open].s)return;
      var com=0;
      bg.terms.forEach(function(bt){var at=tmB[bt];if(at!==undefined&&ag.terms.indexOf(at)>=0)com++});
      if(com>0)cand.push({a:ai,b:bi,sc:com/(ag.terms.length+bg.terms.length-com)});
    });
  });
  cand.sort(function(x,y){return y.sc-x.sc});
  cand.forEach(function(c){if(gmA[c.a]===undefined&&gmB[c.b]===undefined){gmA[c.a]=c.b;gmB[c.b]=c.a}});
  B.groups.forEach(function(bg,bi){
    if(gmB[bi]!==undefined)return;
    for(var ai=0;ai<A.groups.length;ai++){
      if(gmA[ai]===undefined&&A.toks[A.groups[ai].open].s===B.toks[bg.open].s){gmA[ai]=bi;gmB[bi]=ai;break}
    }
  });

  B.terms.forEach(function(bt,bi){
    if(tmB[bi]!==undefined){plan[bt.tok]={mode:"move",src:[A.terms[tmB[bi]].tok]}}
  });
  var vps={};
  B.terms.forEach(function(bt,bi){if(tmB[bi]===undefined){(vps[bt.vp]=vps[bt.vp]||{a:[],b:[]}).b.push(bi)}});
  A.terms.forEach(function(at,ai){if(tmA[ai]===undefined&&vps[at.vp]){vps[at.vp].a.push(ai)}});
  Object.keys(vps).forEach(function(k){
    var g=vps[k];
    g.b.forEach(function(bi,idx){
      var src=[];
      if(g.a.length===g.b.length){src=[g.a[idx]]}
      else if(idx===0){src=g.a.slice()}
      srcOfB[bi]=src;
      plan[B.terms[bi].tok]={mode:src.length?"merge":"new",src:src.map(function(ai){return A.terms[ai].tok})};
    });
  });

  function opPlan(list,bs){
    if(!list.length)return {mode:"new",src:[]};
    if(list.length===1)return {mode:(A.toks[list[0]].s===bs?"move":"flip"),src:list};
    return {mode:"merge",src:list};
  }
  function firstTerm(g){return g.terms.length?Math.min.apply(null,g.terms):-1}
  B.terms.forEach(function(bt,bi){
    if(bt.own===null)return;
    var list=[];
    if(tmB[bi]!==undefined){
      var ai=tmB[bi],at=A.terms[ai];
      if(at.own!==null)list.push(at.own);
      for(var q=at.enc.length-1;q>=0;q--){
        var g=at.enc[q],ag=A.groups[g];
        if(gmA[g]===undefined&&ag.lead!==null&&firstTerm(ag)===ai)list.push(ag.lead);
      }
    } else if(srcOfB[bi]){
      srcOfB[bi].forEach(function(ai){var a=A.terms[ai];if(a.own!==null)list.push(a.own)});
    }
    plan[bt.own]=opPlan(list,B.toks[bt.own].s);
  });
  B.groups.forEach(function(bg,bi){
    var ai=gmB[bi];
    if(ai!==undefined){
      var ag=A.groups[ai];
      plan[bg.open]={mode:"move",src:[ag.open]};
      plan[bg.close]={mode:"move",src:[ag.close]};
      if(bg.lead!==null)plan[bg.lead]=opPlan(ag.lead!==null?[ag.lead]:[],B.toks[bg.lead].s);
    } else {
      plan[bg.open]={mode:"new",src:[]};
      plan[bg.close]={mode:"new",src:[]};
      if(bg.lead!==null)plan[bg.lead]={mode:"new",src:[]};
    }
  });
  for(i=0;i<B.toks.length;i++){
    if(!plan[i])plan[i]={mode:"new",src:[]};
    plan[i].src.forEach(function(a){used[a]=1});
  }
  var ghosts=[];
  for(i=0;i<A.toks.length;i++){if(!used[i])ghosts.push(i)}
  return {plan:plan,ghosts:ghosts};
}

var last=null,pending=null,revealT=null,fresh=false,backFlag=false;

function snapshot(el){
  var sp=el.children,r=[],h=[],c=[],i;
  for(i=0;i<sp.length;i++){r.push(sp[i].getBoundingClientRect());h.push(sp[i].innerHTML);c.push(sp[i].className)}
  return {rects:r,html:h,cls:c,fs:getComputedStyle(el).fontSize};
}
function mkGhost(snap,i){
  var o=snap.rects[i],g=document.createElement("span");
  g.className=snap.cls[i].replace(/\bchg\b/,"")+" gh mline";
  g.innerHTML=snap.html[i];
  g.style.cssText="left:"+o.left+"px;top:"+o.top+"px;font-size:"+snap.fs;
  document.body.appendChild(g);
  return g;
}
function animateStage(pd){
  if(reduce)return;
  var snap=pd.snap,A=pd.A,B=pd.B,al=align(A,B),st=document.getElementById("stage"),sp=st.children,i;
  for(i=0;i<B.toks.length;i++){
    var el=sp[i],pl=al.plan[i],r=el.getBoundingClientRect(),o;
    if(pl.mode==="move"||pl.mode==="flip"){
      o=snap.rects[pl.src[0]];
      var dx=o.left-r.left,dy=o.top-r.top;
      if(Math.abs(dx)+Math.abs(dy)>1)el.animate([{transform:"translate("+dx+"px,"+dy+"px)"},{transform:"none"}],{duration:700,delay:200,easing:"ease-in-out",fill:"backwards"});
      if(pl.mode==="flip"){
        el.classList.add("chg");
        el.animate([{transform:"rotateX(90deg) scale(1.4)",opacity:0},{transform:"none",opacity:1}],{duration:600,delay:500,fill:"backwards"});
      }
    } else if(pl.mode==="merge"){
      el.classList.add("chg");
      el.animate([{transform:"scale(.5)",opacity:0},{transform:"scale(1.2)",opacity:1,offset:.75},{transform:"none",opacity:1}],{duration:750,delay:350,fill:"backwards"});
      pl.src.forEach(function(a){
        var g=mkGhost(snap,a),q=snap.rects[a];
        var tx=r.left+r.width/2-q.left-q.width/2,ty=r.top+r.height/2-q.top-q.height/2;
        g.animate([{transform:"none",opacity:1},{transform:"translate("+tx+"px,"+ty+"px) scale(.4)",opacity:0}],{duration:800,delay:150,easing:"ease-in",fill:"forwards"}).onfinish=function(){g.remove()};
      });
    } else {
      if(B.toks[i].k==="t")el.classList.add("chg");
      el.animate([{opacity:0,transform:"scale(.6)"},{opacity:1,transform:"none"}],{duration:500,delay:350,fill:"backwards"});
    }
  }
  al.ghosts.forEach(function(a){
    var g=mkGhost(snap,a);
    g.animate([{opacity:1,transform:"none"},{opacity:0,transform:"scale(.5)"}],{duration:500,easing:"ease-in",fill:"forwards"}).onfinish=function(){g.remove()};
  });
}

  $("#info").textContent=tb.d;
  var d=all.filter(function(t){return S.done[t.id]}).length;
  $("#banner").innerHTML=(d===all.length)?'<div class="done-banner">✓ Alles bearbeitet. Probiere die nächste Stufe!</div>':"";
  var h="";
  all.forEach(function(t){
    h+='<button class="li '+t.tab+(t.id===S.cur?" sel":"")+(S.done[t.id]?" done":"")+'" data-act="pick" data-id="'+t.id+'"><span>'+t.lab+'</span><span class="ck">✓</span></button>';
  });
  $("#list").innerHTML=h;
}
function stageIndex(T,s){var k=-1,i;for(i=0;i<s.n;i++){if(T.st[i].x)k=i}return k}
function renderCard(){
  var T=byId(S.cur),s=ts(T.id),h="";
  var idx=stageIndex(T,s),str=(idx<0)?T.e:T.st[idx].m[0],P=parsed(str);
  var snap=null,old=document.getElementById("stage");
  var wasFresh=fresh,wasBack=backFlag;fresh=false;backFlag=false;
  if(revealT){clearTimeout(revealT);revealT=null}
  if(!wasBack&&old&&last&&last.id===T.id&&last.idx!==idx)snap=snapshot(old);
  var delayLast=!!snap&&!reduce;
  h+='<div class="ch"><span class="lv '+T.tab+'">'+tabName(T.tab)+'</span><span class="lab">'+T.lab+'</span></div>';
  h+='<div class="instr">Vereinfache so weit wie möglich. Rechne im Heft.</div>';
  if(idx>=0)h+='<div class="orig">Ausgangsaufgabe<div class="mline" data-fit="1">'+fm(T.e)+'</div></div>';
  h+='<div class="mline big stage" id="stage" data-fit="1">'+stageHtml(P)+'</div>';
  if(s.tip){h+='<div class="tip fade"><b>Tipp:</b> '+wm(T.tip)+'</div>'}
  if(s.res){
    h+='<div class="res fade"><small>Ergebnis</small><div class="mline" data-fit="1">'+fm(T.r)+'</div>';
    if(T.alt){h+='<div class="alt">gleichwertig: <span class="mline">'+fm(T.alt)+'</span></div>'}
    h+='</div>';
  }
  if(s.n>0){
    h+='<div class="steps">';
    for(var i=0;i<s.n;i++){
      var st=T.st[i];
      h+='<div class="stp'+(i===s.n-1?(delayLast?" wait":(wasFresh?" fade":"")):"")+'"><div class="sn">'+(i+1)+'</div><div class="sb">';
      st.m.forEach(function(m){h+='<div class="mline" data-fit="1">'+fm(m)+'</div>'});
      h+='<div class="why">'+wm(st.w)+'</div></div></div>';
    }
    h+='</div>';
  }
  $("#card").innerHTML=h;
  if(delayLast){
    revealT=setTimeout(function(){
      revealT=null;
      var el=document.querySelector(".stp.wait");
      if(el){el.classList.remove("wait");el.classList.add("fade");if(el.scrollIntoView)el.scrollIntoView({block:"nearest"})}
    },1400);
  }
  pending=snap?{snap:snap,A:last.P,B:P}:null;
  last={id:T.id,idx:idx,P:P};
  var b="";
  if(!s.res){
    b+='<span class="hint0">Erst im Heft rechnen, dann Ergebnis zeigen.</span>';
    if(!s.tip){b+='<button class="btn" data-act="tip">💡 Tipp</button>'}
    b+='<button class="btn pri" data-act="res">Ergebnis zeigen</button>';
  } else if(s.n===0){
    b+='<span class="hint0">Stimmt dein Ergebnis?</span>';
    b+='<button class="btn" data-act="steps">Rechenweg ansehen</button>';
    b+='<button class="btn ok" data-act="ok">✓ Stimmt – weiter</button>';
  } else if(s.n<T.st.length){
    b+='<button class="btn" data-act="back">◀ Zurück</button>';
    b+='<button class="btn pri" data-act="steps">Nächster Schritt ▶</button>';
  } else {
    b+='<button class="btn" data-act="back">◀ Zurück</button>';
    b+='<button class="btn ok" data-act="ok">✓ Verstanden – weiter</button>';
  }
  $("#bar").innerHTML=b;
}
function fit(){
  var els=document.querySelectorAll("[data-fit]");
  for(var i=0;i<els.length;i++){
    var n=els[i];n.style.fontSize="";
    var fs=parseFloat(getComputedStyle(n).fontSize);
    while(n.scrollWidth>n.clientWidth+1&&fs>12){fs*=.95;n.style.fontSize=fs+"px"}
  }
}
function render(){renderTabs();renderSide();renderCard();fit();if(pending){var pd=pending;pending=null;animateStage(pd)}}

/* ---------- Bedienung ---------- */
function pick(id){
  var T=byId(id);S.cur=T.id;S.tab=T.tab;
  try{history.replaceState(null,"","#"+T.id)}catch(e){}
  render();$("#card").scrollTop=0;
}
function next(){
  var all=inTab(S.tab),i=all.map(function(t){return t.id}).indexOf(S.cur),j;
  for(j=1;j<=all.length;j++){
    var t=all[(i+j)%all.length];
    if(!S.done[t.id]&&t.id!==S.cur){pick(t.id);return}
  }
  render();
}
document.addEventListener("click",function(e){
  var el=e.target;
  while(el&&el!==document&&!(el.getAttribute&&el.getAttribute("data-act")))el=el.parentNode;
  if(!el||el===document)return;
  var act=el.getAttribute("data-act"),T=byId(S.cur),s=ts(T.id);
  if(act==="tab"){
    var k=el.getAttribute("data-k"),all=inTab(k),t=all.filter(function(x){return !S.done[x.id]})[0]||all[0];
    pick(t.id);return;
  }
  if(act==="pick"){pick(el.getAttribute("data-id"));return}
  if(act==="tip"){s.tip=1}
  else if(act==="res"){s.res=1}
  else if(act==="steps"){s.n=Math.min(s.n+1,T.st.length);fresh=true}
  else if(act==="back"){s.n=Math.max(0,s.n-1);backFlag=true}
  else if(act==="ok"){S.done[T.id]=1;next();return}
  render();
});
window.addEventListener("resize",fit);
window.addEventListener("hashchange",function(){
  var id=(location.hash||"").replace("#","");
  if(id&&id!==S.cur&&TASKS.some(function(t){return t.id===id}))pick(id);
});
(function start(){
  var id=(location.hash||"").replace("#","");
  if(id&&TASKS.some(function(t){return t.id===id})){var T=byId(id);S.cur=T.id;S.tab=T.tab}
  render();
})();
})();
</script>
</body>
