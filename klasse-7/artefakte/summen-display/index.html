<style>

 after.forEach(g=>g());
 $('#ti').textContent=(si+1)+' · '+S.t;
 $('#bar i').style.width=((si+(ki+1)/S.n)/scenes.length*100)+'%';
 $('#pv').disabled=!si&&!ki;$('#nx').disabled=si==scenes.length-1&&ki==S.n-1}
function clear(){st.textContent='';nodes={};$('#sol').style.display='none'}
function go(d){const S=scenes[si];
 if(d>0){if(ki<S.n-1)ki++;else if(si<scenes.length-1){si++;ki=0;clear()}else return}
 else{if(ki>0)ki--;else if(si>0){si--;ki=scenes[si].n-1;clear()}else return}
 render()}
function jump(i){si=i;ki=0;clear();render()}
function reset(){Object.keys(votes).forEach(k=>{if(k.split('.')[0]==si)delete votes[k]});if(si==0)sel1.clear();jump(si)}
st.onclick=e=>{const s=e.target.closest('.chip');if(s&&si==0&&ki==0){const i=s.dataset.i;sel1.has(i)?sel1.delete(i):sel1.add(i);render()}};
$('#nx').onclick=()=>go(1);$('#pv').onclick=()=>go(-1);$('#rs').onclick=reset;
$('#ovb').onclick=()=>$('#ov').classList.toggle('on');
$('#fs').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
$('#sb').onclick=()=>{const s=$('#sol');s.innerHTML=scenes[si].sol;s.style.display=s.style.display=='block'?'none':'block'};
if(TM){$('#badge').style.display='inline-block';$('#sb').style.display='inline-block'}
scenes.forEach((s,i)=>{const d=document.createElement('div');d.innerHTML='<b>'+(i+1)+'</b>'+s.t;d.onclick=()=>{$('#ov').classList.remove('on');jump(i)};$('#ov').appendChild(d)});
document.onkeydown=e=>{if(e.key=='ArrowRight'||e.key==' ')go(1);else if(e.key=='ArrowLeft')go(-1);else if(e.key=='Escape')$('#ov').classList.remove('on')};
render();
</script>
</body>
