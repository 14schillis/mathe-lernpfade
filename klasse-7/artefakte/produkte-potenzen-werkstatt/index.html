<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Werkstatt: Umformen von Produkten und Potenzen</title>
<style>
:root{--bg:#f4f5f9;--t:#1b2233;--m:#677087;--l:#e3e6ee;--ok:#15803d;--bad:#c2410c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--t);font:18px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;touch-action:manipulation}
#app{max-width:1000px;margin:auto;padding:max(24px,env(safe-area-inset-top)) 24px 48px}
h1{font-size:2.1rem;line-height:1.15;margin:.2em 0}
h2{font-size:1.35rem;line-height:1.4;font-weight:600;margin:.3em 0 .8em}
h3{margin:.4em 0 .1em;font-size:1.25rem}
.eyebrow,.lab{font-size:.85rem;color:var(--m);font-weight:600}
.sub,.card p{color:var(--m);margin:.3em 0 1em}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px;margin:28px 0}
.card{--ac:#4f46e5;background:#fff;border-radius:24px;padding:28px;box-shadow:0 1px 2px #1b223310,0 12px 32px -16px #1b223326;margin-bottom:16px}
.grid .card{margin:0}
.num{width:38px;height:38px;border-radius:12px;background:color-mix(in srgb,var(--ac) 12%,#fff);color:var(--ac);display:grid;place-items:center;font-weight:700}
.bar{height:8px;background:var(--l);border-radius:8px;overflow:hidden}
.bar b{display:block;height:100%;background:var(--ac,#1b2233);border-radius:8px;transition:width .6s}
.cap{font-size:.85rem;color:var(--m);margin:.4em 0 1em}
button{font:inherit;cursor:pointer;color:var(--t)}
.pri{background:var(--ac,#4f46e5);color:#fff;border:0;border-radius:14px;padding:14px 26px;font-weight:600;min-height:52px}
.ghost{background:none;border:2px solid var(--l);border-radius:14px;padding:10px 18px;min-height:48px}
.btns{display:flex;flex-wrap:wrap;gap:12px;margin-top:8px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
.dots{display:flex;gap:8px}.dot{width:12px;height:12px;border-radius:50%;background:var(--l)}
.dot.dn{background:var(--ok)}.dot.cur{outline:2px solid var(--t);outline-offset:2px}
.m{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,"Times New Roman",serif;font-size:1.2em;white-space:nowrap}
.m i{font-style:italic}
sup{font-size:.62em;line-height:0;position:relative;top:-.8em;vertical-align:baseline;margin-left:.05em}
.d{font-weight:400;margin:0 .15em}
.big{font-size:2.4rem;text-align:center;margin:.2em 0 .8em}
.opts{display:grid;gap:12px}
.opt,.mt{text-align:left;background:#fff;border:2px solid var(--l);border-radius:16px;padding:16px 20px;min-height:60px;transition:.2s}
.opt.no{border-color:var(--bad);background:#fff4ee}
.opt.yes,.mt.dn{border-color:var(--ok);background:#effaf2}
.mt.sel{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 8%,#fff)}
.mg{display:grid;grid-template-columns:1fr 1fr;gap:12px 28px;margin-bottom:12px}
.mt{text-align:center;font-size:1.4rem}
.row{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;min-height:104px;margin:12px 0 20px;padding:12px;background:#f8f9fc;border-radius:20px}
.tk{position:relative;font-size:2rem;min-width:56px;text-align:center;padding:8px 14px;margin:6px 22px 6px 6px;background:#fff;border:2px solid var(--l);border-radius:14px;user-select:none;transition:transform .55s cubic-bezier(.3,.8,.3,1),margin .5s,opacity .5s,background .4s,border-color .4s}
.tk::after{content:"·";position:absolute;right:-18px;top:50%;transform:translateY(-52%);color:var(--m);transition:opacity .3s}
.tk:last-child{margin-right:6px}.tk:last-child::after{display:none}
.tk.nd{margin-right:2px}.tk.nd::after{opacity:0}
.tk.gp{border-color:var(--ac);background:color-mix(in srgb,var(--ac) 9%,#fff)}
.tk.sel{border-color:var(--ac);transform:translateY(-8px);box-shadow:0 10px 20px -8px var(--ac)}
.tk[data-act]{cursor:pointer}
.res{font-size:2.6rem;padding:10px 28px;border-radius:16px;background:color-mix(in srgb,var(--ac) 10%,#fff);border:2px solid var(--ac)}
.pop{animation:pop .55s}
.inp{min-height:84px;border:2px solid var(--l);border-radius:18px;font-size:2.2rem;display:flex;align-items:center;justify-content:center;margin:12px 0;background:#fff}
.ph{color:#9aa1b3;font:1rem system-ui}
.cr{width:2px;height:1.5em;background:var(--ac);margin-left:3px;animation:bl 1s steps(1) infinite}
.pad{display:grid;grid-template-columns:repeat(auto-fill,minmax(62px,1fr));gap:8px;margin-bottom:16px}
.key{min-height:56px;border:2px solid var(--l);background:#fff;border-radius:14px;font:1.4rem "Cambria Math","STIX Two Math",Cambria,serif}
.key:active{background:#eef0f7}.key.wide{grid-column:span 2;font:600 1rem system-ui}
.fb:empty{display:none}.fb{margin:14px 0;padding:14px 18px;border-radius:16px}
.fb.ok{background:#effaf2;color:#14532d}.fb.bad{background:#fff4ee;color:#7c2d12}
.tip{margin-top:8px;padding-top:8px;border-top:1px dashed #0004}
.sh{animation:sh .35s}
.lk .opt,.lk .key,.lk .tk,.lk .mt{pointer-events:none}
.lnk{background:none;border:0;color:var(--m);font-size:.85rem;text-decoration:underline;padding:14px 8px;min-height:48px}
.tmb{font-size:.78rem;font-weight:600;color:var(--m);border:1px solid var(--l);border-radius:999px;padding:2px 10px;background:#fff;margin-left:6px}
.orig{display:inline-block;margin:6px 0 12px;padding:8px 18px 10px;border-radius:16px;border:2px solid color-mix(in srgb,var(--ac) 30%,#fff);background:color-mix(in srgb,var(--ac) 7%,#fff)}
.orig .ob{font-size:1.7rem}
.fb.sol{background:#f3f0ff;color:#3b2a78}
.sm{padding-left:1.2em}.sm li{margin:.6em 0}
@keyframes pop{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes sh{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes bl{50%{opacity:0}}
@media(max-width:600px){.grid{grid-template-columns:1fr}h1{font-size:1.6rem}.big{font-size:1.9rem}.card{padding:20px}.mg{gap:10px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition-duration:.01s!important}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const $=s=>document.querySelector(s),app=$('#app');
const F=s=>s.replace(/[a-z]/g,'<i>$&</i>').replace(/\^$/,'^□').replace(/\^\{([^}]*)\}|\^(-?\d+|<i>.<\/i>|□)/g,(m,a,b)=>'<sup>'+(a||b)+'</sup>').replace(/\*/g,'<b class=d>·</b>').replace(/-/g,'−');
const T=s=>s.replace(/\$([^$]+)\$/g,(m,x)=>'<span class=m>'+F(x)+'</span>');
const kk=t=>/\d/.test(t[0])?'0':t[0];
const G='Schreibe Potenzen mit Faktoren aus, z. B. $a^2=a*a$, und zähle genau.';
const E=['Koeffizienten addiert statt multipliziert','Exponenten addiert, obwohl sie multipliziert werden müssen','Exponenten multipliziert, obwohl sie addiert werden müssen','Exponent nur auf einen Teil der Klammer bezogen','Summe wie ein Produkt behandelt','Kein Fehler – die Gleichung stimmt'];
const EH='Das ist nicht die Fehlerart. Setze eine Zahl ein (z. B. $a=2$) und vergleiche beide Seiten.';
const O=(ids,ok)=>ids.map(i=>[E[i],i==ok,EH]);
const FQ='Welche Fehlerart steckt in dieser Umformung?';
const M=[
{n:'Produkte aufräumen',d:'Faktoren ordnen und gleiche Faktoren zu Potenzen zusammenfassen.',c:'#4f46e5',
sum:['Bei einem Produkt darf man die Faktoren beliebig vertauschen.','Zahlen werden miteinander multipliziert.','Gleiche Faktoren fasst man zu einer Potenz zusammen: $a*a*a=a^3$. Der Exponent zählt die Faktoren.'],
T:[
[{t:'i',q:'Die Faktoren $a$, $a$ und $a$ stehen als Produkt da. Schreibe es als Potenz.',row:['a','a','a'],a:'a^3',fb:[['3a','$3a$ wäre $a+a+a$. Hier wird aber multipliziert.'],['a^2','Zähle die Faktoren noch einmal.']],tip:'Der Exponent gibt an, wie oft die Basis $a$ als Faktor vorkommt.',ex:'Dreimal der Faktor $a$: Basis $a$, Exponent 3, also $a^3$.'}],
[{t:'o',q:'Ordne die Faktoren: erst die Zahlen, dann die Variablen alphabetisch. Tippe zwei Faktoren nacheinander an, sie tauschen die Plätze.',tk:['b','3','a','2','b'],tip:'Zahlen nach vorn, dann $a$, dann die beiden $b$.',ex:'Faktoren dürfen vertauscht werden. Gleiche Faktoren stehen nun nebeneinander.'},
 {t:'i',q:'Fasse zusammen: Zahlen multiplizieren, gleiche Variablen als Potenz schreiben.',row:'p',a:'6ab^2',fb:[['6ab','$b$ kommt zweimal als Faktor vor, der Exponent ist also 2.'],['5ab^2','Zahlen werden multipliziert, nicht addiert.']],tip:'$3*2=6$ und $b*b=b^2$.',ex:'$3*b*2*a*b=6ab^2$.'}],
[{t:'o',q:'Ordne das Produkt wieder: Zahlen zuerst, dann Variablen alphabetisch.',tk:['2','x','x','3','y','x'],tip:'Alle $x$ zusammen, dann $y$.',ex:'Gut sortiert: Die drei $x$ stehen nebeneinander.'},
 {t:'i',q:'Fasse zusammen.',row:'p',a:'6x^3y',fb:[['6x^2y','Zähle alle $x$: Es sind drei Faktoren.'],['5x^3y','Zahlen werden multipliziert.']],tip:'$2*3=6$, dreimal $x$, einmal $y$.',ex:'$2*x*x*3*y*x=6x^3y$.'}],
[{t:'o',q:'Ordne das Produkt $4bc*3bc*5a^3c$, hier schon in einzelne Faktoren zerlegt.',tk:['4','b','c','3','b','c','5','a^3','c'],tip:'Zahlen: 4, 3, 5. Dann $a^3$, dann die $b$, dann die $c$.',ex:'Alle Faktoren sind nach Zahlen und Variablen gruppiert.'},
 {t:'i',q:'Fasse zusammen.',row:'p',a:'60a^3b^2c^3',fb:[['60a^3b^2c^2','$c$ steht in drei Faktoren.'],['12a^3b^2c^3','Der Faktor 5 fehlt noch.'],['60a^3bc','Zähle die Exponenten von $b$ und $c$.']],tip:'$4*3*5=60$. Dann $a^3$, zweimal $b$, dreimal $c$.',ex:'$4bc*3bc*5a^3c=60a^3b^2c^3$.'}],
[{t:'c',q:'Welcher Term ist das vereinfachte Ergebnis?',big:'2x*5x*x',o:[['$10x^2$',false,'Zähle die $x$: Es sind drei Faktoren.'],['$7x^3$',false,'Zahlen werden multipliziert, nicht addiert.'],['$10x^3$',true],['$10x$',false,'$x$ kommt mehrfach als Faktor vor.']],tip:G,ex:'$2*5=10$ und $x*x*x=x^3$.'}]
]},
{n:'Potenzgesetze',d:'Gesetze über ausgeschriebene Faktoren verstehen und gezielt anwenden.',c:'#0f766e',
sum:['Gleiche Basis, Produkt: Exponenten addieren, $a^n*a^m=a^{n+m}$.','Potenz eines Produkts: Exponent gilt für jeden Faktor, $(ab)^n=a^n*b^n$.','Potenz einer Potenz: Exponenten multiplizieren, $(a^n)^m=a^{n*m}$.','Erst entscheiden, welches Gesetz passt, dann anwenden.'],
T:[

[{t:'c',q:'$(ab)^3$ bedeutet $(ab)*(ab)*(ab)$. Welcher Term ist gleichwertig?',o:[['$a^3b$',false,'Der Exponent 3 gilt für beide Faktoren, auch für $b$.'],['$ab^3$',false,'Auch $a$ kommt dreimal vor.'],['$3ab$',false,'Der Exponent bedeutet wiederholtes Multiplizieren, nicht „mal 3“.'],['$a^3b^3$',true]],tip:'Schreibe alle sechs Faktoren aus und zähle $a$ und $b$.',ex:'Potenz eines Produkts: $(ab)^n=a^n*b^n$.'}],
[{t:'i',q:'$(a^3)^2$ bedeutet $a^3*a^3$. Schreibe das Ergebnis als Potenz.',a:'a^6',fb:[['a^5','Hier steht $a^3$ zweimal als Faktor. Wie viele $a$ sind es insgesamt?']],tip:'$a^3*a^3=(a*a*a)*(a*a*a)$.',ex:'Potenz einer Potenz: Exponenten multiplizieren, $(a^n)^m=a^{n*m}$.'}],
[{t:'c',q:'Entscheide zuerst: Welches Gesetz passt zu $x^4*x^5$?',o:[['Potenz einer Potenz: Exponenten multiplizieren',false,'Es gibt keine Klammer mit Exponent.'],['Potenz eines Produkts: Exponent auf jeden Faktor',false,'Hier steht kein Produkt in einer Klammer.'],['Gleiche Basis, Produkt: Exponenten addieren',true]],tip:'Beide Faktoren haben die Basis $x$ und sind multipliziert.',ex:'Gleiche Basis und ein Produkt: addieren.'},
 {t:'i',q:'Wende das Gesetz an: $x^4*x^5=$',a:'x^9',fb:[['x^20','Beim Produkt gleicher Basen addiert man die Exponenten.']],tip:'$4+5$.',ex:'$x^4*x^5=x^{4+5}=x^9$.'}],
[{t:'c',q:'Was ist beim Term $(2x)^3*x^2$ der erste sinnvolle Schritt?',o:[['Die Exponenten 3 und 2 addieren',false,'Die Basen $2x$ und $x$ sind verschieden.'],['$(2x)^3$ mit dem Gesetz für Produkte auflösen: $2^3*x^3$',true],['Alles mit 2 multiplizieren',false,'Der Exponent bedeutet wiederholtes Multiplizieren.']],tip:'$(2x)^3=2x*2x*2x$.',ex:'Zuerst $(2x)^3=2^3*x^3=8x^3$.'},
 {t:'i',q:'Vereinfache $(2x)^3*x^2$.',a:'8x^5',fb:[['2x^5','Der Exponent 3 gilt auch für die Zahl 2.'],['6x^5','$2^3=2*2*2=8$, nicht $2*3$.']],tip:'$8x^3*x^2$: Exponenten von $x$ addieren.',ex:'$(2x)^3*x^2=8x^3*x^2=8x^5$.'}],
[{t:'c',q:'Welcher Weg passt zu $(a^2b)^3$?',o:[['Nur das Gesetz für Potenzen von Potenzen',false,'$b$ steht ebenfalls in der Klammer.'],['Zuerst Exponent 3 auf jeden Faktor, dann Exponenten multiplizieren',true],['Die Exponenten 2 und 3 addieren',false,'Hier wird potenziert, nicht multipliziert.']],tip:'$(a^2b)^3=(a^2)^3*b^3$.',ex:'Erst Potenz eines Produkts, dann Potenz einer Potenz.'},
 {t:'i',q:'Vereinfache $(a^2b)^3$.',a:'a^6b^3',fb:[['a^5b^3','Für $a^2$ gilt: Exponenten multiplizieren.'],['a^6b','Auch $b$ wird mit 3 potenziert.']],tip:'$(a^2)^3=a^6$ und $b^3$.',ex:'$(a^2b)^3=a^6b^3$.'}]
]},
{n:'Fehlerlabor',d:'Typische Fehler finden, benennen und korrigieren.',c:'#b45309',
sum:['Zahlen vor Variablen werden bei Produkten multipliziert, nicht addiert.','Potenzgesetze gelten für Produkte und Potenzen, nicht für Summen: $x^3+x^4$ bleibt stehen.','Ein Exponent bezieht sich nur auf das direkt davor Stehende, bei einer Klammer aber auf alles in der Klammer.','Eine Zahlenprobe hilft, Fehler schnell zu entdecken.'],
T:[
[{t:'c',q:FQ,big:'3a*4a=7a^2',o:O([1,0,2,5],0),tip:'Mit $a=2$: links $6*8=48$, rechts $7*4=28$.',ex:'Die Zahlen werden multipliziert: $3*4=12$.'},
 {t:'i',q:'Wie lautet das richtige Ergebnis?',a:'12a^2',fb:[['12a','$a*a$ ist $a^2$.'],['7a^2','Das ist der Fehler von eben.']],tip:'$3*4=12$ und $a*a=a^2$.',ex:'$3a*4a=12a^2$.'}],
[{t:'c',q:FQ,big:'(a^3)^2=a^5',o:O([3,1,4,5],1),tip:'$(a^3)^2=a^3*a^3$. Wie viele Faktoren $a$ sind das?',ex:'Beim Potenzieren einer Potenz werden die Exponenten multipliziert.'},

[{t:'c',q:FQ,big:'x^3+x^4=x^7',o:O([2,4,0,5],4),tip:'Mit $x=2$: links $8+16=24$, rechts $2^7=128$.',ex:'Das Gesetz für gleiche Basen gilt nur für Produkte, nicht für Summen.'},
 {t:'c',q:'Was stimmt?',o:[['$x^3+x^4=x^{12}$',false,'Probiere $x=2$: $24$ und $4096$.'],['$x^3+x^4$ lässt sich nicht zu einer einzigen Potenz zusammenfassen.',true],['$x^3+x^4=2x^7$',false,'Probiere $x=2$: $24$ und $256$.']],tip:'Summen lassen sich nicht wie Produkte zusammenfassen.',ex:'Eine Summe mit verschiedenen Exponenten bleibt stehen.'}],
[{t:'c',q:FQ,big:'(3x)^2=3x^2',o:O([3,0,2,5],3),tip:'$(3x)^2=3x*3x$. Wie oft steht die 3 als Faktor da?',ex:'Der Exponent 2 gehört zur ganzen Klammer, auch zur 3.'},
 {t:'i',q:'Korrigiere die rechte Seite.',a:'9x^2',fb:[['6x^2','$3^2=3*3=9$.'],['3x^2','Das ist der Fehler von eben.']],tip:'$3*3=9$ und $x*x=x^2$.',ex:'$(3x)^2=9x^2$.'}],
[{t:'c',q:FQ,big:'a^2*a^3=a^6',o:O([1,2,3,5],2),tip:'$a*a*a*a*a$: Wie viele Faktoren?',ex:'Beim Produkt gleicher Basen werden die Exponenten addiert.'},
 {t:'i',q:'Korrigiere die rechte Seite.',a:'a^5',fb:[['a^6','Das ist der Fehler von eben.']],tip:'$2+3$.',ex:'$a^2*a^3=a^5$.'}],
[{t:'c',q:FQ,big:'a^3*a=a^4',o:O([2,5,0,3],5),tip:'$a$ ist dasselbe wie $a^1$. Schreibe alle Faktoren aus.',ex:'Stimmt: $a=a^1$, also $a^3*a^1=a^{3+1}=a^4$.'}]
]},
{n:'Äquivalente Terme und Transfer',d:'Terme zuordnen, Zahlenproben bewerten und mit Umformen begründen.',c:'#7c3aed',
sum:['Äquivalente Terme haben für jede Einsetzung denselben Wert.','Gleiche Ergebnisse bei einigen Zahlenproben sind nur ein Hinweis.','Ein Gegenbeispiel zeigt, dass Terme nicht äquivalent sind.','Allgemein zeigt man Äquivalenz durch Umformen mit den Rechengesetzen.'],
T:[
[{t:'m',q:'Ordne zu: Tippe links einen Term an, dann rechts den äquivalenten.',p:[['$2a*3a$','$6a^2$'],['$(2a)^2$','$4a^2$'],['$a^2*a^3$','$a^5$'],['$(a^2)^3$','$a^6$']],tip:'Schreibe die Terme mit Faktoren aus.',ex:'Alle vier Paare stimmen. Begründet wurde jeweils durch Umformen.'}],
[{t:'c',q:'Für $a=2$ gilt $2a=4$ und $a^2=4$. Sind $2a$ und $a^2$ äquivalent?',o:[['Ja, die Werte stimmen überein.',false,'Eine einzelne Probe kann Zufall sein.'],['Das ist nur ein Hinweis. Eine Probe reicht nicht, man muss weiter prüfen oder umformen.',true]],tip:'Probiere eine andere Zahl.',ex:'Zahlenproben liefern nur Hinweise.'},
 {t:'i',n:1,sol:'Jede Zahl außer 0 und 2, z. B. $a=3$.',q:'Finde eine Zahl für $a$, bei der $2a$ und $a^2$ verschiedene Werte haben.',chk:v=>v==0?'Bei 0 sind beide Terme 0.':v==2?'Bei 2 stimmen sie zufällig überein.':true,tip:'Probiere $a=3$.',ex:'Z. B. $a=3$: $2a=6$, aber $a^2=9$. Ein Gegenbeispiel genügt: nicht äquivalent.'}],

[{t:'c',q:'Welcher Term ist äquivalent zu $2x*3x^2$?',o:[['$5x^3$',false,'Zahlen werden multipliziert.'],['$6x^2$',false,'Beim Produkt gleicher Basen addiert man die Exponenten.'],['$6x^3$',true],['$6x^5$',false,'Exponenten werden addiert, nicht multipliziert.']],tip:'$2*3=6$ und $x*x^2=x^{1+2}$.',ex:'$2x*3x^2=6x^3$.'}],

]}
];
const TM=new URLSearchParams(location.search).get('teacher')=='1',KEY='werkstatt-produkte-potenzen-v1',P0=[[],[],[],[]],S={v:'h',m:0,t:0,s:0};
function save(){if(TM)return;try{localStorage.setItem(KEY,JSON.stringify(P0.map(a=>Array.from(a,x=>x?1:0))))}catch(e){}}
if(!TM)try{const sv=JSON.parse(localStorage.getItem(KEY));if(Array.isArray(sv))sv.slice(0,4).forEach((a,i)=>{if(Array.isArray(a))P0[i]=a.slice(0,M[i].T.length).map(x=>x?1:0)})}catch(e){}
const stp=()=>M[S.m].T[S.t][S.s];
const done=i=>M[i].T.filter((_,j)=>P0[i][j]).length;
function P(s){const o={c:1,v:{},err:0};let n=0;s=s.replace(/[\s·*{}]/g,'');for(const m of s.matchAll(/(\d+)|([a-z])(?:\^(\d+))?/g)){if(m[1]){o.c*=+m[1];if(++n>1)o.err='Multipliziere die Zahlen zu einer einzigen Zahl.'}else{if(m[2] in o.v)o.err=o.err||'Fasse gleiche Faktoren zu einer Potenz zusammen.';o.v[m[2]]=(o.v[m[2]]||0)+(m[3]?+m[3]:1)}}return o}
const eq=(p,q)=>{const f=o=>o.c+JSON.stringify(Object.entries(o.v).sort());return f(p)==f(q)};
function enter(){Object.assign(S,{tr:0,lock:0,val:'',sel:null,pd:[]});const st=stp();if(st.t=='o')S.ord=st.tk.map((_,i)=>i)}
function rowH(toks,act,ids,gr){return toks.map((t,p)=>{const k=kk(t),n=gr&&toks[p+1]&&kk(toks[p+1])==k,q=gr&&p&&kk(toks[p-1])==k;return`<span class="tk m${n?' nd':''}${n||q?' gp':''}${act&&S.sel===p?' sel':''}"${act?` data-act=tk data-p=${p}`:''} data-id=${ids?ids[p]:p} data-t="${t}">${F(t)}</span>`}).join('')}
const ordRow=()=>rowH(S.ord.map(i=>stp().tk[i]),1,S.ord,0);
function pad(st){const L=st.n?[]:[...new Set((st.a||'').replace(/[^a-z]/g,''))];const K=[...L.map(x=>[x,F(x)]),...(st.n?[]:[['^','Exponent'],['·','·']]),...'1234567890'.split('').map(x=>[x,x]),['<','⌫']];return'<div class=pad>'+K.map(([v,l])=>`<button class="key${v=='^'?' wide':''}" data-act=k data-v="${v}">${l}</button>`).join('')+'</div>'}
const inp=()=>S.val?F(S.val)+'<u class=cr></u>':'<span class=ph>Deine Antwort</span>';
function home(){const tot=M.reduce((a,m)=>a+m.T.length,0),d=M.reduce((a,m,i)=>a+done(i),0);return`<header><div class=eyebrow>Mathematik · Klasse 7${TM?'<span class=tmb>Lehrermodus</span>':''}</div><h1>Umformen von Produkten und Potenzen</h1><p class=sub>Denke mit: Schreibe Faktoren aus, ordne, begründe. Du bekommst Hinweise, die Lösung findest du selbst.</p><div class=bar><b style="width:${d/tot*100}%"></b></div><div class=cap>${d} von ${tot} Aufgaben bearbeitet</div></header><div class=grid>`+M.map((m,i)=>{const n=m.T.length,x=done(i);return`<div class=card style="--ac:${m.c}"><div class=num>${i+1}</div><h3>${m.n}</h3><p>${m.d}</p><div class=bar><b style="width:${x/n*100}%"></b></div><div class=cap>${x} von ${n} Aufgaben</div><button class=pri data-act=go data-i=${i}>${x==0?'Starten':x<n?'Fortsetzen':'Erneut üben'}</button></div>`}).join('')+'</div><div class=btns>'+(d?'<button class=ghost data-act=fin>Abschlussübersicht</button>':'')+(TM?'':'<button class=lnk data-act=reset>Fortschritt zurücksetzen</button>')+'</div>'}
function task(){const m=M[S.m],st=stp(),n=m.T.length,len=m.T[S.t].length;let h=`<div class=top><button class=ghost data-act=home>← Übersicht</button>${TM?'<span class=tmb>Lehrermodus</span>':''}<div class=dots>`+m.T.map((_,i)=>`<span class="dot${P0[S.m][i]?' dn':''}${i==S.t?' cur':''}"></span>`).join('')+`</div></div><div class=card id=card style="--ac:${m.c}"><div class=lab>${m.n} · Aufgabe ${S.t+1} von ${n}${len>1?' · Schritt '+(S.s+1)+' von '+len:''}</div>${S.s>0&&m.T[S.t][0].big&&!st.big?`<div class=orig><div class=lab>Ausgangsaufgabe</div><div class="ob m">${F(m.T[S.t][0].big)}</div></div>`:''}<h2>${T(st.q)}</h2>`;
if(st.big)h+=`<div class="big m">${F(st.big)}</div>`;
if(st.t=='c')h+='<div class=opts>'+st.o.map((o,i)=>`<button class=opt data-act=ch data-i=${i}>${T(o[0])}</button>`).join('')+'</div>';
if(st.t=='o')h+=`<div class=row id=row>${ordRow()}</div><button class=pri data-act=chk>Prüfen</button>`;
if(st.t=='i'){if(st.row)h+=`<div class=row id=row>${st.row=='p'?rowH(S.row,0,0,1):rowH(st.row,0,0,0)}</div>`;h+=`<div class="inp m" id=inp>${inp()}</div>${pad(st)}<button class=pri data-act=chk>Prüfen</button>`}
if(st.t=='m'){const p=st.p,n=p.length,R=[...Array(n).keys()].map(i=>(i+2)%n);h+='<div class=mg>'+p.map((x,i)=>`<button class="mt m${S.pd.includes(i)?' dn':''}${S.sel===i?' sel':''}" data-act=ml data-i=${i}>${T(x[0])}</button><button class="mt m${S.pd.includes(R[i])?' dn':''}" data-act=mr data-i=${R[i]}>${T(p[R[i]][1])}</button>`).join('')+'</div>'}
return h+'<div id=fb class=fb></div><div id=nx></div>'+(TM?'<div class=btns><button class=ghost data-act=sol>Lösung anzeigen</button></div>':'')+'</div>'}
function summ(){const m=M[S.m];return`<div class=card style="--ac:${m.c}"><div class=lab>Zusammenfassung · ${m.n}</div><h2>Das hast du erarbeitet</h2><ul class=sm>`+m.sum.map(x=>`<li>${T(x)}</li>`).join('')+`</ul><div class=btns><button class=pri data-act=home>Zur Übersicht</button>`+(S.m<3?`<button class=ghost data-act=go data-i=${S.m+1}>Nächstes Modul</button>`:'<button class=ghost data-act=fin>Abschluss</button>')+'<button class=ghost data-act=redo>Modul erneut üben</button></div></div>'}
function fin(){const all=M.every((m,i)=>done(i)==m.T.length);return`<div class=top><button class=ghost data-act=home>← Übersicht</button></div><header><div class=eyebrow>Abschluss${TM?'<span class=tmb>Lehrermodus</span>':''}</div><h1>${all?'Alle vier Module bearbeitet':'Dein Stand'}</h1><p class=sub>Übereinstimmende Zahlenproben liefern nur einen Hinweis. Ein Gegenbeispiel widerlegt Äquivalenz. Äquivalenz zeigt man allgemein durch Umformen mit Rechengesetzen.</p></header><div class=grid>`+M.map((m,i)=>{const n=m.T.length,x=done(i);return`<div class=card style="--ac:${m.c}"><h3>${m.n}</h3><div class=bar><b style="width:${x/n*100}%"></b></div><div class=cap>${x} von ${n} Aufgaben</div><button class=${x==n?'ghost':'pri'} data-act=go data-i=${i}>${x==n?'Erneut üben':'Weiter üben'}</button></div>`}).join('')+'</div>'}
function draw(sc){app.innerHTML={h:home,t:task,s:summ,f:fin}[S.v]();if(sc)scrollTo(0,0)}
function fb(c,h){const e=$('#fb');e.className='fb '+c;e.innerHTML=h;if(c=='bad'){e.classList.remove('sh');void e.offsetWidth;e.classList.add('sh')}}
function bad(msg){S.tr++;const st=stp();fb('bad',T(msg)+(S.tr>=3?`<div class=tip><b>Tipp:</b> ${T(st.tip||G)}</div>`:''))}
function ok(){const st=stp(),t=M[S.m].T[S.t],last=S.s==t.length-1;S.lock=1;$('#card').classList.add('lk');fb('ok','<b>Richtig!</b> '+T(st.ex||''));if(last){P0[S.m][S.t]=1;save()}nxb()}
function nxb(){const t=M[S.m].T,last=S.s==t[S.t].length-1;$('#nx').innerHTML=`<button class=pri data-act=nx>${!last?'Weiter':S.t<t.length-1?'Nächste Aufgabe':'Zusammenfassung'}</button>`}
function grp(){const ts=[...document.querySelectorAll('#row .tk')];ts.forEach((e,i)=>{const k=kk(e.dataset.t),n=ts[i+1]&&kk(ts[i+1].dataset.t)==k,p=i&&kk(ts[i-1].dataset.t)==k;e.classList.toggle('nd',!!n);e.classList.toggle('gp',!!(n||p))})}
function collapse(a){const ts=[...document.querySelectorAll('#row .tk')],L={};ts.forEach(e=>{const k=kk(e.dataset.t);if(!(k in L))L[k]=e});ts.forEach(e=>{e.classList.add('nd');const l=L[kk(e.dataset.t)];if(l!==e){e.style.transform=`translateX(${l.getBoundingClientRect().left-e.getBoundingClientRect().left}px) scale(.5)`;e.style.opacity=0}else e.classList.add('gp')});setTimeout(()=>{$('#row').innerHTML=`<span class="res m pop">${F(a)}</span>`},750)}
function flip(fn){const r=$('#row'),o={};r.querySelectorAll('.tk').forEach(e=>{const b=e.getBoundingClientRect();o[e.dataset.id]=[b.left,b.top]});fn();r.querySelectorAll('.tk').forEach(e=>{const b=e.getBoundingClientRect(),[x,y]=o[e.dataset.id];e.style.transition='none';e.style.transform=`translate(${x-b.left}px,${y-b.top}px)`;e.offsetWidth;e.style.transition='';e.style.transform=''})}
function ordOk(){const tk=stp().tk;let last='';for(const id of S.ord){const k=kk(tk[id]);if(k<last)return k=='0'?'Zahlen stehen zuerst, dann die Variablen.':'Gleiche Variablen müssen nebeneinander stehen, alphabetisch geordnet (erst $a$, dann $b$ …).';last=k}return 0}
function evalIn(){const st=stp(),v=S.val;if(!v)return'Gib zuerst eine Antwort ein.';if(st.chk)return st.chk(+v);const p=P(v);if(p.err)return p.err;if(eq(p,P(st.a)))return true;for(const[w,m]of st.fb||[])if(eq(p,P(w)))return m;return'Das stimmt noch nicht. Schreibe die Faktoren einzeln aus und zähle nach.'}
function go(i){if(done(i)==M[i].T.length){P0[i]=[];save()}S.m=i;S.t=Math.max(0,M[i].T.findIndex((_,j)=>!P0[i][j]));S.s=0;S.v='t';enter();draw(1)}
const act={
home:()=>{S.v='h';draw(1)},reset:()=>{if(confirm('Fortschritt wirklich zurücksetzen? Alle Aufgaben gelten danach wieder als unbearbeitet.')){for(let i=0;i<4;i++)P0[i]=[];save();draw(1)}},
sol:()=>{const st=stp();let a='';
if(st.t=='c'){a=st.o.filter(o=>o[1]).map(o=>T(o[0])).join('<br>');document.querySelectorAll('.opt').forEach((b,i)=>b.classList.toggle('yes',!!st.o[i][1]))}
else if(st.t=='o'){const ids=st.tk.map((_,i)=>i).sort((x,y)=>kk(st.tk[x])<kk(st.tk[y])?-1:kk(st.tk[x])>kk(st.tk[y])?1:x-y);S.row=ids.map(i=>st.tk[i]);a='<span class=m>'+F(S.row.join('*'))+'</span>';flip(()=>{S.ord=ids;S.sel=null;$('#row').innerHTML=rowH(S.row,1,ids,1)})}
else if(st.t=='i')a=st.sol?T(st.sol):'<span class=m>'+F(st.a)+'</span>';
else{S.pd=st.p.map((_,i)=>i);S.sel=null;draw();a='<ul class=sm>'+st.p.map(x=>`<li>${T(x[0])} = ${T(x[1])}</li>`).join('')+'</ul>'}
fb('sol','<b>Lösung:</b> '+a+'<div class=tip><b>Erklärung:</b> '+T(st.ex||'')+'</div>');nxb()},
fin:()=>{S.v='f';draw(1)},go:b=>go(+b.dataset.i),redo:()=>{P0[S.m]=[];go(S.m)},
nx:()=>{const t=M[S.m].T;if(S.s<t[S.t].length-1)S.s++;else if(S.t<t.length-1){S.t++;S.s=0}else{S.v='s';draw(1);return}enter();draw(1)},
ch:b=>{if(S.lock)return;const o=stp().o[+b.dataset.i];if(o[1]){b.classList.add('yes');ok()}else{b.classList.add('no');b.disabled=true;bad(o[2]||'Das passt noch nicht. Prüfe noch einmal genau.')}},
k:b=>{if(S.lock)return;const v=b.dataset.v;S.val=v=='<'?S.val.slice(0,-1):S.val+v;$('#inp').innerHTML=inp()},
tk:b=>{if(S.lock)return;const p=+b.dataset.p;if(S.sel==null){S.sel=p;$('#row').innerHTML=ordRow()}else if(S.sel==p){S.sel=null;$('#row').innerHTML=ordRow()}else{const q=S.sel;S.sel=null;flip(()=>{[S.ord[p],S.ord[q]]=[S.ord[q],S.ord[p]];$('#row').innerHTML=ordRow()})}},
chk:()=>{if(S.lock)return;const st=stp();if(st.t=='o'){const r=ordOk();if(r)bad(r);else{S.row=S.ord.map(i=>st.tk[i]);grp();ok()}}else{const r=evalIn();if(r===true){ok();if(st.row)collapse(st.a)}else bad(r)}},
ml:b=>{if(S.lock||S.pd.includes(+b.dataset.i))return;S.sel=+b.dataset.i;draw()},
mr:b=>{const j=+b.dataset.i,st=stp();if(S.lock||S.pd.includes(j))return;if(S.sel==null){fb('bad','Tippe zuerst links einen Term an.');return}if(S.sel==j){S.pd.push(j);S.sel=null;draw();if(S.pd.length==st.p.length)ok();else fb('ok','<b>Passt!</b> Weiter mit dem nächsten Paar.')}else{S.sel=null;draw();bad('Diese beiden Terme sind nicht äquivalent. Schreibe beide mit ausgeschriebenen Faktoren.')}}
};
document.addEventListener('click',e=>{const b=e.target.closest('[data-act]');if(b)act[b.dataset.act](b)});
draw();
</script>
</body>
