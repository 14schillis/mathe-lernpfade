<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Umformen von Produkten und Potenzen</title>
<style>
:root{--ac:#4f46e5;--ac2:#eceaff;--ink:#14172b;--mut:#6a7090;--ok:#0f9d6b;--okb:#e1f7ee;--no:#d9363e;--nob:#fdeced}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#d9dcec;font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center}
#st{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);container-type:size;background:linear-gradient(135deg,#f9faff,#eef0fb);display:grid;grid-template-rows:auto auto 1fr auto;gap:1.8cqh;padding:2.6cqh 3cqw;overflow:hidden}
header{display:flex;align-items:center;gap:1.4cqw}
.bd{width:4.4cqw;height:4.4cqw;border-radius:1.2cqw;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:2.2cqw;font-weight:700;transition:background .4s}
h1{font-size:2.5cqw;font-weight:700;letter-spacing:-.02em;flex:1}
.rt{display:flex;align-items:center;gap:1.2cqw;color:var(--mut);font-size:1.6cqw;font-weight:600}
#pb{height:.6cqh;background:#dcdff3;border-radius:9px;overflow:hidden}
#pf{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s,background .4s}
main{min-height:0;display:flex;flex-direction:column;justify-content:center}
.sc{display:flex;flex-direction:column;gap:1.8cqh;animation:in .45s ease both}
footer{display:flex;justify-content:space-between;align-items:center;gap:1.4cqw}
.g{display:flex;gap:1.2cqw}
.btn{font:inherit;font-size:1.7cqw;font-weight:600;min-height:7cqh;padding:0 2.4cqw;border:0;border-radius:1.4cqw;background:#fff;color:var(--ink);box-shadow:0 .2cqw .9cqw rgba(30,35,80,.12);cursor:pointer;transition:transform .15s,opacity .2s,background .3s}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--ac);color:#fff;min-width:22cqw}
.btn.d{background:var(--ink);color:#fff}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.ic{min-height:5cqh;padding:0 1.2cqw}
m,.tk,.pre{font-family:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,"Times New Roman",serif}
m{white-space:nowrap;font-style:normal}
m i,.tk i{font-style:italic}
sup{font-size:.64em;line-height:0;vertical-align:.7em;margin-left:.1em;font-style:normal}
.h{background:#fff0b8;border-radius:.4cqw;padding:0 .25cqw}
.tks{display:flex;align-items:baseline;gap:.1em;padding-top:.12em}
.tk{display:block;line-height:1.1;white-space:nowrap}
.tk.x{margin-left:-.1em}
.pre{display:inline-block;width:1.3em;text-align:center;opacity:.5}
.q{font-size:2cqw;color:var(--mut);font-weight:500}
.eq{font-size:3.7cqw;line-height:1.15}
.eq.md{font-size:3.3cqw}.eq.sm{font-size:3cqw}
.card{position:relative;background:#fff;border-radius:2cqw;padding:2.4cqh 1.8cqw;box-shadow:0 .4cqw 2cqw rgba(40,45,110,.09);border:.25cqw solid transparent;transition:.35s;cursor:pointer;display:flex;flex-direction:column;gap:1.2cqh;align-items:center;text-align:center}
.lb{font-size:1.25cqw;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ac)}
.vl{font-size:1.6cqw;color:var(--mut)}.vl b{color:var(--ink)}
.vd{font-size:1.5cqw;font-weight:700}
.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:1.6cqw}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw}
.two{display:grid;grid-template-columns:1fr 1fr;gap:1.8cqw}
.stack{display:flex;flex-direction:column;gap:1.5cqh}
.row{display:flex;align-items:center;justify-content:space-between;gap:2cqw;background:#fff;border-radius:1.6cqw;padding:1cqh 2.2cqw;box-shadow:0 .3cqw 1.4cqw rgba(40,45,110,.08)}
.tag{font-size:1.45cqw;font-weight:600;color:var(--ac);background:var(--ac2);padding:.8cqh 1.4cqw;border-radius:99px;text-align:center}
.top{display:flex;align-items:center;justify-content:space-between;gap:2cqw}
.claim{font-size:4.2cqw}
.vrow{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2cqw}
.claim.tks{justify-content:center}
.chips{display:flex;gap:1.1cqw;align-items:center}
.lq{font-size:1.4cqw;color:var(--mut);font-weight:600}
.chip{font:inherit;font-size:1.45cqw;font-weight:600;flex:0 0 auto;padding:1.1cqh 1.4cqw;border-radius:1.2cqw;background:#fff;border:.22cqw solid #dfe2f3;text-align:center;cursor:pointer;transition:.3s;display:inline-flex;gap:.8cqw;align-items:center;justify-content:center;color:var(--ink)}
.chip m{font-size:2.4cqw}
.chips .chip{flex:1}
.top .chip{flex:0 0 auto}
.vote{font-size:2.5cqw;padding:3cqh 2.6cqw;min-width:20cqw;box-shadow:0 .3cqw 1.2cqw rgba(40,45,110,.1)}
.chip b{background:var(--ac2);color:var(--ac);border-radius:99px;padding:0 1cqw;min-width:2.8cqw}
.sel{border-color:var(--ac)!important;background:var(--ac2)!important}
.ok{border-color:var(--ok)!important;background:var(--okb)!important}
.no{border-color:#f0b4b8!important;background:var(--nob)!important}
.chip.no:not(.sel){opacity:.45;background:#fff!important;border-color:#dfe2f3!important}
.ok .vd,.ok .vl b{color:var(--ok)}.no .vd{color:var(--no)}
.res{background:linear-gradient(135deg,var(--ac),#111827);color:#fff;border-radius:1.8cqw;padding:1.8cqh 2.4cqw;text-align:center}
.res .eq{font-size:4cqw}.res .h{background:rgba(255,255,255,.22)}
.res .tks{justify-content:center}
.rule{display:flex;justify-content:space-between;align-items:center;gap:2cqw;background:#fff;border-left:.7cqw solid var(--ac);border-radius:1.6cqw;padding:1.4cqh 2.4cqw;box-shadow:0 .4cqw 2cqw rgba(40,45,110,.1)}
.rule .eq{font-size:3.2cqw}
.rule span{font-size:1.8cqw;font-weight:700;color:var(--ac)}
.note{font-size:1.9cqw;background:rgba(255,255,255,.75);border-radius:1.4cqw;padding:1.3cqh 2cqw;text-align:center}
.note m{font-size:2.3cqw}
.note.pf{background:#fff;text-align:left;box-shadow:0 .3cqw 1.4cqw rgba(40,45,110,.08)}
.note.pf m{font-size:2.6cqw}
.pl{display:flex;justify-content:space-between;align-items:center;gap:2cqw;padding:.5cqh 0}
.sm{font-size:1.8cqw;color:var(--mut);margin-top:.8cqh;text-align:center}
.row.t8{display:grid;grid-template-columns:15cqw 1fr 21cqw}
.law p{font-size:1.55cqw;font-weight:600}
.law .eq{font-size:2.9cqw}
.ex{font-size:2.2cqw;color:var(--mut)}
.strat{display:flex;align-items:center;gap:1.2cqw}
.st{flex:1;background:#fff;border-radius:1.6cqw;padding:1.6cqh 1.6cqw;font-size:1.8cqw;font-weight:600;display:flex;align-items:center;gap:1.2cqw;box-shadow:0 .3cqw 1.4cqw rgba(40,45,110,.08)}
.st b{flex:none;width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center}
.ar{color:var(--mut);font-size:2.4cqw}
.dn .eq{font-size:3.1cqw}.dn .row{padding:.7cqh 2cqw}.dn .claim{font-size:3.7cqw}.dn .rule .eq{font-size:2.9cqw}
.rv:not(.on){display:none!important}
.rv.on{animation:pop .5s ease both}
.rv.on[data-r]{animation:fo .4s ease both}
.fd{transition:opacity .45s,transform .45s}
.fd:not(.on){opacity:0;visibility:hidden;transform:translateY(1cqh)}
@keyframes pop{from{opacity:0;transform:translateY(1.4cqh)}}
@keyframes fo{from{opacity:0}}
@keyframes in{from{opacity:0;transform:translateX(2.4cqw)}}
#ov{position:absolute;inset:0;background:rgba(236,239,251,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;flex-direction:column;gap:3cqh;padding:4cqh 3.4cqw;z-index:5}
#ov.on{display:flex;animation:pop .3s}
.oh{display:flex;justify-content:space-between;align-items:center}
.oh h2{font-size:3cqw}
.tiles{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:1.4cqw}
.tile{font:inherit;border:.25cqw solid transparent;background:#fff;border-radius:1.8cqw;padding:2cqh 1.4cqw;text-align:left;display:flex;flex-direction:column;gap:1cqh;cursor:pointer;box-shadow:0 .3cqw 1.4cqw rgba(40,45,110,.09);color:var(--ink)}
.tile b{color:var(--ac);font-size:2cqw}
.tile span{font-size:1.6cqw;font-weight:700}
.tile em{font-style:normal;font-size:1.8cqw;margin-top:auto;color:var(--mut)}
.tile.cur{border-color:var(--ac)}
</style>
</head>
<body>
<div id="st">
<header><div class="bd" id="bd">1</div><h1 id="ti"></h1><div class="rt"><span id="pg"></span><button class="btn ic" onclick="fs()">⛶</button></div></header>
<div id="pb"><i id="pf"></i></div>
<main id="mn"></main>
<footer>
<div class="g"><button class="btn" id="bk" onclick="nav(-1)">‹ Zurück</button><button class="btn" onclick="ov(1)">▦ Übersicht</button></div>
<div class="g"><button class="btn p" id="sb" onclick="nx()"></button><button class="btn" onclick="go(cur)">↺ Zurücksetzen</button></div>
<div class="g"><button class="btn d" id="fw" onclick="nav(1)">Weiter ›</button></div>
</footer>
<div id="ov"></div>
</div>
<script>
const g=id=>document.getElementById(id),EZ='cubic-bezier(.45,0,.2,1)';
function M(s){let o='',i=0;while(i<s.length){const c=s[i];
if(c=='^'){i++;let t;if(s[i]=='{'){const j=s.indexOf('}',i);t=s.slice(i+1,j);i=j+1}else{t=s[i];i++}o+='<sup>'+M(t)+'</sup>'}
else if(c=='['){const j=s.indexOf(']',i);o+='<span class="h">'+M(s.slice(i+1,j))+'</span>';i=j+1}
else if(/[a-z]/i.test(c)){o+='<i>'+c+'</i>';i++}
else if(c=='*'){o+='·';i++}else{o+=c;i++}}return o}
const T=s=>s.replace(/\$([^$]+)\$/g,(_,x)=>'<m>'+M(x)+'</m>');
/* Token-Zeilen: Syntax "schluessel<quellen:inhalt", "*" = Malpunkt, fuehrendes "= " bzw. "_ " = Vorzeichenspalte */
const PT=(s,r,t,w)=>`<div class="${w||'row'} rv" data-s="${s}" data-r="${r}"><div class="eq tks"></div>${t?`<span class="tag">${t}</span>`:''}</div>`;
const RT=(s,r,d)=>`<div class="rule rv" data-s="${s}" data-r="${r}"><div class="eq tks"></div><span>${d}</span></div>`;
const CL=r=>`<div class="claim tks" data-s="0" data-r="${r}"></div>`;
const RES=(s,m)=>`<div class="res rv" data-s="${s}"><div class="eq">$${m}$</div></div>`;
const K=(m,ok,h)=>`<span class="chip" data-hit="${h}" data-ok="${ok}">$${m}$</span>`;
const CH=(s,a,b,c,h)=>`<div class="chips rv" data-s="${s}"><span class="lq">Vermutungen</span>${K(...a,h)}${K(...b,h)}${K(...c,h)}</div>`;
const TOP=(c,h)=>`<div class="top">${c}${h}</div>`;
const P8=['Exponenten addieren','Exponenten multiplizieren','Jeden Faktor potenzieren'];
const S=[
{t:'Äquivalente Terme',e:'$3a^2b=3*a*b*a$',q:'Welche Terme sind äquivalent? Tippt eure Vermutung an.',b:['Probe 1','Probe 2','Vermutung','Begründung'],
h:`<div class="g4">${[['A','6ab',36,36,0],['B','2a*1,5*b',18,18,0],['C','3a^2b',36,54,1],['D','3*a*b*a',36,54,1]].map(([l,t,v1,v2,o])=>`<div class="card" onclick="this.classList.toggle('sel')" data-hit="3" data-ok="${o}"><span class="lb">Term ${l}</span><div class="eq md">$${t}$</div><div class="vl rv" data-s="1">$a = 2; b = 3$ → <b>${v1}</b></div><div class="vl rv" data-s="2">$a = 3; b = 2$ → <b>${v2}</b></div>${o?'<div class="vd rv" data-s="3" data-x="4">Vermutung: äquivalent</div><div class="vd rv" data-s="4">äquivalent – gezeigt</div>':'<div class="vd rv" data-s="3">nicht äquivalent</div>'}</div>`).join('')}</div>
<div class="note rv" data-s="1" data-x="2">Drei Terme liefern 36 – reicht eine Probe?</div>
<div class="note rv" data-s="2" data-x="3">Zweite Probe: Jetzt stimmen nur noch C und D überein (54).</div>
<div class="note rv" data-s="3" data-x="4">Vermutung: C und D sind äquivalent – aber ist das schon bewiesen?</div>
<div class="note pf rv" data-s="4"><div class="pl">$3*a*b*a=3*a*a*b=3a^2b$<span class="tag">Kommutativgesetz · $a*a=a^2$</span></div><div class="pl">$2a*1,5*b=2*1,5*a*b=3ab$<span class="tag">$3ab≠3a^2b$</span></div><div class="sm">Zahlenproben liefern nur eine <b>Vermutung</b> – Äquivalenz zeigt man durch <b>Umformen mit Rechengesetzen</b>.</div></div>`},
{t:'Produkt aufräumen',e:'$3*b*2*a*b$',q:'Wie ordnet man dieses Produkt?',b:['Faktoren ordnen','Faktoren gruppieren','Zusammenfassen','Ergebnis'],
h:`<div class="stack">${PT(0,'_ n3:3 * b1:b * n2:2 * a:a * b2:b')}${PT(1,'= n3:3 * n2:2 * a:a * b1:b * b2:b','Kommutativgesetz: Faktoren vertauschen')}${PT(2,'= ( n3:3 * n2:2 ) * a:a * ( b1:b * b2:b )','Assoziativgesetz: Faktoren gruppieren')}${PT(3,'= s6<n3,n2:6 * a:a * bb<b1,b2:b^2','Zahlen multiplizieren · gleiche Variablen als Potenz')}</div>${RES(4,'3*b*2*a*b=6ab^2')}`},
{t:'Gemeinsam vereinfachen',e:'$4bc*3bc*5a^3c$',q:'Wie vereinfacht man dieses Produkt?',b:['Ordnen','Zahlen zusammenfassen','Potenzen bilden','Ergebnis'],
h:`<div class="stack">${PT(0,'_ n4:4 b1:b c1:c * n3:3 b2:b c2:c * n5:5 a3:a^3 c3:c')}${PT(1,'= n4:4 * n3:3 * n5:5 * a3:a^3 * b1:b * b2:b * c1:c * c2:c * c3:c','Ordnen')}${PT(2,'= s60<n4,n3,n5:60 * a3:a^3 * b1:b * b2:b * c1:c * c2:c * c3:c','Zahlfaktoren: 4·3·5 = 60')}${PT(3,'= s60:60 * a3:a^3 * bb<b1,b2:b^2 * cc<c1,c2,c3:c^3','Gleiche Variablen als Potenz')}</div>${RES(4,'4bc*3bc*5a^3c=60a^3b^2c^3')}`},
{t:'Fehlerdetektiv',e:'$3a*4a=7a^2$ ?',q:'Richtig oder falsch? Stimmt ab.',b:['Probe mit a = 2','Fehler erklären','Faktoren ordnen','Zusammenfassen'],
h:`<div class="vrow"><span class="chip vote" data-hit="1" data-ok="0" onclick="vt(this)">✓ Richtig <b>0</b></span>${CL('n3:3 a1:a * n4:4 a2:a = w:7a^2')}<span class="chip vote" data-hit="1" data-ok="1" onclick="vt(this)">✗ Falsch <b>0</b></span></div>
<div class="note rv" data-s="1">Probe mit $a=2$: links $3*2*4*2=48$, rechts $7*2^2=28$ → ungleich!</div>
<div class="note rv" data-s="2">Fehler: $3+4$ gerechnet – Zahlfaktoren werden aber <b>multipliziert</b>.</div>
${PT(3,'= n3:3 * n4:4 * a1:a * a2:a','Faktoren ordnen')}${PT(4,'= s12<n3,n4:12 * aa<a1,a2:a^2','','res')}`},
{t:'Potenzgesetz 1',e:'$a^2*a^5$',q:'Was ergibt das Produkt? Vermutet.',b:['Vermutung zeigen','Ausschreiben','Klammern auflösen','Zusammenfassen','Regel'],
h:`${TOP(CL('A2:a^2 * A5:a^5 = ?'),CH(1,['a^7',1],['a^{10}',0],['a^3',0],4))}${PT(2,'= ( a1<A2:a * a2<A2:a ) * ( a3<A5:a * a4<A5:a * a5<A5:a * a6<A5:a * a7<A5:a )','2 + 5 Faktoren')}${PT(3,'= a1:a * a2:a * a3:a * a4:a * a5:a * a6:a * a7:a','7 Faktoren a')}${PT(4,'= s7<a1,a2,a3,a4,a5,a6,a7:a^7','Exponent: $2+5=7$')}${RT(5,'ra:a rn:^n * rb:a rm:^m = rc<ra,rb:a re<rn,rm:^{n+m}','Gleiche Basis: Exponenten addieren')}`},
{t:'Potenzgesetz 2',e:'$(xy)^3$',q:'Was passiert, wenn man ein Produkt potenziert?',d:1,b:['Vermutung zeigen','Ausschreiben','Klammern auflösen','Ordnen','Zusammenfassen','Regel'],
h:`${TOP(CL('( X:x Y:y ) E:^3 = ?'),CH(1,['x^3y^3',1],['xy^3',0],['3xy',0],5))}${PT(2,'= ( x1<X:x y1<Y:y ) * ( x2<X:x y2<Y:y ) * ( x3<X:x y3<Y:y )','3 gleiche Faktoren')}${PT(3,'= x1:x * y1:y * x2:x * y2:y * x3:x * y3:y','Klammern auflösen')}${PT(4,'= x1:x * x2:x * x3:x * y1:y * y2:y * y3:y','Ordnen (Kommutativgesetz)')}${PT(5,'= xx<x1,x2,x3:x^3 yy<y1,y2,y3:y^3','Gleiche Faktoren als Potenz')}${RT(6,'( ra:a * rb:b ) rn:^n = ra2<ra:a rn2<rn:^n * rb2<rb:b rn3<rn:^n','Jeder Faktor wird potenziert')}`},
{t:'Potenzgesetz 3',e:'$(a^2)^3$',q:'Was passiert, wenn man eine Potenz potenziert?',b:['Vermutung zeigen','Ausschreiben','Potenzen auflösen','Zusammenfassen','Regel'],
h:`${TOP(CL('( A:a^2 ) F:^3 = ?'),CH(1,['a^6',1],['a^5',0],['a^8',0],4))}${PT(2,'= u1<A:a^2 * u2<A:a^2 * u3<A:a^2','3 gleiche Faktoren')}${PT(3,'= ( p1<u1:a * q1<u1:a ) * ( p2<u2:a * q2<u2:a ) * ( p3<u3:a * q3<u3:a )','je 2 Faktoren a')}${PT(4,'= s6<p1,q1,p2,q2,p3,q3:a^6','3 · 2 = 6 Faktoren')}${RT(5,'( ra:a rn:^n ) rm:^m = rc<ra:a re<rn,rm:^{n*m}','Exponenten multiplizieren')}`},
{t:'Welches Gesetz brauche ich?',e:'$x^3*x^7$ · $(3x)^2$',q:'Erst das passende Prinzip wählen, dann die Lösung.',b:['Prinzip prüfen','Lösung'],
h:`<div class="stack">${[['x^3*x^7',0,'x^{10}',[0,1,2]],['(x^3)^7',1,'x^{21}',[2,0,1]],['(3x)^2',2,'3^2*x^2=9x^2',[1,2,0]]].map(([t,c,r,o])=>`<div class="row t8"><div class="eq sm">$${t}$</div><div class="chips">${o.map(i=>`<span class="chip" data-hit="1" data-ok="${i==c?1:0}" onclick="pk(this)">${P8[i]}</span>`).join('')}</div><div class="eq sm fd" data-s="2">$=${r}$</div></div>`).join('')}</div>`},
{t:'Falle: Summe oder Produkt?',e:'$x^3+x^5≠x^8$',q:'Welche Aussage stimmt? Begründet.',b:['Probe x = 2','Erklärung','Fazit'],
h:`<div class="two"><div class="card" onclick="this.classList.toggle('sel')" data-hit="1" data-ok="0"><div class="eq md">$x^3+x^5=x^8$</div><div class="vl rv" data-s="1">Probe $x = 2$: $8+32=40$, aber $2^8=256$ → <b>✗ falsch</b></div><div class="vl rv" data-s="2">$x*x*x+x*x*x*x*x$ – Summe: Exponenten werden nicht addiert.</div></div>
<div class="card" onclick="this.classList.toggle('sel')" data-hit="1" data-ok="1"><div class="eq md">$x^3*x^5=x^8$</div><div class="vl rv" data-s="1">Probe $x = 2$: $8*32=256=2^8$ → <b>✓ stimmt</b></div><div class="vl rv" data-s="2">$x*x*x*x*x*x*x*x=x^8$ – 3 + 5 = 8 Faktoren.</div></div></div>
<div class="note rv" data-s="3">Potenzgesetze gelten für <b>Produkte</b> – nicht für Summen.</div>`},
{t:'Abschluss',e:'Gesetze &amp; Strategie',q:'Das Wichtigste auf einen Blick',b:['Strategie zeigen'],
