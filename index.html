<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mathematik – Interaktive Lernpfade</title>

<style>
  body{
    margin:0;
    background:#f6f7f9;
    color:#1b2430;
    font-family:"Segoe UI",system-ui,-apple-system,"Helvetica Neue",Arial,sans-serif;
  }

  main{
    max-width:900px;
    margin:0 auto;
    padding:40px 20px;
  }

  h1{
    color:#1f4e79;
    margin-bottom:8px;
  }

  .subtitle{
    color:#4a5566;
    margin-bottom:32px;
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(2,minmax(0,1fr));
    gap:20px;
  }

  .card{
    background:#fff;
    border:1px solid #dde2e9;
    border-radius:10px;
    padding:24px;
  }

  h2{
    margin-top:0;
    color:#1f4e79;
  }

  .card p{
    color:#4a5566;
  }

  a{
    display:inline-block;
    margin-top:8px;
    padding:11px 16px;
    border-radius:8px;
    background:#1f4e79;
    color:#fff;
    text-decoration:none;
    font-weight:600;
  }

  a:hover{
    background:#17405f;
  }

  @media(max-width:650px){
    .grid{
      grid-template-columns:1fr;
    }
  }
</style>
</head>

<body>

<main>

  <h1>Mathematik – Interaktive Lernpfade</h1>
  <p class="subtitle">Übersicht nach Jahrgangsstufen</p>

  <div class="grid">

    <div class="card">
      <h2>Jahrgangsstufe 10</h2>
      <p>Interaktive Lernpfade für die 10. Klasse.</p>
      <a href="klasse-10/">Zu den Lernpfaden</a>
    </div>

    <div class="card">
      <h2>Jahrgangsstufe 13</h2>
      <p>Interaktive Lernpfade für die 13. Klasse.</p>
      <a href="klasse-13/">Zu den Lernpfaden</a>
    </div>

  </div>

</main>

</body>
</html>
