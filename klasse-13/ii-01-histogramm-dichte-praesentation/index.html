<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Vom Histogramm zur Dichte</title>
<style>
:root{--ac:#4f46e5;--ac2:#eceaff;--ink:#14172b;--mut:#6a7090;--ok:#0f9d6b;--okb:#e1f7ee;--no:#d9363e;--nob:#fdeced;--pos:#4f46e5;--neg:#ea7a14;--fc:#3730a3;--gc:#0d9488;--math:"Cambria Math","STIX Two Math","Latin Modern Math",Cambria,"Times New Roman",serif}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#d9dcec;font-family:Inter,"Segoe UI",system-ui,-apple-system,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none;touch-action:manipulation;-webkit-tap-highlight-color:transparent}
body{display:grid;place-items:center}
#st{position:relative;width:min(100vw,177.78vh);height:min(56.25vw,100vh);container-type:size;background:linear-gradient(135deg,#f9faff,#eef0fb);display:grid;grid-template-rows:auto auto 1fr auto;gap:1.8cqh;padding:2.6cqh 3cqw;overflow:hidden}
header{display:flex;align-items:center;gap:1.4cqw}
.bd{width:4.4cqw;height:4.4cqw;border-radius:1.2cqw;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:2.2cqw;font-weight:700}
h1{font-size:2.5cqw;font-weight:700;letter-spacing:-.02em;flex:1}
.rt{display:flex;align-items:center;gap:1.2cqw;color:var(--mut);font-size:1.6cqw;font-weight:600}
#pb{height:.6cqh;background:#dcdff3;border-radius:9px;overflow:hidden}
#pf{display:block;height:100%;background:var(--ac);border-radius:9px;transition:width .5s}
main{min-height:0;display:flex;flex-direction:column}
.sc{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.6cqh;animation:in .45s ease both}
footer{display:flex;justify-content:space-between;align-items:center;gap:1.4cqw}
.g{display:flex;gap:1.2cqw}
.btn{font:inherit;font-size:1.7cqw;font-weight:600;min-height:7cqh;padding:0 2.4cqw;border:0;border-radius:1.4cqw;background:#fff;color:var(--ink);box-shadow:0 .2cqw .9cqw rgba(30,35,80,.12);cursor:pointer;transition:transform .15s,opacity .2s}
.btn:active{transform:scale(.96)}
.btn.p{background:var(--ac);color:#fff;min-width:22cqw}
.btn.d{background:var(--ink);color:#fff}
.btn:disabled{opacity:.35;pointer-events:none}
.btn.ic{min-height:5cqh;padding:0 1.2cqw}
.g .btn.ic{min-height:7cqh}
m,.tx{font-family:var(--math)}
m{white-space:nowrap;font-style:normal}
m i{font-style:italic}
sup,sub{font-size:.62em;line-height:0;font-style:normal;margin-left:.08em}
sup{vertical-align:.7em}sub{vertical-align:-.3em}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;margin:0 .1em;font-size:.88em;line-height:1.15}
.fr>span:first-child{border-bottom:.07em solid currentColor;padding:0 .2em .06em}
.fr>span:last-child{padding:.06em .2em 0}
.in{display:inline-flex;align-items:center;vertical-align:-.5em;margin-right:.12em}
.in .sg{font-size:1.9em;line-height:1;font-weight:300}
.in .lm{display:flex;flex-direction:column;justify-content:space-between;font-size:.55em;height:2.7em;margin-left:-.3em}
.ab{display:inline-block;font-size:1.5em;line-height:.6;vertical-align:-.12em;font-weight:300;margin:0 .04em}
.q{font-size:2cqw;color:var(--mut);font-weight:500}
.q m{font-size:1.15em}
.body{flex:1;min-height:0;display:grid;grid-template-columns:1.6fr 1fr;gap:1.8cqw}
.gp{background:#fff;border-radius:2cqw;box-shadow:0 .4cqw 2cqw rgba(40,45,110,.09);padding:1cqh 1cqw;min-width:0;min-height:0;display:flex}
.gp svg{width:100%;height:100%}
.pn{display:flex;flex-direction:column;gap:1.3cqh;justify-content:center;min-width:0}
.cd{display:flex;align-items:center;gap:1.2cqw;background:#fff;border-radius:1.6cqw;padding:1.5cqh 1.6cqw;box-shadow:0 .3cqw 1.4cqw rgba(40,45,110,.09);border-left:.7cqw solid var(--ac)}
.cd.pos{border-left-color:var(--pos)}.cd.neg{border-left-color:var(--neg)}
.cd.fin{border-left-color:var(--ok);background:var(--okb)}.cd.bad{border-left-color:var(--no);background:var(--nob)}
.nm{flex:none;width:3.2cqw;height:3.2cqw;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center;font-size:1.7cqw}
.cp{display:block;font-size:1.35cqw;font-weight:600;color:var(--mut);margin-bottom:.4cqh}
.cm{font-size:2.2cqw;line-height:1.55}
.ln{display:flex;align-items:center;gap:.9cqw}
.dt{flex:none;width:1.1cqw;height:1.1cqw;border-radius:50%}
.ln.pos .dt{background:var(--pos)}.ln.neg .dt{background:var(--neg)}
.rule{background:#fff;border-left:.7cqw solid var(--ac);border-radius:1.6cqw;padding:1.3cqh 2cqw;box-shadow:0 .4cqw 2cqw rgba(40,45,110,.1);font-size:2.6cqw;text-align:center}
.rv{transition:opacity .5s}
.rv:not(.on){opacity:0;visibility:hidden;pointer-events:none}
/* Diagramm */
.gl{stroke:#e6e9f6;stroke-width:2}
.ax{stroke:var(--ink);stroke-width:3}
.axh{fill:var(--ink)}
.tick{stroke:var(--ink);stroke-width:3}
.tx{font-size:32px;fill:var(--ink);text-anchor:middle}
.tx.nm2{font-size:28px;fill:var(--mut)}
.tx.end{text-anchor:end}
.tx.lg{font-size:42px;font-weight:600}
.tx.pos{fill:var(--pos)}.tx.neg{fill:var(--neg)}.tx.cf{fill:var(--fc)}.tx.cg{fill:var(--gc)}.tx.cc{fill:var(--mut)}
.cv{fill:none;stroke-width:6;stroke-linecap:round;stroke-linejoin:round}
.cv.f{stroke:var(--fc)}.cv.g{stroke:var(--gc)}
.cv.gh{stroke:#aab0cc;stroke-dasharray:14 12;stroke-width:4}
.ar{stroke:none}
.ar.pos{fill:rgba(79,70,229,.28)}.ar.neg{fill:rgba(234,122,20,.34)}.ar.fin{fill:rgba(15,157,107,.42)}
.dl{stroke:var(--mut);stroke-width:3;stroke-dasharray:9 8}
.dot{fill:var(--ac);stroke:#fff;stroke-width:3}
.mini .cv{stroke-width:10}.mini .ax{stroke-width:5}
.sh{transition:transform 1.5s cubic-bezier(.45,0,.2,1)}
.sh.mv{transform:translateY(var(--dy))}
/* Quiz */
.chips{display:flex;gap:1.1cqw;align-items:center}
.chip{font:inherit;font-size:1.6cqw;font-weight:600;flex:1;padding:1.2cqh 1.2cqw;border-radius:1.2cqw;background:#fff;border:.22cqw solid #dfe2f3;text-align:center;cursor:pointer;transition:.3s;color:var(--ink);line-height:1.25}
.chip m{font-size:2.4cqw}
.sel{border-color:var(--ac)!important;background:var(--ac2)!important}
.ok{border-color:var(--ok)!important;background:var(--okb)!important}
.no{border-color:#f0b4b8!important;background:var(--nob)!important}
.chip.no:not(.sel){opacity:.45;background:#fff!important;border-color:#dfe2f3!important}
.qb{background:#fff;border-radius:1.6cqw;padding:1.8cqh 1.6cqw;box-shadow:0 .3cqw 1.4cqw rgba(40,45,110,.09);display:flex;flex-direction:column;gap:1.4cqh}
.qt{font-size:2.3cqw}
.ex{font-size:2cqw;color:var(--ok);font-weight:600}
.stack{flex:1;min-height:0;display:flex;flex-direction:column;gap:1.4cqh;justify-content:center}
.qr{display:grid;grid-template-columns:17cqw 1fr;gap:1.6cqw;align-items:center;background:#fff;border-radius:1.6cqw;padding:1cqh 1.4cqw;box-shadow:0 .3cqw 1.4cqw rgba(40,45,110,.09)}
.qr svg{width:100%;height:auto;display:block}
.qd{font-size:1.9cqw;font-weight:600;margin-bottom:1cqh}
.qd m{font-size:1.15em}
/* Abschluss */
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:1.6cqw;flex:1;min-height:0}
.card{background:#fff;border-radius:2cqw;padding:2cqh 1.6cqw;box-shadow:0 .4cqw 2cqw rgba(40,45,110,.09);display:flex;flex-direction:column;gap:1.4cqh;align-items:center;text-align:center;justify-content:center}
.card svg{width:100%;height:auto;display:block}
.card .t1{font-size:1.9cqw;font-weight:700}
.card .eq{font-size:2.6cqw;min-height:5cqh;display:flex;align-items:center}
.card .t2{font-size:1.5cqw;color:var(--mut)}
.strat{display:flex;align-items:center;gap:1.2cqw}
.st{flex:1;background:#fff;border-radius:1.6cqw;padding:1.6cqh 1.6cqw;font-size:1.8cqw;font-weight:600;display:flex;align-items:center;gap:1.2cqw;box-shadow:0 .3cqw 1.4cqw rgba(40,45,110,.08)}
.st b{flex:none;width:3.4cqw;height:3.4cqw;border-radius:50%;background:var(--ac);color:#fff;display:grid;place-items:center}
.ar2{color:var(--mut);font-size:2.4cqw}
@keyframes in{from{opacity:0;transform:translateX(2.4cqw)}}
@keyframes pop{from{opacity:0;transform:translateY(1.4cqh)}}
#ov{position:absolute;inset:0;background:rgba(236,239,251,.97);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);display:none;flex-direction:column;gap:3cqh;padding:4cqh 3.4cqw;z-index:5}
#ov.on{display:flex;animation:pop .3s}
.oh{display:flex;justify-content:space-between;align-items:center}
.oh h2{font-size:3cqw}
.tiles{flex:1;display:grid;grid-template-columns:repeat(5,1fr);grid-template-rows:1fr 1fr;gap:1.4cqw}
.tile{font:inherit;border:.25cqw solid transparent;background:#fff;border-radius:1.8cqw;padding:2cqh 1.4cqw;text-align:left;display:flex;flex-direction:column;gap:1cqh;cursor:pointer;box-shadow:0 .3cqw 1.4cqw rgba(40,45,110,.09);color:var(--ink)}
.tile b{color:var(--ac);font-size:2cqw}
.tile span{font-size:1.6cqw;font-weight:700}
.tile em{font-style:normal;font-size:1.8cqw;margin-top:auto;color:var(--mut)}
.tile.cur{border-color:var(--ac)}

.body{grid-template-rows:minmax(0,1fr)}.gp{overflow:hidden}.pn{min-height:0}
.cm{font-size:2cqw;line-height:1.4}.cd{padding:1.2cqh 1.5cqw}
.plt text{paint-order:stroke;stroke:#fff;stroke-width:7px;stroke-linejoin:round}
.two{display:grid;grid-template-columns:1fr 1fr;gap:.4cqh 1.6cqw}

.bar{stroke:#fff;stroke-width:2.5}
.bar.pos{fill:rgba(79,70,229,.30)}.bar.hi{fill:rgba(234,122,20,.55)}.bar.hi2{fill:rgba(234,122,20,.85)}.bar.fin{fill:rgba(15,157,107,.42)}
.bar.th{stroke-width:1.2}
.sp{stroke:#fff;stroke-width:3}
.dln{stroke:var(--neg);stroke-width:7;stroke-linecap:round}
.drp circle{fill:var(--ac);opacity:.85}
.qr2{display:grid;grid-template-columns:1fr 24cqw 25cqw;gap:1.6cqw;align-items:center;background:#fff;border-radius:1.6cqw;padding:1.2cqh 1.6cqw;box-shadow:0 .3cqw 1.4cqw rgba(40,45,110,.09)}
.qd2{font-size:2.2cqw;font-weight:600;line-height:1.25}
.qr2 .chip{font-size:2cqw}
.thm{display:flex;flex-direction:column;gap:.4cqh}
.thm svg{width:100%;height:auto;display:block}
.wm{font-size:1.3cqw;color:var(--ok);font-weight:600;text-align:center}
.mr{flex:none;width:11cqw}.mr svg{width:100%;display:block}
.rws{display:flex;flex-direction:column;gap:.6cqh;font-size:1.9cqw;font-family:inherit;min-width:21cqw}
.rw{display:flex;justify-content:space-between;gap:2cqw}.rw b{font-weight:700;color:var(--ac)}
.cm .rws{line-height:1.3}
</style>
</head>
<body>
<div id="st">
<header><div class="bd" id="bd">1</div><h1 id="ti"></h1><div class="rt"><span id="pg"></span><button class="btn ic" onclick="fs()">⛶</button></div></header>
<div id="pb"><i id="pf"></i></div>
<main id="mn"></main>
<footer>
<div class="g"><button class="btn" id="bk" onclick="nav(-1)">‹ Zurück</button><button class="btn" onclick="ov(1)">▦ Übersicht</button></div>
<div class="g"><button class="btn ic" onclick="bk1()" title="Schritt zurück">↶</button><button class="btn p" id="sb" onclick="nx()"></button><button class="btn" onclick="go(cur)">↺ Zurücksetzen</button></div>
<div class="g"><button class="btn d" id="fw" onclick="nav(1)">Weiter ›</button></div>
</footer>
<div id="ov"></div>
</div>
<script>
const g=id=>document.getElementById(id);
/* ---------- Mini-Formelsatz ---------- */
const mt=(s,i)=>{let d=0;for(let j=i;j<s.length;j++){if(s[j]=='{')d++;else if(s[j]=='}'&&--d==0)return j}return s.length};
function M(s){let o='',i=0;
while(i<s.length){const c=s[i];
if(c=='^'||c=='_'){const tg=c=='^'?'sup':'sub';i++;let t;if(s[i]=='{'){const j=mt(s,i);t=s.slice(i+1,j);i=j+1}else{t=s[i];i++}o+=`<${tg}>${M(t)}</${tg}>`}
else if(c=='{'){const j=mt(s,i),p=s.slice(i+1,j).split('|');i=j+1;o+=`<span class="fr"><span>${M(p[0])}</span><span>${M(p[1])}</span></span>`}
else if(c=='@'){const j=s.indexOf('@',i+1),p=s.slice(i+1,j).split(',');i=j+1;o+=`<span class="in"><span class="sg">∫</span><span class="lm"><span>${M(p[1])}</span><span>${M(p[0])}</span></span></span>`}
else if(c=='|'){o+='<span class="ab">|</span>';i++}
else if(/[a-zα-ωΑ-Ω]/i.test(c)){o+='<i>'+c+'</i>';i++}
else{o+=c=='*'?'·':c=='-'?'−':c=='<'?'&lt;':c;i++}}
return o}
const T=s=>s.replace(/\$([^$]+)\$/g,(_,x)=>'<m>'+M(x)+'</m>');
const SM=s=>{let o='',sub=0;for(let i=0;i<s.length;i++){let c=s[i];
if(c=='_'){i++;c=s[i];o+=`<tspan dy="10" font-size="66%"${/[a-z]/i.test(c)?' font-style="italic"':''}>${c}</tspan>`;sub=1;continue}
const it=/[a-z]/i.test(c);o+=`<tspan${sub?' dy="-10"':''}${it?' font-style="italic"':''}>${c=='-'?'−':c}</tspan>`;sub=0}
return o};
/* ---------- Diagramme ---------- */
const A=(c,s,x)=>s==null?`class="${c}"`:`class="rv ${c}" data-s="${s}"${x!=null?` data-x="${x}"`:''}`;
function plot(o){
const W=1000,H=600,mi=o.mini,pl=mi?30:(o.pl||80),pr=mi?30:50,pt=mi?24:34,pb=mi?30:60,[x0,x1]=o.xr,[y0,y1]=o.yr,gs=o.gs||1,gx=o.gx||gs,gy=o.gy||gs;
const sx=(W-pl-pr)/(x1-x0),sy=(H-pt-pb)/(y1-y0),X=x=>pl+(x-x0)*sx,Y=y=>H-pb-(y-y0)*sy,r=v=>Math.round(v*10)/10;
const P={X,Y,sx,sy};
P.path=(f,a,b,n=200)=>{let d='';for(let k=0;k<=n;k++){const x=a+(b-a)*k/n;d+=(k?'L':'M')+r(X(x))+' '+r(Y(f(x)))}return d};
P.area=(f,h,a,b,n=200)=>{let d=P.path(f,a,b,n);for(let k=n;k>=0;k--){const x=a+(b-a)*k/n;d+='L'+r(X(x))+' '+r(Y(h?h(x):0))}return d+'Z'};
P.cv=(c,f,a,b,s,x)=>`<path ${A('cv '+c,s,x)} d="${P.path(f,a,b)}"/>`;
P.ar=(c,f,h,a,b,s,x)=>`<path ${A('ar '+c,s,x)} d="${P.area(f,h,a,b)}"/>`;
P.t=(x,y,s,c,st,xx,dx=0,dy=0)=>`<text ${A('tx '+(c||''),st,xx)} x="${r(X(x)+dx)}" y="${r(Y(y)+dy)}">${SM(s)}</text>`;
P.dot=(x,y,st,xx)=>`<circle ${A('dot',st,xx)} cx="${r(X(x))}" cy="${r(Y(y))}" r="11"/>`;
P.base=()=>{let s='';
if(!mi){for(let v=Math.ceil(x0/gx-1e-6)*gx;v<=x1+1e-6;v+=gx)s+=`<line class="gl" x1="${r(X(v))}" y1="${r(Y(y0))}" x2="${r(X(v))}" y2="${r(Y(y1))}"/>`;
for(let v=Math.ceil(y0/gy-1e-6)*gy;v<=y1+1e-6;v+=gy)s+=`<line class="gl" x1="${r(X(x0))}" y1="${r(Y(v))}" x2="${r(X(x1))}" y2="${r(Y(v))}"/>`}
const ax=X(o.ox!=null?o.ox:0),ay=Y(o.oy!=null?o.oy:0),ex=X(x1),ey=Y(y1);
s+=`<line class="ax" x1="${r(X(x0))}" y1="${r(ay)}" x2="${r(ex-6)}" y2="${r(ay)}"/><line class="ax" x1="${r(ax)}" y1="${r(Y(y0))}" x2="${r(ax)}" y2="${r(ey+6)}"/>`;
s+=`<path class="axh" d="M${r(ex)} ${r(ay)}l-20 -9v18z"/><path class="axh" d="M${r(ax)} ${r(ey)}l-9 20h18z"/>`;
if(!mi){(o.xt||[]).forEach(t=>{const[v,l]=Array.isArray(t)?t:[t,String(t).replace('-','−')];s+=`<line class="tick" x1="${r(X(v))}" y1="${r(ay-8)}" x2="${r(X(v))}" y2="${r(ay+8)}"/><text class="tx nm2" x="${r(X(v))}" y="${r(ay+40)}">${l}</text>`});
(o.yt||[]).forEach(t=>{const[v,l]=Array.isArray(t)?t:[t,String(t).replace('-','−')];s+=`<line class="tick" x1="${r(ax-8)}" y1="${r(Y(v))}" x2="${r(ax+8)}" y2="${r(Y(v))}"/><text class="tx nm2 end" x="${r(ax-18)}" y="${r(Y(v)+10)}">${l}</text>`});
s+=`<text class="tx nm2" x="${r(ex-14)}" y="${r(ay-18)}">${SM('x')}</text><text class="tx nm2" x="${r(ax+28)}" y="${r(ey+36)}">${SM('y')}</text>`}
return s};
P.svg=inner=>`<svg class="plt ${mi?'mini':''}" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${P.base()}${inner}</svg>`;
return P}
/* ---------- Hilfen ---------- */
const r1=v=>Math.round(v*10)/10;
const phi=(x,m,s)=>Math.exp(-.5*((x-m)/s)**2)/(s*Math.sqrt(2*Math.PI));
const bar=(P,a,b,h,c,s,x)=>`<rect ${A('bar '+c,s,x)} x="${r1(P.X(a))}" y="${r1(P.Y(h))}" width="${r1(P.X(b)-P.X(a))}" height="${r1(P.Y(0)-P.Y(h))}"/>`;
const vln=(P,x,h,c,s,xx)=>`<line ${A(c,s,xx)} x1="${r1(P.X(x))}" y1="${r1(P.Y(0))}" x2="${r1(P.X(x))}" y2="${r1(P.Y(h))}"/>`;
function mul(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const ringPath=k=>{const o=k,i=k-1;let d=`M${o} 0A${o} ${o} 0 1 0 ${-o} 0A${o} ${o} 0 1 0 ${o} 0Z`;if(i>0)d+=`M${i} 0A${i} ${i} 0 1 0 ${-i} 0A${i} ${i} 0 1 0 ${i} 0Z`;return d};
/* ---------- Bausteine ---------- */
const C=(s,cls,h,cap,nm)=>`<div class="cd rv ${cls||''}" data-s="${s}">${nm?`<b class="nm">${nm}</b>`:''}<div>${cap?`<span class="cp">${T(cap)}</span>`:''}<div class="cm">${T(h)}</div></div></div>`;
const LN=(c,m)=>`<div class="ln ${c}"><i class="dt"></i>${m}</div>`;
const BODY=(svg,cards,extra)=>`<div class="body"><div class="gp">${svg}</div><div class="pn">${cards}</div></div>${extra||''}`;
const RULE=(s,h)=>`<div class="rule rv" data-s="${s}">${T(h)}</div>`;
const CHP=(t,ok,h)=>`<span class="chip" data-hit="${h}" data-ok="${ok}" onclick="pk(this)">${T(t)}</span>`;
const QB=(title,chips,ex,h)=>`<div class="qb"><div class="qt">${T(title)}</div><div class="chips">${chips}</div><div class="ex rv" data-s="${h}">${T(ex)}</div></div>`;
/* ---------- Folie 1: diskret oder stetig ---------- */
const dots=(xs,dense)=>xs.map(x=>`<circle cx="${x}" cy="26" r="${dense?2.6:7}" fill="#4f46e5"/>`).join('');
const NL=(inner)=>`<svg viewBox="0 0 240 52" preserveAspectRatio="xMidYMid meet"><line x1="6" y1="26" x2="234" y2="26" stroke="#14172b" stroke-width="2.5"/><path d="M236 26l-9-5v10z" fill="#14172b"/>${inner}</svg>`;
const th_a=NL(dots([20,50,80,110,140,170,200]));

h:BODY(svg4,C(1,'','$P(3≤X≤3,5)=0,5·h$<br>also $h=2·P(3≤X≤3,5)$','Breite 0,5: Höhe ≠ Wahrscheinlichkeit')+C(3,'pos','Die Form nähert sich einem rechtwinkligen Dreieck','Immer schmaler')+C(4,'','Die Hypotenuse liegt auf der Ursprungsgeraden $y=m·x$','Grenzfall')+C(5,'fin','${1|2}·5·(m·5)=1$, also $m={2|25}$','Dreiecksfläche = 1')) },

/* ---------- Steuerung ---------- */
let cur=0,step=0;
function go(i){cur=i;step=0;const s=S[i];
g('bd').textContent=i+1;g('ti').textContent=s.t;g('pg').textContent=(i+1)+' / '+S.length;g('pf').style.width=(i+1)/S.length*100+'%';
g('mn').innerHTML='<div class="sc"><div class="q">'+T(s.q)+'</div>'+s.h+'</div>';
g('bk').disabled=!i;g('fw').disabled=i==S.length-1;upd()}
function upd(){const s=S[cur],m=g('mn');
m.querySelectorAll('[data-s]').forEach(e=>{const a=+e.dataset.s,x=e.dataset.x!=null?+e.dataset.x:99;e.classList.toggle('on',step>=a&&step<x)});
m.querySelectorAll('[data-m]').forEach(e=>e.classList.toggle('mv',step>=+e.dataset.m));
m.querySelectorAll('[data-hit]').forEach(e=>{const o=step>=+e.dataset.hit;e.classList.toggle('ok',o&&e.dataset.ok=='1');e.classList.toggle('no',o&&e.dataset.ok!='1')});
const d=step>=s.b.length;g('sb').textContent=d?'✓ Alles gezeigt':s.b[step];g('sb').disabled=d}
function nx(){if(step<S[cur].b.length){step++;upd()}}
function bk1(){if(step>0){step--;upd()}}
function nav(d){const n=cur+d;if(n>=0&&n<S.length)go(n)}
function pk(e){if(step>=+e.dataset.hit)return;[...e.parentNode.children].forEach(c=>c.classList.remove('sel'));e.classList.add('sel')}
function ov(o){const e=g('ov');if(o){e.innerHTML='<div class="oh"><h2>Übersicht</h2><button class="btn" onclick="ov(0)">✕ Schließen</button></div><div class="tiles">'+S.map((s,i)=>`<button class="tile${i==cur?' cur':''}" onclick="ov(0);go(${i})"><b>${i+1}</b><span>${s.t}</span><em>${T(s.e)}</em></button>`).join('')+'</div>'}e.classList.toggle('on',!!o)}
function fs(){try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen()}catch(e){}}
document.addEventListener('keydown',e=>{if(e.key=='ArrowRight')nav(1);else if(e.key=='ArrowLeft')nav(-1);else if(e.key==' '||e.key=='Enter'){e.preventDefault();nx()}else if(e.key=='Backspace'){e.preventDefault();bk1()}else if(e.key=='Escape')ov(0)});
go(0);
</script>
